<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lernwörter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Lernwörter-Liste pro Kind führen (für Lehr- und Fachpersonen). Die Wörter kommen in die Fehlerkiste des Kindes im Rechtschreibtrainer.
   Die Kinder werden über ihre Glückszahl gewählt. Namen (freiwillig) bleiben nur im Browser dieses Geräts. */
:root{--bg:#f3f6fb;--karte:#fff;--ink:#1b2433;--leise:#5f6b85;--linie:#dfe5ef;--akzent:#c2255c;--akzent-soft:#fbe6ee;--warn:#8a5a00;--gut:#127a3c;--falsch:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111726;--karte:#1a2235;--ink:#eef2fb;--leise:#a3aec6;--linie:#2a344c;--akzent:#d9467d;--akzent-soft:#3e1d2b;--warn:#f3d77a;--gut:#6ad895;--falsch:#ff9a8f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 110px}
h1{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:28px;margin:0 0 4px}
.leise{color:var(--leise);font-size:14px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:16px;padding:16px;margin-top:16px}
label{font-weight:700}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--karte);border:1.5px solid var(--linie);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--akzent);outline-offset:1px;border-color:transparent}
.zeile{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--linie);background:var(--karte);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--akzent)}
.btn.primary{background:var(--akzent);border-color:var(--akzent);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.linkish{background:none;border:0;color:var(--leise);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
.fehler{color:var(--falsch);font-weight:700}
.ok{color:var(--gut);font-weight:700}
#gz{font-weight:700;min-width:200px}
/* Tabelle Wort | Satz */
.liste{margin-top:14px;display:grid;gap:8px}
.kopf,.reihe{display:grid;grid-template-columns:28px minmax(110px,1fr) minmax(0,3fr) 36px;gap:8px;align-items:start}
.kopf{font-size:13px;font-weight:700;color:var(--leise);padding:0 2px}
.reihe .nr{color:var(--leise);font-size:13px;padding-top:10px;text-align:right}
.reihe input{width:100%}
.reihe .hw{grid-column:3/4;margin-top:-4px;font-size:12.5px;color:var(--warn)}
.reihe .hw.rot{color:var(--falsch)}
.weg{border:0;background:none;color:var(--leise);cursor:pointer;font-size:18px;padding:6px 0;border-radius:8px}
.weg:hover{color:var(--falsch);background:var(--akzent-soft)}
@media (max-width:600px){
  .kopf{display:none}
  .reihe{grid-template-columns:22px minmax(0,1fr) 32px;border-top:1px solid var(--linie);padding-top:8px}
  .reihe .w{grid-column:2/3}.reihe .x{grid-column:2/3;grid-row:2}.reihe .weg{grid-column:3/4;grid-row:1}
  .reihe .hw{grid-column:2/3;grid-row:3;margin-top:0}
}
.leiste{position:fixed;left:0;right:0;bottom:0;background:var(--karte);border-top:1px solid var(--linie);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.leiste .in{max-width:900px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.leiste .sp{flex:1}
details{margin-top:14px}
summary{cursor:pointer;color:var(--leise);font-size:14px}
textarea{width:100%;min-height:110px;margin-top:8px;resize:vertical;font-size:14px}
dialog{border:1px solid var(--linie);border-radius:16px;background:var(--karte);color:var(--ink);padding:18px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,15,30,.45)}
.namen{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;max-height:55vh;overflow:auto;margin:10px 0}
/* Reiter */
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1.5px solid var(--linie)}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:700;color:var(--leise);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--akzent);border-bottom-color:var(--akzent)}
/* Übersicht */
:root{--mittel:#a35f00;--grau:#c9d1df}
@media (prefers-color-scheme:dark){:root{--mittel:#f0b44c;--grau:#3d4964}}
.balken{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--grau)}
.balken i{display:block;height:100%}
.b-sitzt{background:var(--gut)}.b-arbeit{background:var(--mittel)}.b-neu{background:var(--grau)}
.legende{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--leise);margin:12px 0 4px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ue-kopf,.kind>summary{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(150px,2.2fr) 110px 120px 92px;gap:14px;align-items:center}
.ue-kopf{font-size:13px;font-weight:700;color:var(--leise);padding:14px 10px 6px}
.kind{border-top:1px solid var(--linie)}
.kind>summary{list-style:none;cursor:pointer;padding:10px;border-radius:10px;color:var(--ink)}
.k-name b{color:var(--ink);font-size:16px}
.kind>summary::-webkit-details-marker{display:none}
.kind>summary:hover{background:var(--bg)}
.kind[open]>summary{background:var(--akzent-soft)}
.k-name b::before{content:"▸ ";color:var(--leise)}
.kind[open] .k-name b::before{content:"▾ "}
.lwtxt{font-size:13px;color:var(--leise);margin-top:3px}
.k-zul.alt{color:var(--warn);font-weight:700}
.mobil{display:none}
.k-detail{padding:4px 10px 18px}
.k-detail h3{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:17px;margin:18px 0 6px}
.k-detail .kurz{margin:8px 0 0;font-size:14px}
.wl,.sl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:24px 168px minmax(0,1fr);gap:2px 10px;padding:7px 0;border-top:1px solid var(--linie);align-items:baseline}
.wl .nr{color:var(--leise);font-size:13px;text-align:right}
.wl .satz{color:var(--leise);font-size:13.5px}
.wl .fx{font-size:13.5px;color:var(--falsch)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.sitzt{color:var(--gut);background:color-mix(in srgb,var(--gut) 14%,transparent)}
.pill.eins,.pill.falsch,.pill.offen{color:var(--mittel);background:color-mix(in srgb,var(--mittel) 14%,transparent)}
.pill.neu{color:var(--leise);background:color-mix(in srgb,var(--leise) 14%,transparent)}
.sl li{display:grid;grid-template-columns:150px 190px minmax(0,1fr);gap:2px 10px;padding:6px 0;border-top:1px solid var(--linie);font-size:14px}
@media (max-width:640px){
  .ue-kopf{display:none}
  .kind>summary{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name zul" "lw lw" "kiste tage";gap:6px 10px}
  .k-name{grid-area:name}.k-zul{grid-area:zul;font-size:14px;text-align:right}.k-lw{grid-area:lw}.k-kiste{grid-area:kiste;font-size:14px}.k-tage{grid-area:tage;font-size:14px;text-align:right}
  .mobil{display:inline}
  .wl li{grid-template-columns:22px minmax(0,1fr)}
  .wl li>:nth-child(3){grid-column:2/3}
  .sl li{grid-template-columns:minmax(0,1fr) auto}
  .sl li>:nth-child(3){grid-column:1/3;color:var(--leise)}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lernwörter</h1>
  <p class="leise" style="margin:0">Pro Kind eine Liste mit Wort und Satz. Die Wörter kommen in die Fehlerkiste des Kindes im Rechtschreibtrainer – sobald es den Trainer das nächste Mal öffnet. Unter «Übersicht» siehst du, wie die Kinder damit arbeiten.</p>
  <nav class="tabs" id="tabs" hidden><button data-tab="liste" aria-selected="true">Listen bearbeiten</button><button data-tab="ueb" aria-selected="false">Übersicht</button></nav>
  <div id="app"></div>
  <div id="ueb" hidden></div>
</div>
<div class="leiste" id="leiste" hidden><div class="in"><span id="status" class="leise"></span><span class="sp"></span><button class="btn primary" id="speichern" disabled>Speichern</button></div></div>
<dialog id="dlg"></dialog>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyk0lFil4xRSsFLkPV_RuamQ-XPSU9Hn76HxHjInfYCJyDaVxjsW1S7gQHBP1rYV5dT/exec";
const UEBUNG = "Lernwörter", GZ = Array.from({length:21}, (_,i)=>String(i+1));
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const post = body => fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)}).then(r=>r.json());
let CODE = store.get("lw.code") || "";
let NAMEN = {}; try { NAMEN = JSON.parse(store.get("lw.namen") || "{}") || {}; } catch(e){}
const anzeige = g => NAMEN[g] ? `${g} · ${NAMEN[g]}` : `Glückszahl ${g}`;

/* ---------- Kopierten Text von Schabi lesen (gleich wie in der Lernportal-Station) ----------
   «Nummer  Wort  ganzer Satz» – mit Tabulatoren, Leerzeichen oder auf mehreren Zeilen, auch umgebrochene Sätze,
   Wortgruppen («zu Hause») und Lücken im Satz (___), die mit dem Wort gefüllt werden.
   Nichts wird stillschweigend weggelassen: Was nicht übernommen wird, steht durchgestrichen mit Grund in der Vorschau. */
function lwParse(text){
  const LUECKE = /_{2,}|\.{3,}|…+|\(\s*\)|\[\s*\]/;
  const NUM = /^(\d+)\s*[.):]?(\t|\s+|$)/;
  const istLabel = z => /^(nr\.?|wort|wörter|satz|sätze|lernwörter|beispielsatz|lückensatz)$/i.test(z);
  const UNSICHTBAR = new RegExp("[" + String.fromCharCode(0xAD, 0x200B, 0xFEFF) + "]", "g"), NBSP = String.fromCharCode(0xA0);
  let zeilen = String(text||"").replace(UNSICHTBAR,"").replace(/\r/g,"").split("\n")
    .map(z=>z.split(NBSP).join(" ").replace(/ {2,}/g,"\t").replace(/^[^0-9A-Za-zÄÖÜäöüß_…«»"„“(]+/, "").replace(/\t+/g,"\t").trim())
    .filter(z=>/[A-Za-zÄÖÜäöüß_…]/.test(z) || /^\d+\s*[.):]?$/.test(z));
  const Z = [];   // Silbentrennung am Zeilenende wieder zusammenfügen («Ka-» + «min»)
  zeilen.forEach(z=>{ const v = Z[Z.length-1]; if(v && /[a-zäöüß]-$/i.test(v) && /^[a-zäöüß]/.test(z) && !NUM.test(z)) Z[Z.length-1] = v.slice(0,-1)+z; else Z.push(z); });
  const istSatz = z => LUECKE.test(z) || (/\s/.test(z) && (/[.!?]$/.test(z) || z.split(" ").length > 3));
  const kurz = z => !LUECKE.test(z) && !/[.!?]$/.test(z) && z.split(" ").length <= 3;
  const satzFertig = g => /[.!?»"“”]$/.test((g.zeilen[g.zeilen.length-1]||"").trim());
  const gruppen = [];
  if (Z.some(z=>NUM.test(z))) {
    Z.forEach(z=>{
      const m = z.match(NUM), g = gruppen[gruppen.length-1];
      // neue Nummer = neuer Eintrag – ausser es ist eine Zahl mitten im Satz («Das Buch kostet / 20 Franken.»)
      const neu = m && (!g || m[2] === "\t" || !z.slice(m[0].length).trim() || +m[1] === g.nr + 1 || g.zeilen.length === 0 || satzFertig(g));
      if (neu) { const rest = z.slice(m[0].length).trim(); gruppen.push({nr:+m[1], zeilen: rest ? [rest] : []}); }
      else if (g) g.zeilen.push(z);
      // Zeilen vor der ersten Nummer (Überschrift, Name) werden ignoriert
    });
  } else {
    let g = null;   // ohne Nummern: ein kurzes Wort beginnt einen neuen Eintrag
    Z.filter(z=>!istLabel(z)).forEach(z=>{ const zellen = z.split("\t").map(c=>c.trim()).filter(Boolean);
      if (zellen.length > 1 || !g || (!istSatz(z) && g.zeilen.some(c=>!istSatz(c)))) { g = {nr:null, zeilen:[]}; gruppen.push(g); }
      g.zeilen.push(z); });
  }
  const ARTIKEL = /^(der|die|das|ein|eine)$/i;
  const zerlege = grp => {
    const tab = grp.zeilen.length && grp.zeilen[0].includes("\t");
    const cells = grp.zeilen.flatMap(c=>c.split("\t")).map(c=>c.trim()).filter(Boolean);
    let w = "", x = "", unsicher = false;
    if (cells.length > 1 && kurz(cells[0]) && (!/\s/.test(cells[0]) || tab || /^[A-ZÄÖÜ«"„]/.test(cells[1]))) { w = cells[0]; x = cells.slice(1).join(" "); }
    else if (cells.length) {
      const c = cells.join(" ");
      const klammer = c.match(/^(.*\S)\s*\(([^()]+)\)\s*$/);
      if (klammer && LUECKE.test(klammer[1])) { x = klammer[1]; w = klammer[2].trim(); }
      else if (LUECKE.test(c) && !LUECKE.test(c.split(" ")[0])) { const i = c.indexOf(" "); w = c.slice(0, i); x = c.slice(i+1).trim(); }
      else if (kurz(c)) w = c;
      else {   // «Kollegen Dudley und seine Kollegen jagten …»: das Wort vorne kommt im Satz dahinter nochmals vor
        const t = c.split(" "), klein = v => v.replace(/^[«»"„“”'(]+|[«»"„“”'.,;:!?)]+$/g,"").toLowerCase();
        let n = 0;
        if (t.length > 2 && klein(t[0]) === klein(t[1])) n = 1;
        else if (t.length > 3 && ARTIKEL.test(t[0]) && /^[A-ZÄÖÜ]/.test(t[1]) && t.slice(2).map(klein).includes(klein(t[1]))) n = 2;
        if (!n) for (const k of [3, 2, 1]) { if (t.length <= k + 1) continue;
          const vorne = t.slice(0, k).map(klein), hinten = t.slice(k).map(klein);
          if (hinten.some((_, i) => vorne.every((v, j) => hinten[i + j] === v))) { n = k; break; } }
        if (!n) { n = 1; unsicher = !/^[A-ZÄÖÜ«"„]/.test(t[1] || ""); }
        w = t.slice(0, n).join(" "); x = t.slice(n).join(" ");
      }
    }
    w = w.replace(/^[«»"„“”']+|[«»"„“”'.,;:!?]+$/g, "").trim();
    if (w && LUECKE.test(x)) x = x.replace(LUECKE, (m, off) => /^[\s«»"„“”'(]*$/.test(x.slice(0, off)) ? w.charAt(0).toUpperCase() + w.slice(1) : w);
    return {nr: grp.nr, w, x: x.replace(/\s+/g, " ").trim(), unsicher};
  };
  const gesehen = new Set(), woerter = new Set(), out = [];
  gruppen.map(zerlege).forEach(e=>{
    let {nr, w, x, unsicher} = e;
    if (!w && !x) return;
    const toks = x.split(" ").map(t=>t.replace(/^[«»"„“”'(]+|[«»"„“”'.,;:!?)]+$/g,""));
    if (w.includes("-")) { const ohne = w.replace(/-/g,""); if (!toks.includes(w) && toks.some(t=>t.toLowerCase()===ohne.toLowerCase())) w = ohne; }
    let hw = "", ok = true;
    if (!w) { hw = "kein Wort erkannt"; ok = false; }
    else if (gesehen.has(w + "¦" + x)) { hw = "steht genau so schon weiter oben – wird nur einmal übernommen"; ok = false; }
    else if (w.split(" ").length > 3) { hw = "mehr als drei Wörter – wird nicht übernommen"; ok = false; }
    else if (unsicher) hw = "Wort und Satz unsicher getrennt – bitte prüfen";
    else if (!x) hw = "ohne Beispielsatz";
    else if (LUECKE.test(x)) hw = "Lücke konnte nicht gefüllt werden – bitte prüfen";
    else if (!toks.some((_, i) => w.split(" ").every((v, j) => toks[i + j] === v))) hw = "steht nicht genau so im Satz – wird ohne Lücke geübt";
    if (ok && !hw && woerter.has(w)) hw = "kommt mehrmals vor – wird in jedem Satz geübt";
    if (ok) { gesehen.add(w + "¦" + x); woerter.add(w); }
    out.push({nr, w, x, hw, ok});
  });
  const nrs = out.map(e=>e.nr).filter(n=>n!=null);
  out.fehlend = [];
  if (nrs.length > 1) { const lo = Math.min(...nrs), hi = Math.max(...nrs), da = new Set(nrs); for (let n = lo; n <= hi; n++) if (!da.has(n)) out.fehlend.push(n); }
  return out;
}

/* ---------- 1) Code ---------- */
function codeSeite(meldung){
  $("#leiste").hidden = true; $("#tabs").hidden = true; $("#ueb").hidden = true; $("#app").hidden = false;
  UEB = null; $("#ueb").innerHTML = "";
  $("#app").innerHTML = `<div class="karte">
    <label for="code">Code</label>
    <p class="leise" style="margin:2px 0 10px">Den Code bekommst du von der Klassenlehrperson. Er wird auf diesem Gerät gespeichert, du musst ihn nur einmal eingeben.</p>
    <div class="zeile"><input id="code" type="password" autocomplete="off" style="flex:1;min-width:180px"><button class="btn primary" id="weiter">Weiter</button></div>
    ${meldung ? `<p class="fehler">${esc(meldung)}</p>` : ""}</div>`;
  const f = $("#code"), go = async () => {
    const c = f.value.trim(); if (!c) return f.focus();
    $("#weiter").disabled = true; $("#weiter").textContent = "Prüfe …";
    try {
      const r = await post({typ:"lernwoerter-code", code:c});
      if (r && r.ok) { CODE = c; store.set("lw.code", c); start(); }
      else codeSeite(r && r.typ === undefined && r.fehler === "Unbekannter Typ" ? "Die Seite ist noch nicht freigeschaltet (Google-Skript)." : "Der Code stimmt nicht.");
    } catch(e){ codeSeite("Keine Verbindung – bitte nochmals versuchen."); }
  };
  $("#weiter").onclick = go; f.onkeydown = e => { if (e.key === "Enter") go(); }; f.focus();
}

/* ---------- 2) Liste eines Kindes führen ---------- */
const LISTEN = {};          // geladen: Glückszahl → {t, woerter:[{w,x}]} oder null
let AKTUELL = null, GESPEICHERT = "", ROWS = [];
const laden = g => post({typ:"stand-laden", uebung:UEBUNG, glueckszahl:g}).then(r=>{
    let L = null; try { L = r && r.stand ? JSON.parse(r.stand) : null; } catch(e){}
    LISTEN[g] = L && Array.isArray(L.woerter) ? {t: L.t || r.t, woerter: L.woerter} : null;
  });
const zustand = () => JSON.stringify(ROWS.filter(r=>r.w.trim() || r.x.trim()).map(r=>[r.w.trim(), r.x.trim()]));
const geaendert = () => AKTUELL && zustand() !== GESPEICHERT;

function pruefeReihe(r, alle){
  const w = r.w.trim().replace(/\s+/g," "), x = r.x.trim().replace(/\s+/g," ");
  if (!w && !x) return {hw:"", ok:false, leer:true};
  if (!w) return {hw:"Das Wort fehlt.", rot:true, ok:false};
  if (w.split(" ").length > 3) return {hw:"Höchstens drei Wörter – so wird es nicht gespeichert.", rot:true, ok:false};
  if (alle.filter(o=>o.w.trim().replace(/\s+/g," ")===w && o.x.trim().replace(/\s+/g," ")===x).length > 1 && alle.findIndex(o=>o.w.trim().replace(/\s+/g," ")===w && o.x.trim().replace(/\s+/g," ")===x) !== alle.indexOf(r))
    return {hw:"Steht genau so schon weiter oben – wird nur einmal gespeichert.", ok:false};
  if (!x) return {hw:"Ohne Satz: Das Kind hört nur das Wort.", ok:true};
  const toks = x.split(" ").map(t=>t.replace(/^[«»"„“”'(]+|[«»"„“”'.,;:!?)]+$/g,""));
  if (!toks.some((_, i) => w.split(" ").every((v, j) => toks[i + j] === v))) return {hw:"Das Wort steht nicht genau so im Satz – es wird ohne Lücke geübt.", ok:true};
  return {hw:"", ok:true};
}

function liste(){
  $("#app").innerHTML = `<div class="karte">
      <div class="zeile"><label for="gz">Kind</label><select id="gz"></select>
        <button class="linkish" id="namenBtn">Namen eintragen (nur auf diesem Gerät)</button></div>
      <div class="liste" id="liste"></div>
      <div class="zeile" style="margin-top:10px"><button class="btn" id="plus">+ Zeile</button></div>
      <details id="einf"><summary>Eine Liste einfügen (z. B. von Schabi kopiert)</summary>
        <textarea id="text" placeholder="Nummer, Wort und Satz hier einfügen …"></textarea>

  optionen();

function zeigeKind(g){

function zeichne(fokus){
  if (!ROWS.length || ROWS[ROWS.length-1].w.trim() || ROWS[ROWS.length-1].x.trim()) ROWS.push({w:"", x:""});   // immer eine leere Zeile am Schluss
  const box = $("#liste");
  box.innerHTML = `<div class="kopf"><span></span><span>Wort</span><span>Satz</span><span></span></div>` + ROWS.map((r,i)=>{ const p = pruefeReihe(r, ROWS);
    return `<div class="reihe" data-i="${i}"><span class="nr">${p.leer ? "" : i+1}</span>
      <input class="w" value="${esc(r.w)}" placeholder="Wort" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input class="x" value="${esc(r.x)}" placeholder="Satz, in dem das Wort vorkommt" autocomplete="off" spellcheck="false">
      <button class="weg" title="Zeile löschen" ${p.leer ? "hidden" : ""}>✕</button>
      ${p.hw ? `<span class="hw ${p.rot?"rot":""}">${esc(p.hw)}</span>` : ""}</div>`; }).join("");
  box.querySelectorAll(".reihe").forEach(el=>{
    const i = +el.dataset.i, w = el.querySelector(".w"), x = el.querySelector(".x");
    w.oninput = () => { ROWS[i].w = w.value; nachEingabe(i, el); };
    x.oninput = () => { ROWS[i].x = x.value; nachEingabe(i, el); };
    w.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); x.focus(); } };
    x.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const n = box.querySelector(`.reihe[data-i="${i+1}"] .w`); if (n) n.focus(); else { ROWS.push({w:"",x:""}); zeichne(i+1); } } };
    w.onblur = x.onblur = () => { setTimeout(()=>{ if (!box.contains(document.activeElement)) zeichne(); }, 0); };
    el.querySelector(".weg").onclick = () => { ROWS.splice(i, 1); zeichne(); status(); };

  if (fokus != null) { const f = box.querySelector(`.reihe[data-i="${fokus}"] .w`); if (f) f.focus(); }
}
function nachEingabe(i, el){
  // Hinweis dieser Zeile auffrischen, ohne den Fokus zu verlieren; letzte Zeile benutzt → neue leere Zeile anhängen
  const p = pruefeReihe(ROWS[i], ROWS);
  let hw = el.querySelector(".hw"); if (!hw) { hw = document.createElement("span"); hw.className = "hw"; el.append(hw); }
  hw.textContent = p.hw; hw.className = "hw" + (p.rot ? " rot" : ""); hw.hidden = !p.hw;
  el.querySelector(".nr").textContent = p.leer ? "" : i+1; el.querySelector(".weg").hidden = !!p.leer;
  if (i === ROWS.length-1 && !p.leer) {
    ROWS.push({w:"", x:""});
    const box = $("#liste"), d = document.createElement("div"); box.append(d);
    d.outerHTML = `<div class="reihe" data-i="${ROWS.length-1}"><span class="nr"></span><input class="w" placeholder="Wort" autocomplete="off" autocapitalize="off" spellcheck="false"><input class="x" placeholder="Satz, in dem das Wort vorkommt" autocomplete="off" spellcheck="false"><button class="weg" title="Zeile löschen" hidden>✕</button></div>`;
    const neu = box.lastElementChild, k = ROWS.length-1, w = neu.querySelector(".w"), x = neu.querySelector(".x");
    w.oninput = () => { ROWS[k].w = w.value; nachEingabe(k, neu); };
    x.oninput = () => { ROWS[k].x = x.value; nachEingabe(k, neu); };
    w.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); x.focus(); } };
    x.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ROWS.push({w:"",x:""}); zeichne(k+1); } };
    w.onblur = x.onblur = () => { setTimeout(()=>{ if (!box.contains(document.activeElement)) zeichne(); }, 0); };
    neu.querySelector(".weg").onclick = () => { ROWS.splice(k, 1); zeichne(); status(); };
  }
  status();
}
function zuSpeichern(){
  const gesehen = new Set(), out = [];
  ROWS.forEach(r=>{ const p = pruefeReihe(r, ROWS); if (!p.ok) return;
    const w = r.w.trim().replace(/\s+/g," ").replace(/[.,;:!?]+$/,""), x = r.x.trim().replace(/\s+/g," ");
    if (gesehen.has(w+"¦"+x)) return; gesehen.add(w+"¦"+x); out.push({w, x}); });
  return out;
}
function status(){
  const n = zuSpeichern().length, rot = ROWS.filter(r=>pruefeReihe(r, ROWS).rot).length, L = LISTEN[AKTUELL];
  const b = $("#speichern");
  if (geaendert()) { $("#status").innerHTML = `<b>${n} ${n===1?"Wort":"Wörter"}</b> · noch nicht gespeichert${rot?` · <span class="fehler">${rot===1?"Eine Zeile ist":rot+" Zeilen sind"} rot markiert – bitte zuerst korrigieren</span>`:""}`; b.disabled = rot > 0; b.textContent = "Speichern"; }
  else { $("#status").innerHTML = L ? `<span class="ok">✓ gespeichert</span> · ${L.woerter.length} ${L.woerter.length===1?"Wort":"Wörter"} · ${new Date(L.t).toLocaleDateString("de-CH")}` : `${esc(anzeige(AKTUELL))}: noch keine Lernwörter`; b.disabled = true; b.textContent = "Speichern"; }
}
$("#speichern").onclick = async () => {
  const g = AKTUELL, t = Date.now(), woerter = zuSpeichern(), b = $("#speichern");
  b.disabled = true; b.textContent = "Speichert …";
  try {
    const r = await post({typ:"stand-speichern", uebung:UEBUNG, glueckszahl:g, t, code:CODE, stand:JSON.stringify({v:1, t, woerter})});

    const o = $("#gz").querySelector(`option[value="${g}"]`); if (o) o.textContent = anzeige(g) + `  ✓ ${woerter.length}`;
    if (AKTUELL === g) zeigeKind(g);
  } catch(e){ $("#status").innerHTML = `<span class="fehler">Speichern hat nicht geklappt: ${esc(e.message)}</span>`; b.disabled = false; b.textContent = "Nochmals versuchen"; }
};

/* ---------- 3) Übersicht: Wie arbeiten die Kinder an den Lernwörtern und an der Fehlerkiste? ----------
   Ein Lernwort ist im Rechtschreibtrainer ein Eintrag in der Fehlerkiste. Es «sitzt», wenn es die Fehlerkiste verlassen hat
   (zweimal richtig). Steht es noch nicht im Lernstand des Kindes, hat das Kind den Trainer seit dem Speichern nicht mehr geöffnet. */
const TAG = 864e5, ARTNAME = {etappe:"Etappe", kiste:"Fehlerkiste", regel:"Regeltraining", sb:"Standortbestimmung"};
const SHY = new RegExp(String.fromCharCode(0xAD), "g");
const normT = s => String(s==null?"":s).replace(SHY, "").normalize("NFC").replace(/ß/g,"ss").replace(/ẞ/g,"SS").replace(/[‘’`´]/g,"'").replace(/\s+/g," ").trim();   // wie norm() im Trainer
const PILL = {sitzt:"✓ sitzt", eins:"1× richtig", falsch:"noch nicht richtig", offen:"noch nicht geübt", neu:"noch nicht im Trainer"};
const PILL_TITEL = {sitzt:"Zweimal richtig geschrieben – nicht mehr in der Fehlerkiste.", eins:"Einmal richtig – noch einmal richtig, dann ist es draussen.",
  falsch:"In der Fehlerkiste, bisher nicht richtig geschrieben.", offen:"In der Fehlerkiste, noch nicht geübt.",
  neu:"Kommt in die Fehlerkiste, sobald das Kind den Rechtschreibtrainer das nächste Mal öffnet."};
let UEB = null, UEB_LAEDT = null;
const OFFEN_K = new Set();

async function uebersicht(neu){
  const box = $("#ueb");
  if (UEB && !neu) return zeichneUeb();
  box.innerHTML = `<div class="karte leise">⏳ Die Übersicht wird geladen …</div>`;
  try {
    if (!UEB_LAEDT) UEB_LAEDT = post({typ:"lernwoerter-uebersicht", code:CODE}).finally(() => { UEB_LAEDT = null; });
    const r = await UEB_LAEDT;
    if (r && r.grund === "code") { store.del("lw.code"); CODE = ""; return codeSeite("Der Code stimmt nicht mehr – bitte neu eingeben."); }
    if (!r || !r.ok) throw new Error(r && r.fehler === "Unbekannter Typ" ? "Die Übersicht ist im Google-Skript noch nicht freigeschaltet." : (r && r.fehler) || "Keine Antwort");
    UEB = {kinder: r.kinder || {}, t: Date.now()};
    if (TAB === "ueb") zeichneUeb();
  } catch(e){
    box.innerHTML = `<div class="karte"><p class="fehler" style="margin-top:0">Die Übersicht konnte nicht geladen werden: ${esc(e.message)}</p><button class="btn" id="ueNochmals">Nochmals versuchen</button></div>`;
    $("#ueNochmals").onclick = () => uebersicht(true);
  }
}

function falschGeschrieben(A){ return [...new Set(A.filter(a => !a.ok && a.a).map(a => String(a.a).slice(0, 40)))].slice(0, 4); }

function kindModell(g){
  const K = (UEB && UEB.kinder[g]) || {}, st = K.stand || null, kiste = (st && st.kiste) || {}, lwSet = new Set((st && st.lw) || []);
  const L = g in LISTEN ? LISTEN[g] : K.lernwoerter;   // nach dem Speichern gilt die neue Liste sofort
  // Antworten (doppelt gesendete nur einmal) nach Wort; Teil-Sendungen einer Übung über ihren Start zusammenfassen
  const doppelt = new Set(), antw = {}, sitz = {};
  (K.runden || []).forEach(r => {
    const id = r.start || r.zeit;
    const s = sitz[id] || (sitz[id] = {start: r.start || 0, ende: 0, art: r.art, lw: [0, 0], ki: [0, 0]});
    s.ende = Math.max(s.ende, r.zeit || 0);
    (r.antworten || []).forEach(a => {
      const k = a.w + "|" + a.t + "|" + a.a + "|" + a.ok; if (doppelt.has(k)) return; doppelt.add(k);
      (antw[a.w] = antw[a.w] || []).push(a);
      const z = a.lw ? s.lw : s.ki; z[1]++; if (a.ok) z[0]++;
    });
  });
  Object.values(antw).forEach(A => A.sort((a, b) => b.t - a.t));
  const eintraege = Object.entries(kiste).map(([key, v]) => Object.assign({key}, v)), benutzt = new Set();
  const frei = v => !benutzt.has(v.key);
  const woerter = ((L && L.woerter) || []).map((e, i) => {
    const w = normT(e.w).replace(/[.!?,;:]+$/, ""), x = normT(e.x), lk = w + "¦" + x;
    const da = lwSet.has(lk) || lwSet.has(w);
    let k = eintraege.find(v => v.lk === lk && frei(v)) || eintraege.find(v => !v.lk && v.lw && v.w === w && frei(v));
    if (!k && da) k = eintraege.find(v => !v.lk && v.w === w && frei(v));   // sass schon, wurde später wieder falsch geschrieben
    if (k) benutzt.add(k.key);
    const A = antw[w] || [];
    const s = !da ? "neu" : !k ? "sitzt" : (k.n || 0) >= 1 ? "eins" : A.length ? "falsch" : "offen";
    return {nr: i + 1, w: e.w, x: e.x, s, falsch: falschGeschrieben(A)};
  });
  // übrige Fehlerkiste: Wörter aus den eigenen Fehlern (Einträge alter Listen verschwinden beim nächsten Öffnen)
  const rest = eintraege.filter(v => frei(v) && !v.lk).sort((a, b) => (b.t || 0) - (a.t || 0))
    .map(v => ({w: v.w, s: (v.n || 0) >= 1 ? "eins" : "falsch", falsch: falschGeschrieben(antw[v.w] || [])}));
  const sitzungen = Object.values(sitz).sort((a, b) => b.ende - a.ende);
  const seit = Date.now() - 14 * TAG, tage = new Set(), z14 = {lw: [0, 0], ki: [0, 0]};
  sitzungen.forEach(s => { if (s.ende >= seit) { tage.add(new Date(s.ende).toDateString()); ["lw", "ki"].forEach(a => { z14[a][0] += s[a][0]; z14[a][1] += s[a][1]; }); } });
  const c = {sitzt: 0, arbeit: 0, neu: 0};
  woerter.forEach(w => c[w.s === "sitzt" ? "sitzt" : w.s === "neu" ? "neu" : "arbeit"]++);
  return {g, woerter, rest, c, sitzungen, kisteN: Object.keys(kiste).length, tage14: tage.size, z14,
    zuletzt: sitzungen.length ? sitzungen[0].ende : 0, daten: !!(st || woerter.length || sitzungen.length)};
}

function wann(t){
  if (!t) return "–";
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  const n = Math.round((heute - d) / TAG);
  return n <= 0 ? "heute" : n === 1 ? "gestern" : n < 7 ? `vor ${n} Tagen` : new Date(t).toLocaleDateString("de-CH", {day: "numeric", month: "numeric"});
}
const datumZeit = t => new Date(t).toLocaleDateString("de-CH", {weekday: "short", day: "numeric", month: "numeric"}) + ", " + new Date(t).toLocaleTimeString("de-CH", {hour: "2-digit", minute: "2-digit"});
const balken = c => { const n = c.sitzt + c.arbeit + c.neu; return `<div class="balken" title="${c.sitzt} sitzen · ${c.arbeit} in der Fehlerkiste · ${c.neu} noch nicht im Trainer">`
  + ["sitzt", "arbeit", "neu"].filter(k => c[k]).map(k => `<i class="b-${k}" style="width:${c[k] / n * 100}%"></i>`).join("") + `</div>`; };
const anteil = (z, wort) => z[1] ? `${wort} ${z[0]} von ${z[1]} richtig` : "";

function zeichneUeb(){
  const box = $("#ueb"), M = GZ.map(kindModell), mit = M.filter(m => m.daten), ohne = M.filter(m => !m.daten).map(m => m.g);
  const C = mit.reduce((s, m) => ({sitzt: s.sitzt + m.c.sitzt, arbeit: s.arbeit + m.c.arbeit, neu: s.neu + m.c.neu}), {sitzt: 0, arbeit: 0, neu: 0});
  const total = C.sitzt + C.arbeit + C.neu;
  const zeile = m => { const n = m.woerter.length, alt = n && (!m.zuletzt || m.zuletzt < Date.now() - 7 * TAG);
    return `<details class="kind" data-g="${m.g}"${OFFEN_K.has(m.g) ? " open" : ""}><summary>
      <span class="k-name"><b>${esc(anzeige(m.g))}</b></span>
      <span class="k-lw">${n ? balken(m.c) + `<div class="lwtxt">${m.c.sitzt} von ${n} ${n === 1 ? "Lernwort sitzt" : "Lernwörtern sitzen"}</div>` : `<span class="leise">keine Lernwörter</span>`}</span>
      <span class="k-kiste">📦 ${m.kisteN} <span class="leise">${m.kisteN === 1 ? "Wort" : "Wörter"}</span></span>
      <span class="k-tage">${m.tage14 ? `${m.tage14} ${m.tage14 === 1 ? "Tag" : "Tage"}<span class="mobil leise"> geübt (14 Tage)</span>` : `<span class="leise">nicht geübt<span class="mobil"> (14 Tage)</span></span>`}</span>
      <span class="k-zul${alt ? " alt" : ""}">${m.zuletzt ? `<span class="mobil leise">zuletzt </span>${wann(m.zuletzt)}` : "–"}</span>
    </summary><div class="k-detail">${detail(m)}</div></details>`; };
  box.innerHTML = `<div class="karte">
      <div class="zeile"><div style="flex:1;min-width:220px"><b>Klasse:</b> ${total ? `${C.sitzt} von ${total} Lernwörtern sitzen · ${C.arbeit} in der Fehlerkiste${C.neu ? ` · ${C.neu} noch nicht im Trainer` : ""}` : "noch keine Lernwörter"}
        <div class="leise">Stand ${datumZeit(UEB.t)} · Übungen der letzten 60 Tage</div></div>
        <button class="btn" id="ueNeu">↻ Aktualisieren</button></div>
      <div class="legende"><span><i class="b-sitzt"></i>sitzt (zweimal richtig)</span><span><i class="b-arbeit"></i>in der Fehlerkiste</span><span><i class="b-neu"></i>noch nicht im Trainer</span></div>
      <div class="ue-kopf"><span>Kind</span><span>Lernwörter</span><span>Fehlerkiste</span><span>Geübt (14 Tage)</span><span>Zuletzt</span></div>
      ${mit.map(zeile).join("") || `<p class="leise">Noch keine Daten.</p>`}
      ${ohne.length && mit.length ? `<p class="leise" style="margin-bottom:0">Noch keine Daten: Glückszahl ${ohne.map(g => esc(NAMEN[g] ? `${g} (${NAMEN[g]})` : g)).join(", ")}</p>` : ""}
    </div>
    <p class="leise" style="margin-top:12px">Ein Lernwort <b>sitzt</b>, wenn das Kind es in der Fehlerkiste zweimal richtig geschrieben hat – dann verlässt es die Fehlerkiste. In der Fehlerkiste sind auch Wörter, die das Kind beim Üben falsch geschrieben hat. Neue oder geänderte Lernwörter kommen hinein, sobald das Kind den Rechtschreibtrainer das nächste Mal öffnet. Tippe auf ein Kind für die Einzelheiten.</p>`;
  $("#ueNeu").onclick = () => uebersicht(true);
  box.querySelectorAll("details.kind").forEach(d => d.ontoggle = () => { d.open ? OFFEN_K.add(d.dataset.g) : OFFEN_K.delete(d.dataset.g); });
  box.querySelectorAll("[data-bearbeiten]").forEach(b => b.onclick = () => bearbeite(b.dataset.bearbeiten));
}

function detail(m){
  const pill = s => `<span class="pill ${s}" title="${esc(PILL_TITEL[s])}">${PILL[s]}</span>`;
  const fx = f => f.length ? `<div class="fx">falsch geschrieben: ${f.map(esc).join(" · ")}</div>` : "";
  let h = `<p class="kurz">${m.tage14 ? `In den letzten 14 Tagen an <b>${m.tage14} ${m.tage14 === 1 ? "Tag" : "Tagen"}</b> geübt` : "In den letzten 14 Tagen nicht geübt"}${
    [anteil(m.z14.lw, "Lernwörter:"), anteil(m.z14.ki, "übrige Fehlerkiste:")].filter(Boolean).map(t => " · " + t).join("")}.</p>`;
  h += `<h3>Lernwörter</h3>` + (m.woerter.length
    ? `<ul class="wl">${m.woerter.map(w => `<li><span class="nr">${w.nr}</span><span>${pill(w.s)}</span><span><b>${esc(w.w)}</b>${w.x ? ` <span class="satz">${esc(w.x)}</span>` : ""}${fx(w.falsch)}</span></li>`).join("")}</ul>`
    : `<p class="leise" style="margin:0">Für dieses Kind gibt es noch keine Lernwörter.</p>`);
  h += `<h3>Weitere Wörter in der Fehlerkiste <span class="leise">(${m.rest.length})</span></h3>` + (m.rest.length
    ? `<p class="leise" style="margin:0 0 4px;font-size:14px">Wörter, die das Kind beim Üben falsch geschrieben hat.</p><ul class="wl">${m.rest.map((w, i) => `<li><span class="nr">${i + 1}</span><span>${pill(w.s)}</span><span><b>${esc(w.w)}</b>${fx(w.falsch)}</span></li>`).join("")}</ul>`
    : `<p class="leise" style="margin:0">Keine.</p>`);
  const dauer = s => { const min = (s.ende - s.start) / 6e4; return s.start && min > 0.5 && min < 180 ? ` · ${Math.max(1, Math.round(min))} Min.` : ""; };
  h += `<h3>Letzte Übungen im Rechtschreibtrainer</h3>` + (m.sitzungen.length
    ? `<ul class="sl">${m.sitzungen.slice(0, 8).map(s => `<li><span>${datumZeit(s.ende)}</span><span>${esc(ARTNAME[s.art] || "Übung")}${dauer(s)}</span><span>${[anteil(s.lw, "Lernwörter"), anteil(s.ki, "Fehlerkiste")].filter(Boolean).join(" · ") || `<span class="leise">ohne Lernwörter / Fehlerkiste</span>`}</span></li>`).join("")}</ul>`
    : `<p class="leise" style="margin:0">In den letzten 60 Tagen keine Übungen.</p>`);
  return h + `<div class="zeile" style="margin-top:14px"><button class="btn" data-bearbeiten="${m.g}">✎ Lernwörter-Liste bearbeiten</button></div>`;
}

function bearbeite(g){
  zeigeTab("liste");
  if (AKTUELL !== g) { if (geaendert() && !confirm("Die Änderungen sind noch nicht gespeichert. Trotzdem wechseln?")) return; zeigeKind(g); }
  window.scrollTo(0, 0);
}

if (CODE) start(); else codeSeite();
</script>
</body>
</html>
