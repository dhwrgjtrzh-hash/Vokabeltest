<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechtschreibung üben</title>
<link rel="icon" type="image/png" href="icons/icon-rechtschreibung-64.png">
<link rel="apple-touch-icon" href="icons/icon-rechtschreibung-180.png">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1b2433; --mute:#64708a; --line:#dfe5ef;
  --accent:#2f5bea; --accent-soft:#e8eeff; --good:#127a3c; --good-bg:#dcf5e4; --bad:#b42318; --bad-bg:#fde4e1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:18px 16px 48px}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto}
.wrap.wide{max-width:1180px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{min-width:48px;height:48px;padding:0 8px;border-radius:14px;background:#0f8a6b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;flex:none}
header h1{font-size:1.5rem;margin:0;line-height:1.15;min-width:0}
header .pill{flex:none}
header h1 small{display:block;font-size:.8rem;font-weight:600;color:var(--mute)}
header .grow{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 2px 8px rgba(27,36,51,.05)}
.sub{color:var(--mute);margin:0 0 16px}
.muted{color:var(--mute);font-size:.85rem;font-weight:400}
h2{font-size:1.2rem;margin:0 0 6px}
h3{font-size:1.02rem;margin:22px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}

/* Start */
.who{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:22px}
.who label{font-weight:700}
.gzchip{background:var(--accent-soft);border-radius:999px;padding:6px 14px;font-weight:600}
.gzchip b{font-size:1.15rem;margin-left:4px}
.pad-card{max-width:440px;margin:0 auto;text-align:center}
.gzanz{display:flex;justify-content:center;gap:8px;margin:6px 0 18px;min-height:64px}
.gzanz span{width:52px;height:64px;border:3px solid var(--accent);border-radius:14px;display:grid;place-items:center;font-size:2.2rem;font-weight:800;background:#fff}
.gzanz span.leer{border-color:var(--line);color:#a3adbf}
.gzanz.gross span{width:64px;height:78px;font-size:2.8rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{height:72px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:1.9rem;font-weight:800;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pad button:active{transform:scale(.96);background:var(--accent-soft)}
.pad .del{font-size:1.5rem;color:var(--mute)}
.pad .ok{background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.3rem}
.pad .ok:disabled{opacity:.35}
.who .note{color:var(--mute);font-size:.88rem;flex-basis:100%;margin:0}
.warn{background:#fff6dc;border:2px solid #f3d98a;border-radius:14px;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.intro{background:var(--accent-soft);border-radius:18px;padding:18px 20px}
.intro p{margin:6px 0 12px}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px;position:relative}
.node{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.node b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--mute);font-weight:800;font-size:1.1rem;border:3px solid transparent}
.node span{font-size:.72rem;color:var(--mute);line-height:1.2}
.node.done b{background:#3fbf6f;color:#fff}
.node.now b{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.node.now span{color:var(--ink);font-weight:700}
.etappe{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;background:#f8faff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:#3fbf6f}
.dots span{font-size:.9rem;font-weight:700;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:110px}
.tile .ic{font-size:1.5rem;line-height:1}
.tile b{font-size:1.02rem}
.tile span{color:var(--mute);font-size:.85rem;line-height:1.3}
.tile:disabled{opacity:.55;cursor:default}
.tile.hot{border-color:#f5a400;background:#fffaf0}
.badge{font-style:normal;background:var(--accent);color:#fff;border-radius:999px;padding:0 8px;font-size:.8rem;margin-left:4px}
details.mine{margin-top:18px;border:2px solid var(--line);border-radius:16px;padding:4px 16px}
details.mine summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none}
details.mine summary::-webkit-details-marker{display:none}
.mlist{display:grid;gap:8px;padding:4px 0 8px}
.mrow{display:grid;grid-template-columns:9.5em 1fr 3em;gap:10px;align-items:center;font-size:.9rem}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.teacher{margin-top:22px;text-align:right}
.linkish{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:4px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.topic{--c:#2f5bea;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:12px 14px;cursor:pointer}
.topic b{display:block;font-size:.98rem;margin-bottom:2px}
.topic span span{display:block;color:var(--mute);font-size:.82rem}

/* Knöpfe & Eingaben */
.btn{font-weight:700;border:0;border-radius:14px;padding:14px 26px;background:var(--accent);color:#fff;cursor:pointer;min-height:54px;font-size:1.05rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:8px 14px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.4}
.big-btn{flex-direction:column;align-items:flex-start;text-align:left;line-height:1.25}
.big-btn small{font-weight:600;opacity:.85;font-size:.8rem}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.resume{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
input.ans,textarea.ans{font:inherit;font-size:1.6rem;font-weight:700;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);-webkit-appearance:none;max-width:100%}
input.ans.small{width:5.2em;text-align:center}
.ans.wide{width:100%}
textarea.ans{resize:none;font-size:1.4rem;line-height:1.4}
.ans:focus{outline:none;border-color:var(--accent)}
.ans.ok{border-color:#3fbf6f;background:var(--good-bg)}
.ans.no{border-color:#ef7b6f;background:var(--bad-bg)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Aufgabe */
.sesshead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.qtype{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;background:var(--accent-soft);color:#24439e}
.progress{display:flex;gap:4px;margin:0 0 18px}
.progress i{flex:1;height:10px;border-radius:999px;background:var(--line)}
.progress i.ok{background:#3fbf6f}.progress i.half{background:#f5c04a}.progress i.no{background:#ef7b6f}.progress i.now{background:var(--accent)}
.hear{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.hearbtn{font-size:1.2rem;padding:16px 30px}
.hear small{font-weight:600;opacity:.7}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 8px}
.luecke{font-size:1.35rem;line-height:1.7;margin:4px 0 10px;background:#f6f8fd;border-radius:14px;padding:10px 14px}
.luecke .gap{display:inline-block;border-bottom:3px solid var(--accent);min-width:3em;margin:0 2px}
.flash{font-size:2rem;font-weight:800;padding:14px 0;transition:opacity .3s}
.flash.hidden{opacity:0}

/* Rückmeldung */
.explain{margin-top:16px;border-radius:16px;background:#fff8ec;border:2px solid #f6d39b;padding:14px 18px}
.explain h3{margin:0 0 6px;font-size:1.05rem;color:#8a3c06}
.explain.ok{background:#f2fbf5;border-color:#bfe8cc}
.explain.ok h3{color:var(--good)}
.lab{margin:10px 0 2px;font-size:.85rem;font-weight:700;color:var(--mute)}
.satz{font-size:1.25rem;line-height:1.9;margin:0}
.tok{display:inline-block;padding:0 3px;border-radius:6px}
.tok.good{color:var(--good)}
.tok.bad{background:var(--bad-bg)}
.tok.fix{background:#dcf5e4;font-weight:700}
.tok.miss{color:var(--bad);font-weight:800}
.tok.extra{text-decoration:line-through;color:var(--bad)}
mark.x{background:#ffb4a8;color:#7a0d03;border-radius:3px;padding:0 1px}
mark.y{background:#b9ecc9;color:#0a5a2a;border-radius:3px;padding:0 1px;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.fix-card{margin-top:14px;border:3px solid var(--accent);border-radius:18px;padding:16px 18px;background:#fbfcff}
.wort{font-size:2.1rem;font-weight:800;margin:0;letter-spacing:.02em;word-break:break-word}
.wort.falsch{color:#7a2a20}
.wort.zu{color:var(--line);letter-spacing:.15em}
.rule{--c:#2f5bea;margin-top:12px;border-left:6px solid var(--c);background:#f6f8fd;border-radius:0 14px 14px 0;padding:10px 14px}
.rule h3{margin:0 0 4px;font-size:.95rem;color:var(--c)}
.rule p{margin:0;font-size:.95rem}
.big-rule{margin-top:16px}
.big-rule p{font-size:1.05rem}
.again{background:var(--bad-bg);color:var(--bad);font-weight:700;border-radius:12px;padding:8px 12px;margin-bottom:6px}

/* Resultat */
.result{text-align:center}
.result .score{font-size:3.4rem;font-weight:800;margin:4px 0}
.stars{font-size:2.4rem;letter-spacing:.12em;margin:2px 0 8px}
.sent{display:block;margin-top:10px;font-size:.9rem;color:var(--mute)}
.sent.ok{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.chips span{background:var(--accent-soft);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem}
.sbq{display:grid;gap:8px;max-width:440px;margin:14px auto 0;text-align:left}
.sbq>div{display:grid;grid-template-columns:5em 1fr 3em;gap:10px;align-items:center;font-size:.92rem}
.sbq b{text-align:right}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:#3fbf6f;border-radius:999px}

/* Lehrperson */
.wide-card{max-width:none}
.tscroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
table.t{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{color:var(--mute);font-weight:700;font-size:.72rem;letter-spacing:.02em;line-height:1.2}
table.t th.vert{min-width:62px;max-width:76px;white-space:normal;font-size:.66rem;hyphens:auto;-webkit-hyphens:auto}
table.t tr.klick{cursor:pointer}
table.t th.sortbar{cursor:pointer;user-select:none;-webkit-user-select:none}
.zeit{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.8rem;font-weight:700;cursor:help}
.zeit.viel{background:var(--good-bg);color:var(--good)}.zeit.mittel{background:#fff3cd;color:#8a6100}.zeit.wenig{background:#eef2fa;color:#45506a}
table.zt small.uhr{display:block;font-size:.68rem;color:var(--mute);margin-top:2px;white-space:nowrap}
.verwaltung{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:.88rem}
.doppelt{display:inline-block;background:#fff3cd;color:#8a6100;border-radius:999px;padding:0 8px;font-size:.75rem;font-weight:700;white-space:nowrap}
table.t th.sortbar:hover{color:var(--ink)}
table.t th.sortbar.an{color:var(--accent)}
table.t th .pfeil{font-size:.7rem}
table.t tr.klick:hover td{background:#f6f8fd}
.num{text-align:right!important;white-space:nowrap}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.8rem;font-weight:700}
.tag.ok{background:var(--good-bg);color:var(--good)}.tag.half{background:#fff3cd;color:#8a6100}.tag.no{background:var(--bad-bg);color:var(--bad)}
.cbars{display:grid;gap:8px}
.cbar{display:grid;grid-template-columns:minmax(10em,22em) 1fr 3em;gap:12px;align-items:center;font-size:.9rem}
.cbar b{text-align:right}
.namen{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.namen label{display:flex;align-items:center;gap:10px}
.namen b{min-width:2.4em;text-align:right}
.namen .ans{font-size:1.05rem;padding:8px 10px;width:100%}
.ptitle{font-size:1.7rem;margin:2px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpis div{background:#f6f8fd;border-radius:14px;padding:12px 14px}
.kpis b{display:block;font-size:1.4rem}
.kpis span{font-size:.78rem;color:var(--mute);line-height:1.2;display:block}
.assess{margin-top:16px;background:#f2fbf5;border:2px solid #bfe8cc;border-radius:16px;padding:6px 18px 8px}
.assess h3{margin:10px 0 4px;color:var(--good)}
.assess p{margin:6px 0;font-size:.95rem}
.pbars{display:grid;gap:12px}
.prow{display:grid;grid-template-columns:minmax(12em,20em) 1fr 3em;gap:4px 12px;align-items:center}
.pname b{display:block;font-size:.92rem}
.pname .muted{font-size:.76rem}
.pp{text-align:right;font-variant-numeric:tabular-nums}
.bsp{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--mute)}
.bsp s{color:var(--bad)}
.verlauf{width:100%;height:auto;max-width:700px;color:var(--ink)}
.satzliste{list-style:none;padding:0;margin:0}
.satzliste li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem;line-height:1.6}
.stufenlegende{margin-top:22px;font-size:.75rem}

@media (max-width:560px){
  body{font-size:17px;padding:12px}
  .card{padding:16px;border-radius:18px}
  .node span{display:none}
  input.ans,textarea.ans{font-size:1.35rem}
  .wort{font-size:1.7rem}
  .prow,.cbar{grid-template-columns:1fr 3em}
  .prow .bar,.cbar .bar{grid-column:1/3;grid-row:2}
  .bsp{grid-column:1/3}
}
body.eingebettet{padding:10px 12px 30px}
body.eingebettet header{display:none}
@media print{
  body{background:#fff;padding:0;font-size:12pt}
  header,.no-print,.teacher{display:none!important}
  .card{box-shadow:none;border:0;padding:0}
  .wrap.wide{max-width:none}
  .assess,.kpis div{break-inside:avoid}
  .prow{break-inside:avoid}
  h3{break-after:avoid}
  .tag,.bar i,mark,.kpis div,.assess{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  <header>

  <main id="app"></main>
</div>

const CAT_ORDER = ["GK","NG","DK","CK","IE","DH","AV","AE","V","DS","SO"];

const VOK = "aeiouäöüy";
const isVok = c => !!c && VOK.includes(c);
const isLetter = c => !!c && /[a-zäöüß]/i.test(c);
const isUpper = c => c !== c.toLowerCase() && c === c.toUpperCase();

/* Normalisieren: Leerzeichen, ß → ss, typografische Zeichen */
function norm(s){
  return String(s||"").normalize("NFC").replace(/ß/g,"ss").replace(/ẞ/g,"SS").replace(/[‘’`´]/g,"'").replace(/\s+/g," ").trim();
}
const stripPunct = t => t.replace(/^[«»"„“”'(\[]+|[«»"„“”'.,;:!?)\]]+$/g,"");

/* Stellen im Zielwort, an denen eine Regel greift */
function stellen(w, imSatz){
  let ng = false;
  if(w[0]==="^"){ ng = true; w = w.slice(1); }
  const L = w.toLowerCase(), o = [];
  o.push({c: ng ? "NG" : "GK", s:0, e:1});
  if(imSatz && (L==="das" || L==="dass")){ o.push({c:"DS", s:0, e:L.length}); return o; }
  let m;
  const re1 = /([bdfglmnprst])\1+/g;
  while((m = re1.exec(L))) o.push({c:"DK", s:m.index, e:m.index+m[0].length});
  const re2 = /ck|tz/g;
  while((m = re2.exec(L))) o.push({c:"CK", s:m.index, e:m.index+2});
  const re3 = /ie/g;
  while((m = re3.exec(L))) o.push({c:"IE", s:m.index, e:m.index+2});
  for(let i=1;i<L.length;i++){ if(L[i]==="h" && isVok(L[i-1])) o.push({c:"DH", s:i-1, e:i+1}); }
  const re4 = /aa|ee|oo/g;
  while((m = re4.exec(L))) o.push({c:"DH", s:m.index, e:m.index+2});
  for(let i=1;i<L.length;i++){
    const c = L[i], p = L[i-1], n = L[i+1];
    if(!"dbg".includes(c) || p===c || n===c) continue;
    if(c==="g" && p==="n") continue;
    if(n===undefined || (!isVok(n) && n!=="r" && n!=="h" && n!=="j")) o.push({c:"AV", s:i, e:i+1});
  }
  const re5 = /äu|ä/g;
  while((m = re5.exec(L))) o.push({c:"AE", s:m.index, e:m.index+m[0].length});
  const re6 = /v/g;
  while((m = re6.exec(L))) o.push({c:"V", s:m.index, e:m.index+1});
  return o;
}

/* Zeichen-Ausrichtung (Levenshtein mit Rückverfolgung) */
function ausrichten(t, a){
  const n = t.length, m = a.length, D = [];
  for(let i=0;i<=n;i++){ D.push(new Array(m+1).fill(0)); D[i][0] = i; }
  for(let j=0;j<=m;j++) D[0][j] = j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    const sub = D[i-1][j-1] + (t[i-1]===a[j-1] ? 0 : 1);
    D[i][j] = Math.min(sub, D[i-1][j]+1, D[i][j-1]+1);
  }
  const map = new Array(n).fill(null), mapIdx = new Array(n).fill(-1), ins = [];
  for(let i=0;i<=n;i++) ins.push([]);
  let i=n, j=m;
  while(i>0 || j>0){
    if(i>0 && j>0 && D[i][j] === D[i-1][j-1] + (t[i-1]===a[j-1]?0:1)){ map[i-1]=a[j-1]; mapIdx[i-1]=j-1; i--; j--; }
    else if(i>0 && D[i][j] === D[i-1][j]+1){ i--; }
    else { ins[i].unshift(j-1); j--; }
  }
  return {map, mapIdx, ins, dist:D[n][m]};
}

/* Ein Wort prüfen.  ziel: Zielwort (evtl. mit ^), antwort: Eingabe.
   Rückgabe: ok, stellen (mit Fehlerkennzeichen), zusatz (Fehler ausserhalb der Regelstellen),
   markT (Zielwort-Indizes zum Hervorheben), markA (falsche Zeichen in der Eingabe), luecken (fehlende Zeichen) */
function pruefeWort(ziel, antwort, imSatz){
  const zielRein = ziel.replace(/^\^/,"");
  const a = norm(antwort);
  const res = {ok: a === zielRein, stellen: stellen(ziel, imSatz).map(s=>({...s, f:false})), zusatz:[], markT:new Set(), markA:new Set(), luecken:[] };
  if(res.ok) return res;
  if(!a){ res.fehlt = true; res.zusatz.push({c:"SO"}); for(let k=0;k<zielRein.length;k++) res.markT.add(k); return res; }
  const t = zielRein.toLowerCase(), al = a.toLowerCase();
  const A = ausrichten(t, al);
  const covered = new Set();          // Zielpositionen, die durch eine Regelstelle erklärt sind
  const coveredIns = new Set();       // Einfügepositionen (Index in ins), die erklärt sind
  // Regelstellen prüfen
  for(const st of res.stellen){
    if(st.c==="GK" || st.c==="NG") continue;
    let seg = "";
    for(let k=st.s;k<st.e;k++){ if(k>st.s) seg += A.ins[k].map(j=>al[j]).join(""); seg += A.map[k]||""; }
    if(seg !== t.slice(st.s, st.e)){
      st.f = true;
      for(let k=st.s;k<st.e;k++){ covered.add(k); res.markT.add(k); }
      for(let k=st.s;k<=st.e;k++) coveredIns.add(k);
    }
  }
  // Gross/klein: erster Buchstabe und Buchstaben im Wort
  const gk = res.stellen.find(s=>s.c==="GK"||s.c==="NG");
  const a0 = a[0], t0 = zielRein[0];
  let gkFehler = false;
  if(isLetter(a0) && isLetter(t0) && isUpper(a0) !== isUpper(t0)) gkFehler = true;
  for(let k=1;k<zielRein.length;k++){
    const j = A.mapIdx[k];
    if(j>=0 && al[j]===t[k] && isLetter(a[j]) && isUpper(a[j]) !== isUpper(zielRein[k])){ gkFehler = true; res.markA.add(j); res.markT.add(k); }
  }
  if(gkFehler){ gk.f = true; res.markT.add(0); if(isLetter(a0)) res.markA.add(0); }
  // übrige Abweichungen einordnen
  const zusatz = c => res.zusatz.push({c});
  for(let k=0;k<t.length;k++){
    // Einfügungen vor Position k
    if(A.ins[k].length && !coveredIns.has(k)){
      const x = A.ins[k].map(j=>al[j]).join(""), prev = k>0 ? (A.map[k-1]||t[k-1]) : "", next = t[k];
      A.ins[k].forEach(j=>res.markA.add(j));
      if(k>0) res.markT.add(k-1);
      zusatz(einordnenEinfuegung(x, prev, next));
    }
    if(covered.has(k)) continue;
    const got = A.map[k];
    if(got === null){ res.markT.add(k); res.luecken.push(k); zusatz(einordnenFehlend(t, k)); }
    else if(got !== t[k]){ res.markT.add(k); res.markA.add(A.mapIdx[k]); zusatz(einordnenTausch(t, k, got)); }
  }
  if(A.ins[t.length].length && !coveredIns.has(t.length)){
    const x = A.ins[t.length].map(j=>al[j]).join("");
    A.ins[t.length].forEach(j=>res.markA.add(j));
    res.markT.add(t.length-1);
    zusatz(einordnenEinfuegung(x, A.map[t.length-1]||t[t.length-1], ""));
  }
  // gleiche Zusatzfehler in einem Wort nur einmal zählen
  const seen = new Set(); res.zusatz = res.zusatz.filter(z=>{ if(seen.has(z.c)) return false; seen.add(z.c); return true; });
  return res;
}
function einordnenEinfuegung(x, prev, next){
  const c = x[x.length-1], first = x[0];
  if(x==="c" && next==="k") return "CK";
  if(x==="t" && next==="z") return "CK";
  if(x.length===1 && /[bdfglmnprst]/.test(c) && (c===prev || c===next)) return "DK";
  if(x==="e" && prev==="i") return "IE";
  if(x==="h" && isVok(prev)) return "DH";
  if(x.length===1 && isVok(c) && "aeo".includes(c) && (c===prev || c===next)) return "DH";
  if(first==="h" && isVok(prev)) return "DH";
  return "SO";
}
function einordnenFehlend(t, k){
  const c = t[k];
  // ein Buchstabe eines Doppelmitlauts fehlt (sollte als Regelstelle erfasst sein, Sicherheitsnetz)
  if(/[bdfglmnprst]/.test(c) && (t[k-1]===c || t[k+1]===c)) return "DK";
  if(c==="h" && isVok(t[k-1])) return "DH";
  return "SO";
}
function einordnenTausch(t, k, got){
  const c = t[k];
  const paar = c+got;
  if(paar==="eä" || paar==="äe") return "AE";
  if(paar==="fv" || paar==="wv" || paar==="vf" || paar==="vw") return "V";
  if(["td","pb","kg","dt","bp","gk"].includes(paar) && (k===t.length-1 || !isVok(t[k+1]))) return "AV";
  if(c==="z" && got==="s") return "SO";
  return "SO";
}

/* Satz prüfen: Wörter einander zuordnen */
function satzTokens(s){ return norm(s).split(" ").map(stripPunct).filter(Boolean); }
function pruefeSatz(ziel, antwort){
  const T = satzTokens(ziel), A = satzTokens(antwort);
  const n = T.length, m = A.length;
  const cost = (x,y)=>{ const a=x.replace(/^\^/,"").toLowerCase(), b=y.toLowerCase(); if(a===b) return x.replace(/^\^/,"")===y?0:0.05;
    const d = ausrichten(a,b).dist / Math.max(a.length,b.length); return d > 0.5 ? 2.5 : d*1.7; };   // ganz andere Wörter nicht paaren
  const D = []; for(let i=0;i<=n;i++){ D.push(new Array(m+1).fill(0)); D[i][0]=i; } for(let j=0;j<=m;j++) D[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j] = Math.min(D[i-1][j-1]+cost(T[i-1],A[j-1]), D[i-1][j]+1, D[i][j-1]+1);
  const paare = []; let i=n, j=m;
  while(i>0 || j>0){
    if(i>0 && j>0 && Math.abs(D[i][j] - (D[i-1][j-1]+cost(T[i-1],A[j-1])))<1e-9){ paare.unshift({z:T[i-1], a:A[j-1]}); i--; j--; }
    else if(i>0 && Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){ paare.unshift({z:T[i-1], a:""}); i--; }
    else { paare.unshift({z:null, a:A[j-1]}); j--; }
  }
  // Wort richtig geschrieben, aber an einer anderen Stelle im Satz: zählt als richtig geschrieben
  for(const p of paare){
    if(p.z===null || p.a) continue;
    const k = paare.findIndex(q => q.z===null && q.a === p.z.replace(/^\^/,""));
    if(k >= 0){ p.a = paare[k].a; paare.splice(k,1); }
  }
  let idx = 0;
  return paare.map(p => { if(p.z===null) return {z:null, a:p.a, ok:false, extra:true};
    const r = {z:p.z, a:p.a, idx, erstes: idx===0, ...pruefeWort(p.z, p.a, true)}; idx++; return r; });
}

/* Wortmodus: Begleiter vor einem Nomen erlauben («der Hund») */
function wortEingabe(ziel, eingabe){
  let a = norm(eingabe).replace(/[.!?,;:]+$/,"");
  if(isUpper(ziel[0])){ const m = a.match(/^(der|die|das|ein|eine|einen)\s+(\S+)$/i); if(m) a = m[2]; }
  return a;
}

/* Zählen pro Bereich: Chancen und Fehler */
function zaehle(res, acc){
  for(const s of res.stellen){ const x = acc[s.c] || (acc[s.c]={n:0,f:0}); x.n++; if(s.f) x.f++; }
  for(const z of res.zusatz){ if(z.c==="SO") continue; const x = acc[z.c] || (acc[z.c]={n:0,f:0}); x.n++; x.f++; }
  const so = acc.SO || (acc.SO={n:0,f:0}); so.n++; if(res.zusatz.some(z=>z.c==="SO")) so.f++;
  return acc;
}
function fehlerBereiche(res){
  const f = res.stellen.filter(s=>s.f).map(s=>s.c).concat(res.zusatz.map(z=>z.c));
  return [...new Set(f)];
}

const TA = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';

/* ===== Daten aufbereiten ===== */
const WORTE = [], SAETZE = [];
(function(){
  const gesehen = new Set();
  for(const s of [1,2,3,4,5]){
    WORT_DATEN[s].split("\n").forEach(z=>{ const [w,x] = z.split("|"); if(!w || gesehen.has(w)) return; gesehen.add(w); WORTE.push({id:"w"+s+":"+w, w:w.trim(), x:(x||"").trim(), s}); });
    SATZ_DATEN[s].split("\n").forEach((t,i)=>{ if(t.trim()) SAETZE.push({id:"s"+s+":"+i, t:t.trim(), s}); });
  }
})();
const WORT = Object.fromEntries(WORTE.map(w=>[w.w, w]));
const SB_W = new Set(), SB_S = new Set();
for(const f of Object.values(SB_FORMEN)){ for(const s in f.woerter) f.woerter[s].split(" ").forEach(w=>SB_W.add(w)); f.saetze.forEach(([s,t])=>SB_S.add(t)); }
const POOL_W = {}, POOL_S = {};
for(const s of [1,2,3,4,5]){ POOL_W[s] = WORTE.filter(w=>w.s===s && !SB_W.has(w.w)); POOL_S[s] = SAETZE.filter(x=>x.s===s && !SB_S.has(x.t)); }

/* ===== Sprachausgabe ===== */
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let VOICE = null;
function waehleStimme(){
  if(!TTS) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v=>/^de[-_]CH/i.test(v.lang)) || vs.find(v=>/^de[-_]DE/i.test(v.lang) && v.localService) || vs.find(v=>/^de/i.test(v.lang)) || null;
}
if(TTS){ waehleStimme(); speechSynthesis.onvoiceschanged = waehleStimme; }
/* Nur für die Sprachausgabe: Schweizer «ss» nach langem Vokal/Doppellaut als «ß» vorlesen lassen */
function fuerStimme(t){
  return String(t).replace(/\^/g,"")
    .replace(/(ei|ai|au|äu|eu|ie)ss/gi, "$1ß")
    .replace(/\b(gro|Gro|stra|Stra|fu|Fu|sü|Sü|spa|Spa|gru|Gru)ss/g, "$1ß");
}
function sag(text, tempo){
  if(!TTS) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(fuerStimme(text));
    u.lang = VOICE ? VOICE.lang : "de-DE"; if(VOICE) u.voice = VOICE;
    u.rate = tempo || 0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
const sprechText = t => t.replace(/\^/g,"");

/* ===== Aufnahmen (natürliche Stimme, vorab aufgenommen) – Rückfall auf die Gerätestimme ===== */
const AUDIO_DIR = "audio/rs/";
const AUDIO_DA = new Set((typeof AUDIO_LISTE === "string" ? AUDIO_LISTE : "").split(" ").filter(Boolean));
const audioKey = t => String(t).replace(/\^/g,"").replace(/\s+/g," ").trim().toLowerCase();
const fnv = s => { let h=0x811c9dc5; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); };
const audioPfad = t => { const h = fnv(audioKey(t)); return AUDIO_DA.has(h) ? AUDIO_DIR + h + ".mp3" : null; };
const HOEREN = TTS || AUDIO_DA.size > 0;
const PLAYER = new Audio(); PLAYER.preload = "auto";
let spielId = 0;
function stille(){ spielId++; try{ PLAYER.pause(); }catch(e){} if(TTS) try{ speechSynthesis.cancel(); }catch(e){} }
/* texte: Liste von Stücken, die nacheinander gespielt werden (z. B. Wort, Satz, Wort) */
function spiele(texte, langsam){
  const pfade = texte.map(audioPfad);
  const ersatz = () => sag(texte.map(sprechText).join(" … "), langsam ? 0.6 : 0.85);
  stille();
  if(!pfade.length || pfade.some(p=>!p)) return ersatz();
  const id = spielId, rate = langsam ? 0.75 : 1;
  let i = 0;
  const weiter = () => {
    if(id !== spielId || i >= pfade.length) return;
    PLAYER.src = pfade[i++];
    PLAYER.defaultPlaybackRate = rate; PLAYER.playbackRate = rate;
    PLAYER.preservesPitch = true; PLAYER.webkitPreservesPitch = true;
    const p = PLAYER.play(); if(p && p.catch) p.catch(()=>{ if(id===spielId){ spielId++; ersatz(); } });
  };
  PLAYER.onended = () => { if(id === spielId && i < pfade.length) setTimeout(weiter, 450); };
  PLAYER.onerror = () => { if(id === spielId){ spielId++; ersatz(); } };
  weiter();
}
function vorladen(texte){ texte.forEach(t=>{ const p = audioPfad(t); if(p) try{ fetch(p).catch(()=>{}); }catch(e){} }); }

/* ===== Fortschritt (auf diesem Gerät) ===== */
const GERAET = (()=>{ let g = store.get("rs.geraet"); if(!g){ g = uid(); store.set("rs.geraet", g); } return g; })();
let gz = (store.get("rs.gz")||"").replace(/\D/g,"");
let P = null;
const pkey = () => "rs.p."+gz;
function neuerStand(){ return {v:1, stufe:0, etappe:0, total:0, versuche:0, seit:0, sb:[], gesehen:{}, kiste:{}, stat:{}, worte:0}; }
function ladeP(){ try{ P = JSON.parse(store.get(pkey())||"null"); }catch(e){ P = null; } if(!P || P.v!==1) P = neuerStand(); }
function speichereP(){ if(gz) store.set(pkey(), JSON.stringify(P)); }
const kisteN = () => Object.keys(P.kiste).length;

/* ===== Übungsrunde ===== */
let S = null;
const skey = () => "rs.s."+gz;
function speichereS(){ if(S && gz) store.set(skey(), JSON.stringify(S)); }
function ladeS(){ try{ return JSON.parse(store.get(skey())||"null"); }catch(e){ return null; } }
function loescheS(){ store.del(skey()); }

function nimm(pool, n){
  const g = P.gesehen;
  return shuffle(pool.slice()).sort((a,b)=>(g[a.id]||0)-(g[b.id]||0)).slice(0,n);
}
function kisteItems(n, ausser){
  return Object.entries(P.kiste).filter(([k,v])=>!ausser || v.t < ausser).sort((a,b)=>a[1].t-b[1].t).slice(0,n)
    .map(([k,v])=>({typ:"W", w:v.w, x:v.x, s:v.s, q:"K", ims:!!v.ims, pos:v.pos}));
}
function starteEtappe(){
  const st = P.stufe || 1;
  const neu = nimm(POOL_W[st], NEUE_WOERTER).map(w=>({typ:"W", w:w.w, x:w.x, s:w.s, q:"E", id:w.id}));
  const ki = kisteItems(KISTE_PRO_ETAPPE, Date.now()-60000);
  const sa = nimm(POOL_S[st], SAETZE_PRO_ETAPPE).map(x=>({typ:"S", w:x.t, s:x.s, q:"E", id:x.id}));
  const nr = P.etappe + 1;
  S = {art:"etappe", sid:uid(), thema: st===5 && nr>ETAPPEN_PRO_STUFE ? `Stufe 5 · Meisterrunde ${nr-ETAPPEN_PRO_STUFE}` : `Stufe ${st} · Etappe ${nr}`,
       items: shuffle(neu.concat(ki)).concat(sa), i:0, log:[], pending:[], z:0, start:Date.now()};
  speichereS(); zeigeAufgabe(true);
}
function starteKiste(){
  const items = kisteItems(12);
  if(!items.length) return;
  S = {art:"kiste", sid:uid(), thema:"Fehlerkiste", items: shuffle(items), i:0, log:[], pending:[], z:0, start:Date.now()};
  speichereS(); zeigeAufgabe(true);
}
function regelKandidaten(c){
  const max = Math.min(5, (P.stufe||1)+1);
  if(c==="NG") return SAETZE.filter(x=>x.s<=5 && x.t.includes("^"));
  if(c==="DS") return SAETZE.filter(x=>/\bdass\b|, das\b/.test(x.t));
  return WORTE.filter(w=>w.s<=max && !SB_W.has(w.w) && (c==="SO" ? rein(w.w).length>=9 : stellen(w.w,false).some(o=>o.c===c)));
}
function starteRegel(c){
  const kand = regelKandidaten(c);
  let items;
  if(c==="NG" || c==="DS") items = nimm(kand, 5).map(x=>({typ:"S", w:x.t, s:x.s, q:"R", id:x.id}));
  else if(c==="GK"){
    const gross = kand.filter(w=>/^[A-ZÄÖÜ]/.test(w.w)), klein = kand.filter(w=>!/^[A-ZÄÖÜ]/.test(w.w));
    items = shuffle(nimm(gross,6).concat(nimm(klein,6))).map(w=>({typ:"W", w:w.w, x:w.x, s:w.s, q:"R", id:w.id}));
  } else items = nimm(kand, 12).map(w=>({typ:"W", w:w.w, x:w.x, s:w.s, q:"R", id:w.id}));
  S = {art:"regel", sid:uid(), cat:c, thema:"Regeltraining: "+CATS[c].kurz, items, i:0, log:[], pending:[], z:0, start:Date.now()};
  speichereS(); zeigeAufgabe(true);
}
function starteSB(){
  const form = P.sb.length % 2 === 0 ? "A" : "B", F = SB_FORMEN[form];
  const items = [];
  for(const s of [1,2,3,4,5]){
    F.woerter[s].split(" ").forEach(w=>{ const d = WORT[w]; items.push({typ:"W", w, x:d?d.x:"", s, q:"B"}); });
    F.saetze.filter(([st])=>st===s).forEach(([st,t])=>items.push({typ:"S", w:t, s:st, q:"B"}));
  }
  S = {art:"sb", sid:uid(), form, thema:"Standortbestimmung "+form, items, i:0, log:[], pending:[], z:0, start:Date.now()};
  speichereS(); zeigeAufgabe(true);
}

/* ===== Ansicht: Start ===== */

        <p class="sub" style="margin:6px 0 0">Stufe ${st}: ${esc(STUFEN[st])}</p></div>
        <button class="btn big-btn" id="etappe">▶ ${meister?"Meisterrunde":"Etappe "+(nr+1)} starten<small>${NEUE_WOERTER} Wörter${kn?` + bis ${KISTE_PRO_ETAPPE} aus der Fehlerkiste`:""} · ${SAETZE_PRO_ETAPPE} Sätze</small></button>
      </div>
      <div class="tiles">
        <button class="tile" id="kiste" ${kn?"":"disabled"}><span class="ic">📦</span><b>Fehlerkiste <em class="badge">${kn}</em></b><span>${kn?"Wörter, die noch nicht sicher sitzen. Zweimal richtig – dann sind sie draussen.":"Leer – super!"}</span></button>
        <button class="tile" id="regel"><span class="ic">🎯</span><b>Regeltraining</b><span>Übe gezielt eine Rechtschreibregel.</span></button>
        <button class="tile ${sbFrei?"hot":""}" id="sb" ${sbFrei?"":"disabled"}><span class="ic">📝</span><b>Standortbestimmung</b><span>${sbFrei?"Wieder freigeschaltet – zeig, was du gelernt hast!":`Wieder möglich nach ${SB_NACH_ETAPPEN-P.seit} weiteren Etappen.`}</span></button>
      </div>
      ${meinStand()}`;
  }
  app.innerHTML = `<div class="card">
    <div class="who">

    </div>

  const on = (id,f) => { const b=$(id); if(b) b.onclick=f; };

  on("gzneu", ()=>{ if(confirm("Möchtest du wirklich eine andere Glückszahl eingeben?")) zahlenfeld(); });

/* ===== Aufträge der Lehrperson (z. B. Standortbestimmung zurücksetzen) ===== */
let befehlGeprueft = 0, befehlHinweis = "";
function befehlErledigt(nr, id){
  fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({typ:"befehl-erledigt", glueckszahl:nr, id})}).catch(()=>{});
}
function pruefeBefehle(){
  if(!ENDPOINT || !gz || Date.now() - befehlGeprueft < 60000) return;
  befehlGeprueft = Date.now();
  const nr = gz;
  fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({typ:"befehl-abfragen", glueckszahl:nr})})
    .then(r=>r.json()).then(d=>{
      if(!d || !d.ok || !d.befehl || nr !== gz) return;
      if(S || !$("gzneu")){ befehlGeprueft = 0; return; }        // nur auf der Startseite ausführen, nie mitten in einer Übung
      ladeP();
      if(P.befehl === d.befehl.id) return befehlErledigt(nr, d.befehl.id);
      if(d.befehl.befehl === "sb-reset"){
        P.sb = []; P.stufe = 0; P.etappe = 0; P.seit = 0; P.befehl = d.befehl.id;
        speichereP(); loescheS();
        befehlHinweis = "Deine Lehrperson hat die Standortbestimmung zurückgesetzt. Mach sie bitte nochmals – so gut du kannst.";
        befehlErledigt(nr, d.befehl.id);
        home();
      }
    }).catch(()=>{ befehlGeprueft = 0; });
}

/* ===== Glückszahl nur mit Zahlenknöpfen (keine Tastatur, keine Buchstaben) ===== */
let padTasten = null;
function zahlenfeld(){
  pill.hidden = true;
  let z = "";
  const zeichne = () => {
    $("gzanz").innerHTML = (z ? [...z].map(d=>`<span>${d}</span>`).join("") : `<span class="leer">?</span>`);
    $("gzok").disabled = !z;
  };
  app.innerHTML = `<div class="card pad-card">
    <h2>Tippe deine Glückszahl</h2>
    <p class="sub">Drücke auf die Zahlen. Nimm immer dieselbe Glückszahl – dann machst du dort weiter, wo du aufgehört hast.</p>
    <div class="gzanz" id="gzanz" aria-live="polite"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      <button class="del" id="gzdel" aria-label="Löschen">⌫</button><button data-n="0">0</button><button class="ok" id="gzok">OK</button></div>
  </div>`;
  const tipp = n => { if(z.length < 4){ z += n; zeichne(); } };
  const weg = () => { z = z.slice(0,-1); zeichne(); };
  const fertig = () => { if(!z) return; bestaetigen(z); };
  app.querySelectorAll(".pad [data-n]").forEach(b=>b.onclick=()=>tipp(b.dataset.n));
  $("gzdel").onclick = weg; $("gzok").onclick = fertig;
  if(padTasten) document.removeEventListener("keydown", padTasten);
  padTasten = e => { if(!$("gzanz")) { document.removeEventListener("keydown", padTasten); padTasten = null; return; }
    if(/^[0-9]$/.test(e.key)) tipp(e.key); else if(e.key==="Backspace") weg(); else if(e.key==="Enter") fertig(); };
  document.addEventListener("keydown", padTasten);
  zeichne();
}
/* Glückszahl gewechselt (z. B. vertippt): Fortschritt dieses Tablets auf die neue Zahl übertragen */
function fortschrittMitnehmen(alt, neu){
  const lies = k => { try{ return JSON.parse(store.get(k)||"null"); }catch(e){ return null; } };
  const pAlt = lies("rs.p."+alt), pNeu = lies("rs.p."+neu);
  const hat = p => p && ((p.sb && p.sb.length) || p.worte > 0);
  if(!hat(pAlt) || hat(pNeu)) return;
  if(!confirm(`Möchtest du deinen bisherigen Fortschritt (Stufe ${pAlt.stufe||1}, ${pAlt.worte} Wörter) zur Glückszahl ${neu} mitnehmen?`)) return;
  store.set("rs.p."+neu, store.get("rs.p."+alt)); store.del("rs.p."+alt);
  const s = store.get("rs.s."+alt); if(s){ store.set("rs.s."+neu, s); store.del("rs.s."+alt); }
  const q = queue(); let geaendert = false;
  q.forEach(r => { if(String(r.glueckszahl) === String(alt)){ r.glueckszahl = neu; geaendert = true; } });
  if(geaendert) store.set(QKEY, JSON.stringify(q));
}
function bestaetigen(z){
  app.innerHTML = `<div class="card pad-card">
    <h2>Ist das deine Glückszahl?</h2>
    <div class="gzanz gross">${[...z].map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="actions" style="justify-content:center"><button class="btn" id="gzja">✓ Ja, das stimmt</button><button class="btn ghost" id="gznein">Nein, nochmals</button></div>
  </div>`;
  $("gzja").onclick = () => { const neu = String(+z); if(gz && gz !== neu) fortschrittMitnehmen(gz, neu); gz = neu; store.set("rs.gz", gz); home(); };
  $("gznein").onclick = zahlenfeld;
}

function meinStand(){
  const st = P.stat, liste = CAT_ORDER.filter(c=>st[c] && st[c].n>=5);
  if(P.worte < 30 || !liste.length) return "";
  const rows = liste.map(c=>{ const p = Math.round((1-st[c].f/st[c].n)*100);
    return `<div class="mrow"><span>${esc(CATS[c].kurz)}</span><div class="bar"><i style="width:${p}%;background:${p>=90?"#3fbf6f":p>=75?"#f5c04a":"#ef7b6f"}"></i></div><b>${p}%</b></div>`; }).join("");
  const schwach = liste.slice().sort((a,b)=>st[b].f/st[b].n - st[a].f/st[a].n).filter(c=>st[c].f/st[c].n>0.15).slice(0,2);
  return `<details class="mine"><summary>📊 Meine Rechtschreibung · ${P.worte} Wörter geschrieben</summary>
    <div class="mlist">${rows}</div>
    ${schwach.length?`<p class="sub" style="margin-top:12px">Darauf solltest du besonders achten: <b>${schwach.map(c=>esc(CATS[c].kurz)).join("</b> und <b>")}</b>. Im Regeltraining kannst du das gezielt üben.</p>`:""}
  </details>`;
}

    <div class="topics">${CAT_ORDER.map(c=>{ const x=st[c], p = x&&x.n>=5 ? Math.round((1-x.f/x.n)*100) : null;

function regelIntro(c){

/* Wörter aus Sätzen (Fehlerkiste) werden im Satz mit einer Lücke geübt – so sieht man, ob gross oder klein */
function lueckenPos(it){
  const toks = sprechText(it.x).split(" ");
  if(Number.isInteger(it.pos) && it.pos < toks.length && stripPunct(toks[it.pos]) === rein(it.w)) return it.pos;
  let k = toks.findIndex(t => stripPunct(t) === rein(it.w));
  if(k < 0) k = toks.findIndex(t => stripPunct(t).toLowerCase() === rein(it.w).toLowerCase());
  return k;
}
function lueckenSatz(it){
  const toks = sprechText(it.x).split(" "), k = lueckenPos(it);
  if(k < 0) return null;
  return toks.map((t,i) => { if(i !== k) return esc(t); const w = stripPunct(t), j = t.indexOf(w);
    return esc(t.slice(0,j)) + `<span class="gap">${"&nbsp;".repeat(Math.max(6, Math.round(w.length*1.6)))}</span>` + esc(t.slice(j+w.length)); }).join(" ");
}
const istLuecke = it => it.typ==="W" && it.ims && it.x && lueckenPos(it) >= 0;

/* ===== Ansicht: Aufgabe ===== */
let teilIdx = 0;
function teile(text){
  const toks = sprechText(text).split(" "), out = []; let cur = [];
  toks.forEach(t=>{ cur.push(t); if(/[,;:]$/.test(t) || cur.length>=4){ out.push(cur.join(" ")); cur=[]; } });
  if(cur.length) out.push(cur.join(" "));
  return out;
}
function vorlesen(it, langsam){
  if(it.typ==="W"){ const w = rein(it.w); spiele(it.x ? [w, it.x, w] : [w], langsam); }
  else spiele([it.w], langsam);
}
function zeigeAufgabe(vorlesenJetzt){
  if(!S) return home();
  if(S.i >= S.items.length) return abschluss();
  const it = S.items[S.i], n = S.items.length;
  const istSatz = it.typ==="S";
  teilIdx = 0;
  const prog = S.items.map((x,k)=>{ const l = S.log[k]; return `<i class="${k===S.i?"now":l?(l.ok?"ok":l.teil?"half":"no"):""}"></i>`; }).join("");
  const sb = S.art==="sb";
  app.innerHTML = `<div class="card task">
    <div class="sesshead"><span class="qtype">${istSatz?"💬 Satz":"✏️ Wort"} ${S.i+1} von ${n}</span><span class="grow sub" style="margin:0">${esc(S.thema)}</span><button class="btn ghost small" id="pause">Pause</button></div>
    <div class="progress">${prog}</div>
    ${HOEREN ? `<div class="hear">
      <button class="btn hearbtn" id="h1">🔊 ${istSatz?"Satz anhören":"Anhören"}</button>
      <button class="btn ghost" id="h2">🐢 Langsam</button>
      ${istSatz?`<button class="btn ghost" id="h3">Stück für Stück <small id="teilnr"></small></button>`:""}
    </div>` : `<div class="flash" id="flash">${esc(sprechText(it.w))}</div>`}
    ${istLuecke(it) ? `<p class="luecke">${lueckenSatz(it)}</p><p class="hint">Schreib das Wort, das in die Lücke gehört. Achte darauf, wo es im Satz steht.</p>`
      : `<p class="hint">${istSatz?"Schreib den ganzen Satz auf. Achte auf Gross- und Kleinschreibung.":"Schreib das Wort auf. Nomen schreibst du gross."}</p>`}
    ${istSatz ? `<textarea class="ans wide" id="inp" rows="2" ${TA} placeholder="Satz hier schreiben …"></textarea>`
              : `<input class="ans wide" id="inp" ${TA} placeholder="Wort hier schreiben …">`}
    <div class="actions"><button class="btn" id="chk">Prüfen</button>${sb?`<span class="sub" style="margin:0">Standortbestimmung: Es gibt keine Hilfe – du siehst dein Resultat am Schluss.</span>`:""}</div>
    <div id="fb"></div>
  </div>`;
  const inp = $("inp");
  if(HOEREN){
    $("h1").onclick = ()=>{ vorlesen(it,false); inp.focus({preventScroll:true}); };
    $("h2").onclick = ()=>{ vorlesen(it,true); inp.focus({preventScroll:true}); };
    if(istSatz){ const T = teile(it.w); const lab = $("teilnr"); lab.textContent = `1/${T.length}`;
      $("h3").onclick = ()=>{ spiele([T[teilIdx]], true); teilIdx = (teilIdx+1) % T.length; lab.textContent = `${teilIdx+1}/${T.length}`; inp.focus({preventScroll:true}); }; }
    if(vorlesenJetzt) vorlesen(it,false);
    const nx = S.items[S.i+1]; if(nx) vorladen(nx.typ==="W" ? [rein(nx.w), nx.x||""] : [nx.w]);
  } else {
    setTimeout(()=>{ const f=$("flash"); if(f) f.classList.add("hidden"); }, istSatz ? 6000 : 2500);
  }
  $("pause").onclick = ()=>{ sendePending(); S = null; home(); };
  $("chk").onclick = pruefen;
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); pruefen(); } });
  inp.focus({preventScroll:true});
}

function protokolliere(it, eintraege){
  // eintraege: [{w, a, ok, ims}] – je Wort (bei Sätzen jedes Wort einzeln)
  const z = it.typ==="S" ? ++S.z : 0;
  for(const e of eintraege){
    const rec = {w:e.w, a:e.a, ok:e.ok?1:0, s:it.s, k:it.typ, q:it.q, t:Date.now()};
    if(z) rec.z = z;
    if(e.ims && it.typ==="W") rec.ims = 1;
    S.pending.push(rec);
    // Statistik und Fehlerkiste
    if(e.w){
      const r = e.res; zaehle(r, P.stat); P.worte++;
      const key = e.w;
      const nurSatzanfang = e.erstes && fehlerBereiche(r).every(c=>c==="GK");
      if(!e.ok && !nurSatzanfang){ P.kiste[key] = {w:e.w, x: it.typ==="S" ? it.w : it.x, s:it.s, ims: it.typ==="S" || !!it.ims, pos: Number.isInteger(e.idx) ? e.idx : undefined, n:0, t:Date.now()}; }
      else if(P.kiste[key] && (it.q==="K" || P.kiste[key].t < S.start)){ P.kiste[key].n++; P.kiste[key].t = Date.now(); if(P.kiste[key].n >= KISTE_RAUS) delete P.kiste[key]; }
    }
  }
  if(z) (S.saetze || (S.saetze = [])).push({z, t:it.w, a:eintraege.antwort||""});
  if(it.id) P.gesehen[it.id] = (P.gesehen[it.id]||0)+1;
}

function pruefen(){
  const it = S.items[S.i], inp = $("inp");
  const roh = inp.value;
  if(!norm(roh)){ inp.focus(); inp.classList.add("shake"); setTimeout(()=>inp.classList.remove("shake"),400); return; }
  stille();
  inp.readOnly = true; $("chk").hidden = true;
  let ok, falsche = [], logEintrag;
  if(it.typ==="W"){
    const luecke = istLuecke(it), lpos = luecke ? lueckenPos(it) : -1;
    const a = luecke ? norm(roh).replace(/[.!?,;:]+$/,"") : wortEingabe(rein(it.w), roh);
    const res = pruefeWort(it.w, a, !!it.ims);
    ok = res.ok;
    const e = [{w:it.w, a, ok, res, ims:!!it.ims, idx: luecke ? lpos : it.pos, erstes: lpos===0}];
    protokolliere(it, e);
    logEintrag = {ok, teil:false};
    if(!ok) falsche = [{z:it.w, a, res, erstes: lpos===0, luecke}];
  } else {
    const paare = pruefeSatz(it.w, roh);
    const e = paare.filter(p=>!p.extra).map(p=>({w:p.z, a:p.a, ok:p.ok, res:p, erstes:p.erstes, idx:p.idx}));
    paare.filter(p=>p.extra).forEach(p=>e.push({w:"", a:p.a, ok:false, res:null}));
    e.antwort = norm(roh);
    protokolliere(it, e);
    const richtig = paare.filter(p=>!p.extra && p.ok).length, total = paare.filter(p=>!p.extra).length, extra = paare.filter(p=>p.extra).length;
    ok = richtig===total && !extra;
    logEintrag = {ok, teil: !ok && richtig/Math.max(total,1) >= 0.5, anteil: Math.max(0, richtig - extra)/total};
    falsche = paare.filter(p=>!p.extra && !p.ok).map(p=>({z:p.z, a:p.a, res:p, erstes:p.erstes}));
    it._paare = paare;
  }
  S.log[S.i] = logEintrag;
  S.i++;
  speichereP(); speichereS();
  if(S.pending.length >= 12) sendePending();
  inp.classList.add(ok?"ok":"no");
  if(S.art==="sb"){ return zeigeAufgabe(true); }
  if(ok){
    $("fb").innerHTML = `<div class="explain ok"><h3>✅ Richtig!</h3>${lob()}</div><div class="actions"><button class="btn" id="next">Weiter →</button></div>`;
    $("next").onclick = ()=>zeigeAufgabe(true); $("next").focus({preventScroll:true});
    return;
  }
  korrektur(it, falsche);
}
function lob(){ const L = ["Genau so!","Super geschrieben.","Stimmt alles.","Perfekt.","Sehr gut!"]; return `<p style="margin:0">${L[Math.floor(Math.random()*L.length)]}</p>`; }

/* Markierte Darstellung */
function zeigeMarkiert(text, set, cls){
  return [...text].map((ch,k)=> set && set.has(k) ? `<mark class="${cls}">${esc(ch)}</mark>` : esc(ch)).join("");
}
/* Gross/klein: Erklärung passend zum Fall (Satzanfang, Nomen, kein Nomen) */
function gkTipp(ziel, antwort, satzanfang){
  const zielGross = /^[A-ZÄÖÜ]/.test(ziel), antwortGross = /^[A-ZÄÖÜ]/.test(antwort||"");
  if(zielGross && satzanfang) return ["Satzanfang", CATS.GK.satzanfang];
  if(zielGross && !antwortGross) return ["Nomen schreibt man gross", `«${ziel}» ist ein Nomen. Probe: Du kannst «der», «die», «das» oder «ein» davorsetzen. Nomen schreibt man immer gross.`];
  if(!zielGross && antwortGross) return ["Kein Nomen – darum klein", `«${ziel}» ist kein Nomen. Probe: «der», «die» oder «das» passt nicht davor. Gross schreibt man nur Nomen und das erste Wort im Satz.`];
  return ["Gross- und Kleinschreibung", "Schau jeden Buchstaben an: Nur der erste Buchstabe eines Nomens oder am Satzanfang ist gross, alle anderen sind klein."];
}
function regelBoxen(bereiche, ziel, antwort, satzanfang){
  return bereiche.map(c=>{
    const [titel, text] = c==="GK" ? gkTipp(ziel, antwort, satzanfang) : [CATS[c].name, CATS[c].tipp];
    return `<div class="rule" style="--c:${CATS[c].farbe}"><h3>${esc(titel)}</h3><p>${esc(text)}</p></div>`;
  }).join("");
}

/* Pflicht-Korrektur: jedes falsche Wort einprägen, abdecken, richtig schreiben */
function korrektur(it, falsche){
  const fb = $("fb");
  let kopf = "";
  if(it.typ==="S"){
    const paare = it._paare;
    const deins = paare.map(p=>{ if(p.extra) return `<span class="tok extra">${esc(p.a)}</span>`; if(!p.a) return `<span class="tok miss">___</span>`;
      return `<span class="tok ${p.ok?"good":"bad"}">${p.ok?esc(p.a):zeigeMarkiert(p.a, p.markA, "x")}</span>`; }).join(" ");
    const zeichen = /[.?!]$/.test(it.w) ? it.w.slice(-1) : "";
    const richtig = paare.filter(p=>!p.extra).map(p=>`<span class="tok ${p.ok?"":"fix"}">${p.ok?esc(rein(p.z)):zeigeMarkiert(rein(p.z), p.markT, "y")}</span>`).join(" ").replace(/<\/span>$/, esc(zeichen)+"</span>");
    const extra = paare.filter(p=>p.extra).length;
    kopf = `<div class="explain"><h3>Fast! Schau genau hin:</h3>
      <p class="lab">Du hast geschrieben:</p><p class="satz">${deins}</p>
      <p class="lab">So ist es richtig:</p><p class="satz">${richtig}</p>
      ${extra?`<p class="sub">Durchgestrichen: Dieses Wort gehört nicht in den Satz.</p>`:""}
      ${falsche.length?`<p style="margin:10px 0 0"><b>${falsche.length===1?"Dieses Wort":"Diese "+falsche.length+" Wörter"}</b> schreibst du jetzt richtig.</p>`:""}</div>`;
  }
  let k = 0;
  const schritt = () => {
    if(k >= falsche.length){
      fb.innerHTML = kopf + `<div class="explain ok"><h3>Gut korrigiert!</h3><p style="margin:0">${falsche.length>1?"Diese Wörter kommen":"Das Wort kommt"} in deine Fehlerkiste und taucht später nochmals auf.</p></div>
        <div class="actions"><button class="btn" id="next">Weiter →</button></div>`;
      $("next").onclick = ()=>zeigeAufgabe(true); $("next").focus({preventScroll:true});
      return;
    }
    const f = falsche[k], ziel = rein(f.z), res = f.res;
    const bereiche = f.a ? fehlerBereiche(res) : ["SO"];
    const nr = falsche.length>1 ? ` <span class="sub">(${k+1} von ${falsche.length})</span>` : "";
    const merken = (hinweis) => {
      fb.innerHTML = kopf + `<div class="fix-card">
        ${hinweis||""}
        ${f.a ? `<p class="lab">Du hast geschrieben:</p><p class="wort falsch">${zeigeMarkiert(f.a, res.markA, "x")}</p>` : `<p class="lab">Dieses Wort fehlt:</p>`}
        <p class="lab">Richtig ist:${nr}</p><p class="wort richtig">${zeigeMarkiert(ziel, res.markT, "y")}</p>
        ${regelBoxen(bereiche, ziel, f.a, !!f.erstes)}
        <p class="sub" style="margin:12px 0 8px">Präg dir das Wort gut ein. Dann deckst du es zu und schreibst es aus dem Kopf.</p>
        <div class="actions"><button class="btn" id="gemerkt">Ich habe es mir gemerkt</button>${HOEREN?`<button class="btn ghost" id="hoer">🔊</button>`:""}</div>
      </div>`;
      $("gemerkt").onclick = schreiben; $("gemerkt").focus({preventScroll:true});
      const h = $("hoer"); if(h) h.onclick = ()=>spiele([ziel], true);
      fb.scrollIntoView({behavior:"smooth", block:"start"});
    };
    const schreiben = () => {
      fb.innerHTML = kopf + `<div class="fix-card">
        <p class="lab">Jetzt aus dem Kopf: Schreib das Wort richtig.${nr}</p>
        <p class="wort zu">${"•".repeat(Math.min(ziel.length, 14))}</p>
        <input class="ans wide" id="nach" ${TA} placeholder="Wort richtig schreiben …">
        <div class="actions"><button class="btn" id="ok2">Prüfen</button></div>
      </div>`;
      const ni = $("nach"); ni.focus({preventScroll:true});
      const go = () => {
        const v = norm(ni.value).replace(/[.!?,;:]+$/,"");
        if(!v) return ni.focus();
        if(v === ziel){ k++; schritt(); }
        else merken(`<div class="again">Noch nicht ganz. Schau dir das Wort nochmals genau an.</div>`);
      };
      $("ok2").onclick = go;
      ni.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } });
    };
    merken("");
  };
  if(it.typ==="W"){
    kopf = `<div class="explain"><h3>Nicht ganz richtig</h3><p style="margin:0">Schau, was nicht stimmt – und lies die Regel dazu.</p></div>`;
  }
  schritt();
}

/* ===== Abschluss einer Runde ===== */
function abschluss(){
  sendePending(true);
  const L = S.log.filter(Boolean);
  const wert = L.reduce((a,l)=>a + (l.anteil!==undefined ? l.anteil : (l.ok?1:0)), 0), quote = L.length ? wert/L.length : 0;
  const prozent = Math.round(quote*100);
  let titel = "", text = "", extra = "";
  if(S.art==="etappe"){
    P.total++; P.seit++;
    if(quote >= BESTANDEN_AB){
      P.etappe++;
      titel = "Etappe geschafft!";
      if(P.stufe < 5 && P.etappe >= ETAPPEN_PRO_STUFE){ P.stufe++; P.etappe = 0; titel = `🎉 Stufe ${P.stufe-1} geschafft!`; text = `Ab jetzt übst du auf Stufe ${P.stufe}: ${STUFEN[P.stufe]}.`; }
      else text = P.stufe===5 && P.etappe>ETAPPEN_PRO_STUFE ? "Meisterrunde bestanden." : `Noch ${Math.max(0,ETAPPEN_PRO_STUFE-P.etappe)} Etappen bis zur nächsten Stufe.`;
    } else { P.versuche++; titel = "Noch nicht ganz"; text = `Für die Etappe brauchst du ${Math.round(BESTANDEN_AB*100)}% richtig. Versuch es nochmals – mit neuen Wörtern.`; }
  } else if(S.art==="sb"){
    const proStufe = {};
    S.log.forEach((l,k)=>{ const s = S.items[k].s, x = proStufe[s] || (proStufe[s]={w:0,n:0}); x.n++; x.w += l.anteil!==undefined ? l.anteil : (l.ok?1:0); });
    const q = {}; for(const s in proStufe) q[s] = Math.round(proStufe[s].w/proStufe[s].n*100);
    const erste = !P.sb.length;
    P.sb.push({form:S.form, datum:new Date().toISOString(), quote:prozent, stufen:q});
    P.seit = 0;
    if(erste){ let start = 5; for(const s of [1,2,3,4,5]){ if((q[s]||0) < 80){ start = s; break; } } P.stufe = start; P.etappe = 0; }
    titel = "Standortbestimmung fertig";
    text = erste ? `Du startest auf Stufe ${P.stufe}: ${STUFEN[P.stufe]}.` : `Du übst weiter auf Stufe ${P.stufe}.`;
    extra = `<div class="sbq">${[1,2,3,4,5].map(s=>`<div><span>Stufe ${s}</span><div class="bar"><i style="width:${q[s]||0}%;background:${(q[s]||0)>=80?"#3fbf6f":(q[s]||0)>=60?"#f5c04a":"#ef7b6f"}"></i></div><b>${q[s]||0}%</b></div>`).join("")}</div>`;
  } else if(S.art==="kiste"){ titel = "Fehlerkiste geübt"; text = kisteN() ? `In der Fehlerkiste sind noch ${kisteN()} Wörter.` : "Die Fehlerkiste ist leer!"; }
  else { titel = "Regeltraining fertig"; text = "Gut gemacht. Achte beim Schreiben weiter auf diese Regel."; }
  // falsche Wörter dieser Runde
  const falsch = [];
  S.items.forEach((it,k)=>{ const l = S.log[k]; if(!l || l.ok) return;
    if(it.typ==="W") falsch.push(rein(it.w)); else if(it._paare) it._paare.filter(p=>!p.extra && !p.ok).forEach(p=>falsch.push(rein(p.z))); });
  speichereP(); loescheS();
  const sterne = quote>=0.95?"⭐⭐⭐":quote>=0.85?"⭐⭐":quote>=0.7?"⭐":"🙂";
  const art = S.art;
  app.innerHTML = `<div class="card result">
    <p class="sub" style="margin:0">${esc(S.thema)}</p>
    <div class="score">${prozent}%</div>
    <div class="stars">${sterne}</div>
    <h2>${esc(titel)}</h2><p>${esc(text)}</p>
    ${extra}
    ${falsch.length?`<p class="sub" style="margin-top:16px">${art==="sb"?"Diese Wörter kommen in deine Fehlerkiste:":"Übe diese Wörter weiter:"}</p><p class="chips">${[...new Set(falsch)].map(w=>`<span>${esc(w)}</span>`).join("")}</p>`:""}
    <p class="sent" id="sent">${ENDPOINT?"Wird an die Lehrperson geschickt …":""}</p>
    <div class="actions" style="justify-content:center"><button class="btn" id="menu">Zur Übersicht</button></div>
  </div>`;
  S = null;
  $("menu").onclick = home; $("menu").focus({preventScroll:true});
}

/* ===== Senden an die Google-Tabelle ===== */
const QKEY = "rs.queue";
function queue(){ try{ return JSON.parse(store.get(QKEY)||"[]"); }catch(e){ return []; } }
function makeRec(items, fertig){
  const ok = items.filter(i=>i.ok).length;
  const zs = new Set(items.filter(i=>i.z).map(i=>i.z));
  return {typ:"uebung-runde", v:3, id:uid(), sid:S.sid, uebung:UEBUNG, glueckszahl:gz, geraet:GERAET, thema:S.thema, art:S.art, form:S.form||"", cat:S.cat||"",
    datum:new Date().toISOString(), start:S.start, punkte:ok, max:items.length, fertig:!!fertig,
    stand:{stufe:P.stufe, etappe:P.etappe, total:P.total, kiste:kisteN(), sb:P.sb.length},
    saetze:(S.saetze||[]).filter(x=>zs.has(x.z)), aufgaben:items};
}
function sendePending(fertig){
  if(!S || !gz) return;
  if(!S.pending.length && !fertig) return;
  const items = S.pending.splice(0);
  speichereS();
  if(!ENDPOINT) return;
  const q = queue(); q.push(makeRec(items, fertig)); store.set(QKEY, JSON.stringify(q.slice(-80)));
  flush();
}
function sendOne(rec){
  return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec),keepalive:true})
    .then(r=>r.text()).then(t=>{ if(!/"ok"\s*:\s*true/.test(t)) throw new Error("abgelehnt"); });
}
let flushing = false;
async function flush(){
  if(!ENDPOINT || flushing) return;
  flushing = true;
  let alleOk = true;
  try{
    const q = queue(), rest = [];
    for(const rec of q){ try{ await sendOne(rec); }catch(e){ rest.push(rec); alleOk = false; } }
    const neu = queue().slice(q.length);
    store.set(QKEY, JSON.stringify(rest.concat(neu).slice(-80)));
  } finally { flushing = false; }
  const s = $("sent"); if(s){ s.textContent = alleOk ? "✓ An die Lehrperson geschickt." : "Noch nicht geschickt – das passiert automatisch beim nächsten Öffnen."; s.className = "sent"+(alleOk?" ok":""); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") sendePending(); });
window.addEventListener("pagehide", ()=>sendePending());
/* ===== Lehrperson ===== */
let TD = null, K = null, NAMEN = {};
function ladeNamen(){ try{ NAMEN = JSON.parse(store.get("rs.namen")||"{}")||{}; }catch(e){ NAMEN = {}; } }
const nameVon = g => NAMEN[g] ? NAMEN[g] : "Nr. "+g;
const datumKurz = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"2-digit"}); };
const pc = (ok,n) => n ? Math.round(ok/n*100) : null;
const farbe = p => p===null ? "" : p>=90 ? "ok" : p>=75 ? "half" : "no";

/* Die Auswertung läuft nur eingebettet in der Deutsch-Station: rechtschreibung.html#lehrer=SCHLUESSEL */
const LEHRER_KEY = (()=>{ const m = location.hash.match(/(?:^#|&)lehrer=([a-f0-9]{32,})/); return m ? m[1] : ""; })();
if(LEHRER_KEY){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }

/* Anteil richtig wie bei den Kindern: Wort = 1 Aufgabe, Satz = 1 Aufgabe (Anteil richtiger Wörter) */
function aufgabenQuote(items){
  let w = 0, n = 0; const saetze = {};
  for(const i of items){
    if(i.k==="S"){ const key = i.rid+":"+i.z, x = saetze[key] || (saetze[key]={ok:0,n:0,extra:0}); if(i.extra) x.extra++; else { x.n++; if(i.ok) x.ok++; } }
    else if(!i.extra){ n++; if(i.ok) w++; }
  }
  for(const x of Object.values(saetze)){ if(!x.n) continue; n++; w += Math.max(0, x.ok - x.extra)/x.n; }
  return n ? Math.round(w/n*100) : null;
}

function auswerten(){
  const K = {};
  const runden = (TD.runden||[]).slice().sort((a,b)=>String(a.datum||a.zeit).localeCompare(String(b.datum||b.zeit)));
  runden.forEach((r,ri)=>{
    const g = String(r.glueckszahl||"?");
    const k = K[g] || (K[g] = {g, items:[], stand:null, last:null, sb:{}, tage:new Set(), saetze:[], geraete:new Set()});
    if(r.geraet) k.geraete.add(r.geraet);
    const d = r.datum || r.zeit;
    if(r.stand) k.stand = r.stand;
    k.last = d; k.tage.add(String(d).slice(0,10));
    const satzText = {}; (r.saetze||[]).forEach(s=>{ satzText[s.z] = s; k.saetze.push({...s, datum:d, thema:r.thema}); });
    zeitpunkte(k, r, d);
    for(const a of (r.aufgaben||[])){
      const it = {...a, datum:d, art:r.art, rid:ri};
      if(a.w){ it.res = pruefeWort(a.w, a.a||"", a.k==="S" || !!a.ims); it.ok = it.res.ok; it.fb = it.ok ? [] : fehlerBereiche(it.res); }
      else { it.extra = true; it.ok = false; it.fb = ["SO"]; }
      k.items.push(it);
      if(r.art==="sb"){ const sb = k.sb[r.sid] || (k.sb[r.sid] = {form:r.form, datum:d, items:[]}); sb.items.push(it); }
    }
  });
  for(const k of Object.values(K)){
    const woerter = k.items.filter(i=>!i.extra);
    k.n = woerter.length;
    k.akt = k.items.slice(-400);
    k.quoteAkt = aufgabenQuote(k.akt);
    k.cat = {};
    for(const i of k.akt){ if(i.extra){ const x = k.cat.SO || (k.cat.SO={n:0,f:0}); x.n++; x.f++; } else zaehle(i.res, k.cat); }
    k.beispiele = {};
    for(const i of k.items.slice().reverse()){ if(i.ok || i.extra || !i.a) continue;
      for(const c of i.fb){ const l = k.beispiele[c] || (k.beispiele[c]=[]); if(l.length<4 && !l.some(x=>x.w===i.w)) l.push({w:rein(i.w), a:i.a}); } }
    const letzte = {};
    for(const i of k.items){ if(i.w) letzte[rein(i.w)] = i.ok; }
    k.offen = Object.entries(letzte).filter(([w,ok])=>!ok).map(([w])=>w).slice(-24);
    k.sbList = Object.values(k.sb).sort((a,b)=>String(a.datum).localeCompare(String(b.datum))).map(sb=>{
      const q = aufgabenQuote(sb.items), st = {};
      for(const s of [1,2,3,4,5]) st[s] = aufgabenQuote(sb.items.filter(i=>i.s===s));
      // sicher bis Stufe s: Durchschnitt der Stufen 1..s mindestens 75% und Stufe s selbst mindestens 65%
      let niveau = 0, summe = 0, anz = 0;
      for(const s of [1,2,3,4,5]){ if(st[s]===null) continue; summe += st[s]; anz++; if(summe/anz >= 75 && st[s] >= 65) niveau = s; }
      const cat = {}; sb.items.forEach(i=>{ if(!i.extra) zaehle(i.res, cat); });
      return {...sb, q, st, niveau, cat, vollst: sb.items.length >= 50};
    });
    k.sbLetzte = k.sbList[k.sbList.length-1] || null;
    k.bloecke = bloecke(k.punkte || []);
    const jetzt = Date.now(), WOCHE = 7*24*3600e3;
    k.zeitTotal = k.bloecke.reduce((s,b)=>s+b.aktiv, 0);
    k.zeit7 = k.bloecke.filter(b=>jetzt - b.bis < WOCHE).reduce((s,b)=>s+b.aktiv, 0);
    k.zeitGeschaetzt = k.bloecke.some(b=>b.alt);
  }
  return K;
}

/* ===== Übungszeit =====
   Neue Daten: jede Antwort hat einen Zeitstempel (t). Ältere Daten: nur die Sendezeit pro Paket (geschätzt).
   Aktive Zeit: Pausen über 2 Minuten zählen nicht; nach 15 Minuten ohne Aktivität beginnt ein neuer Übungsblock. */
const PAUSE_MAX = 120e3, BLOCK_LUECKE = 15*60e3, ERSTE_AUFGABE = 15e3;
function zeitpunkte(k, r, d){
  const P = k.punkte || (k.punkte = []);
  const auf = (r.aufgaben||[]).filter(a=>!a.extra && a.w);
  if(!auf.length) return;
  const thema = r.thema || "", start = +r.start || null;
  if(auf.every(a=>a.t)){
    const saetze = {};
    for(const a of auf){
      if(a.k==="S"){ const s = saetze[a.z] || (saetze[a.z] = {zeit:0, n:1, ok:1, thema, start}); s.zeit = Math.max(s.zeit, +a.t); if(!a.ok) s.ok = 0; }
      else P.push({zeit:+a.t, n:1, ok:a.ok?1:0, thema, start});
    }
    Object.values(saetze).forEach(s=>P.push(s));
  } else {
    const zs = new Set(auf.filter(a=>a.k==="S").map(a=>a.z)), n = auf.filter(a=>a.k!=="S").length + zs.size;
    const ok = auf.filter(a=>a.k!=="S" && a.ok).length + [...zs].filter(z=>auf.filter(a=>a.k==="S" && a.z===z).every(a=>a.ok)).length;
    const zeit = Date.parse(d); if(isNaN(zeit)) return;
    P.push({zeit, n, ok, thema, alt:true});
  }
}
function bloecke(punkte){
  const ps = punkte.slice().sort((a,b)=>a.zeit-b.zeit), out = [];
  let b = null;
  for(const p of ps){
    if(!b || p.zeit - b.bis > BLOCK_LUECKE){
      let erst = p.alt ? p.n*ERSTE_AUFGABE : (p.start && p.zeit - p.start > 0 && p.zeit - p.start <= PAUSE_MAX ? p.zeit - p.start : ERSTE_AUFGABE);
      b = {von: p.zeit - erst, bis: p.zeit, aktiv: erst, n: p.n, ok: p.ok, themen: new Set([p.thema]), alt: !!p.alt};
      out.push(b);
    } else {
      const luecke = p.zeit - b.bis;
      b.aktiv += Math.min(luecke, p.alt ? p.n*PAUSE_MAX : PAUSE_MAX);
      b.bis = p.zeit; b.n += p.n; b.ok += p.ok; b.themen.add(p.thema); if(p.alt) b.alt = true;
    }
  }
  return out;
}
const fmtDauer = ms => { const m = Math.round(ms/60e3); if(ms > 0 && m < 1) return "< 1 Min"; if(m < 60) return m + " Min"; return Math.floor(m/60) + " h " + String(m%60).padStart(2,"0"); };
const fmtUhr = ms => new Date(ms).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
const tagKey = ms => { const d = new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const tagLabel = key => { const d = new Date(key+"T12:00:00"); return d.toLocaleDateString("de-CH",{weekday:"short", day:"2-digit", month:"2-digit"}); };
const themaKurz = t => String(t).replace(/^Stufe (\d) · /,"S$1 ").replace("Standortbestimmung","Standortbest.").replace("Regeltraining: ","Regel: ");

    return `<td class="num"><span class="zeit ${ms>=20*60e3?"viel":ms>=8*60e3?"mittel":"wenig"}" title="${esc(tip)}">${alt?"≈ ":""}${fmtDauer(ms)}</span><small class="uhr">${bs.map(b=>fmtUhr(b.von)).join(" · ")}</small></td>`;
  };

  app.innerHTML = `<div class="card wide-card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">⏱ Übungszeiten</h2>
      <div class="row no-print"><button class="btn ghost small" id="zurk">← Klasse</button><button class="btn ghost small" id="tprint">Drucken</button></div>
    </div>
    <p class="sub" style="margin-top:8px">Aktive Übungszeit pro Tag (Pausen über 2 Minuten zählen nicht). Darunter: Beginn der Übungsblöcke. Mit der Maus auf eine Zeit zeigen für Details. ≈ = geschätzt (ältere Daten vom 22.–27.10. ohne genaue Zeitstempel).</p>
    ${tage.length ? `<div class="tscroll"><table class="t zt"><tr><th>Kind</th>${tage.map(t=>`<th class="num">${esc(tagLabel(t))}</th>`).join("")}<th class="num">Total</th></tr>
      ${liste.map(k=>`<tr class="klick" data-g="${esc(k.g)}"><td><b>${esc(nameVon(k.g))}</b>${NAMEN[k.g]?` <span class="muted">${esc(k.g)}</span>`:""}</td>${tage.map(t=>zelle(k,t)).join("")}<td class="num"><b>${fmtDauer(summe(k))}</b></td></tr>`).join("")}

function zeitenProfil(k){
  if(!k.bloecke.length) return "";
  const tage = new Set(k.bloecke.map(b=>tagKey(b.von))).size;
  const zeilen = k.bloecke.slice().reverse().slice(0,20).map(b=>`<tr><td>${esc(tagLabel(tagKey(b.von)))}</td><td>${fmtUhr(b.von)}–${fmtUhr(b.bis)}</td><td class="num"><b>${b.alt?"≈ ":""}${fmtDauer(b.aktiv)}</b></td><td class="num">${b.n}</td><td class="num">${b.n?Math.round(b.ok/b.n*100)+"%":"–"}</td><td>${[...b.themen].map(t=>esc(themaKurz(t))).join(", ")}</td></tr>`).join("");
  return `<h3>Übungszeiten</h3>
    <p class="muted" style="margin-top:-4px">Total ${k.zeitGeschaetzt?"≈ ":""}<b>${fmtDauer(k.zeitTotal)}</b> an ${tage} ${tage===1?"Tag":"Tagen"} · letzte 7 Tage <b>${fmtDauer(k.zeit7)}</b> · Pausen über 2 Minuten zählen nicht${k.zeitGeschaetzt?" · ≈ geschätzt (ältere Daten)":""}</p>
    <table class="t"><tr><th>Tag</th><th>Zeit</th><th class="num">Aktiv</th><th class="num">Aufgaben</th><th class="num">Richtig</th><th>Geübt</th></tr>${zeilen}</table>`;
}

function catZelle(x){
  if(!x || x.n < 5) return `<td class="num muted">–</td>`;
  const p = pc(x.n-x.f, x.n);
  return `<td class="num"><span class="tag ${farbe(p)}" title="${x.n-x.f} von ${x.n} richtig">${p}%</span></td>`;
}

/* Sortieren der Klassenübersicht: Spaltenkopf antippen (nochmals = umgekehrt) */
const catPct = x => (!x || x.n < 5) ? null : pc(x.n-x.f, x.n);
const SPALTEN = {
  kind:    {wert: k => NAMEN[k.g] ? NAMEN[k.g].toLowerCase() : "~" + String(+k.g).padStart(6,"0"), start:"auf"},
  stufe:   {wert: k => k.stand && k.stand.stufe ? k.stand.stufe*10 + Math.min(k.stand.etappe||0, ETAPPEN_PRO_STUFE) : null, start:"ab"},
  woerter: {wert: k => k.n, start:"ab"},
  richtig: {wert: k => k.quoteAkt, start:"auf"},
  sb:      {wert: k => k.sbLetzte ? k.sbLetzte.q : null, start:"auf"},
  zuletzt: {wert: k => k.last ? String(k.last) : null, start:"ab"},
  zeit7:   {wert: k => k.zeit7 || 0, start:"ab"},
  zeitTot: {wert: k => k.zeitTotal || 0, start:"ab"}
};
CAT_ORDER.forEach(c => SPALTEN["cat_"+c] = {wert: k => catPct(k.cat[c]), start:"auf"});
let SORT = (()=>{ try{ const s = JSON.parse(store.get("rs.sort")||"null"); if(s && SPALTEN[s.key]) return s; }catch(e){} return {key:"kind", dir:"auf"}; })();
function sortiere(liste){
  const sp = SPALTEN[SORT.key], f = SORT.dir==="auf" ? 1 : -1;
  return liste.slice().sort((a,b)=>{
    const x = sp.wert(a), y = sp.wert(b);
    if(x===null && y===null) return (+a.g)-(+b.g);
    if(x===null) return 1; if(y===null) return -1;          // ohne Daten immer unten
    const v = typeof x==="string" ? x.localeCompare(y,"de") : x - y;
    return v ? v*f : (+a.g)-(+b.g);
  });
}
function kopf(key, text, cls, title){
  const an = SORT.key===key, pfeil = an ? (SORT.dir==="auf" ? " ▲" : " ▼") : "";
  return `<th class="${cls||""} sortbar${an?" an":""}" data-sort="${key}" ${title?`title="${esc(title)}"`:""} aria-sort="${an?(SORT.dir==="auf"?"ascending":"descending"):"none"}">${text}<span class="pfeil">${pfeil}</span></th>`;
}
/* Verwaltung im Profil: Standortbestimmung zurücksetzen */
function verwaltung(g){
  const b = (TD.befehle||{})[g];
  return `<div class="verwaltung no-print">${b
    ? `<span>↺ <b>Zurücksetzen angefordert</b> (${datumKurz(b.zeit)}) – wird ausgeführt, sobald das Kind das Training öffnet.</span> <button class="btn ghost small" id="sbabbr">Abbrechen</button>`
    : `<button class="btn ghost small" id="sbreset">↺ Standortbestimmung zurücksetzen</button> <span class="muted">Das Kind macht sie beim nächsten Öffnen neu; die Stufe wird neu bestimmt.</span>`}</div>`;
}
function befehlSenden(g, befehl){
  if(!ENDPOINT){ TD.befehle = TD.befehle || {}; if(befehl==="abbrechen") delete TD.befehle[g]; else TD.befehle[g] = {befehl, id:"demo", zeit:new Date().toISOString()}; return profil(g); }
  const box = app.querySelector(".verwaltung"); if(box) box.innerHTML = `<span class="muted">Wird gespeichert …</span>`;
  fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({typ:"lehrer-befehl", schluessel:LEHRER_KEY, glueckszahl:g, befehl})})
    .then(r=>r.json()).then(d=>{
      if(!d || !d.ok) throw new Error((d && d.fehler) || "abgelehnt");

    })
    .catch(e=>{ if(box) box.innerHTML = `<span style="color:var(--bad)">Konnte nicht gespeichert werden (${esc(e.message)}). Bitte nochmals versuchen.</span>`; setTimeout(()=>profil(g), 4000); });
}
const mehrereTablets = k => k.geraete && k.geraete.size > 1
  ? ` <span class="doppelt" title="Diese Glückszahl wurde auf ${k.geraete.size} verschiedenen Tablets benutzt – vielleicht hat sich ein Kind vertippt.">⚠️ ${k.geraete.size} Tablets</span>` : "";

  pill.hidden = true; $("wrap").classList.add("wide"); stille();

    return `<tr class="klick" data-g="${esc(k.g)}"><td><b>${esc(nameVon(k.g))}</b>${NAMEN[k.g]?` <span class="muted">${esc(k.g)}</span>`:""}${mehrereTablets(k)}${(TD.befehle||{})[k.g] ? ` <span class="doppelt" title="Die Standortbestimmung wird zurückgesetzt, sobald das Kind das Training öffnet.">↺ SB neu</span>` : ""}</td>
      <td class="num">${st.stufe?`${st.stufe} · ${Math.min(st.etappe||0,ETAPPEN_PRO_STUFE)}/${ETAPPEN_PRO_STUFE}`:"–"}</td>

      <td class="num">${k.quoteAkt===null?"–":`<span class="tag ${farbe(k.quoteAkt)}">${k.quoteAkt}%</span>`}</td>
      <td class="num">${k.sbLetzte?`${k.sbLetzte.q}% <span class="muted">${k.sbLetzte.niveau?"bis S"+k.sbLetzte.niveau:"&lt; S1"}</span>`:"–"}</td>
      ${CAT_ORDER.map(c=>catZelle(k.cat[c])).join("")}

  app.innerHTML = `<div class="card wide-card">

      <h2 style="margin:0">Rechtschreibung · Klassenübersicht</h2>

        <button class="btn ghost small" id="zeiten">⏱ Übungszeiten</button><button class="btn ghost small" id="namen">Namen</button><button class="btn ghost small" id="tprint">Drucken</button><button class="btn ghost small" id="tload">↻ Aktualisieren</button></div>
    </div>
    ${TD.demo?`<div class="warn">Beispieldaten – so sieht die Auswertung aus, sobald die Kinder üben. Die Namen sind erfunden.</div>`:""}
    <p class="sub" style="margin-top:8px">Prozent = Anteil richtig in den letzten 400 geschriebenen Wörtern. Bereiche: Anteil der Stellen, an denen die Regel richtig angewendet wurde. Grün ab 90%, gelb ab 75%. Spaltenkopf antippen zum Sortieren, Zeile antippen für das Profil.</p>
    <div class="tscroll"><table class="t"><tr>${kopf("kind","Kind")}${kopf("stufe","Stufe · Etappe","num")}${kopf("woerter","Wörter","num")}${kopf("zeit7","Zeit 7&nbsp;Tage","num","Aktive Übungszeit der letzten 7 Tage")}${kopf("zeitTot","Zeit total","num","Aktive Übungszeit insgesamt (≈ = teilweise geschätzt)")}${kopf("richtig","Richtig","num")}${kopf("sb","Standort&shy;bestimmung","num")}
      ${CAT_ORDER.map(c=>kopf("cat_"+c, esc(CATS[c].kurz).replace("Nominalisierung","Nomina&shy;lisierung"), "num vert", CATS[c].name)).join("")}${kopf("zuletzt","Zuletzt")}</tr>
      ${zeilen || `<tr><td colspan="19">Noch keine Daten.</td></tr>`}</table></div>
    ${klassenBereiche(liste)}
  </div>`;
  $("tload").onclick = lehrperson;
  $("tprint").onclick = ()=>print();
  $("namen").onclick = ()=>namenEditor(liste);
  $("zeiten").onclick = zeitenAnsicht;
  app.querySelectorAll("tr[data-g]").forEach(tr=>tr.onclick=()=>profil(tr.dataset.g));
  app.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const key = th.dataset.sort;

    store.set("rs.sort", JSON.stringify(SORT));
    const x = window.scrollX, y = window.scrollY, sx = app.querySelector(".tscroll").scrollLeft;
    klasse(false);
    window.scrollTo(x, y); app.querySelector(".tscroll").scrollLeft = sx;
  });
  if(neu !== false) window.scrollTo(0,0);
}
function klassenBereiche(liste){
  const sum = {};
  liste.forEach(k=>{ for(const c in k.cat){ const x = sum[c] || (sum[c]={n:0,f:0}); x.n += k.cat[c].n; x.f += k.cat[c].f; } });
  const cs = CAT_ORDER.filter(c=>sum[c] && sum[c].n>=10);
  if(!cs.length) return "";
  return `<h2 style="margin-top:26px">Ganze Klasse: Wo liegen die Schwierigkeiten?</h2>
    <div class="cbars">${cs.sort((a,b)=>sum[b].f/sum[b].n - sum[a].f/sum[a].n).map(c=>{ const p = pc(sum[c].n-sum[c].f, sum[c].n);
      return `<div class="cbar"><span>${esc(CATS[c].name)}</span><div class="bar"><i style="width:${p}%;background:${CATS[c].farbe}"></i></div><b>${p}%</b></div>`; }).join("")}</div>`;
}
function namenEditor(liste){
  app.innerHTML = `<div class="card">
