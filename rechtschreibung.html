function einschaetzung(k){
  const nm = NAMEN[k.g] || "Das Kind";
  const st = k.stand || {};
  if(k.n < 40 && !k.sbLetzte) return `<p>Noch zu wenig Daten für eine verlässliche Einschätzung (${k.n} Wörter).</p>`;
  const s = [];
  s.push(`${esc(nm)} hat bisher <b>${k.n} Wörter</b> geschrieben, an ${k.tage.size} ${k.tage.size===1?"Tag":"Tagen"}, und übt zurzeit auf <b>Stufe ${st.stufe||"–"}</b>${st.stufe?` («${esc(STUFEN[st.stufe])}»)`:""}. Von den zuletzt geschriebenen Wörtern sind <b>${k.quoteAkt}%</b> richtig.`);
  const sb = k.sbLetzte;
  if(sb){
    s.push(`In der letzten Standortbestimmung (${datumKurz(sb.datum)}) waren ${sb.q}% richtig. ` + (sb.niveau ? `Sicher gelingen die Wörter bis <b>Stufe ${sb.niveau}</b> («${esc(STUFEN[sb.niveau])}»)${sb.niveau<5?`; ab Stufe ${sb.niveau+1} nehmen die Fehler deutlich zu`:""}.` : `Schon auf Stufe 1 (kurze, häufige Wörter) sind weniger als 75% richtig – hier braucht es gezielte Unterstützung.`));
    if(k.sbList.length>1){ const a = k.sbList[0], d = sb.q - a.q;
      s.push(`Seit der ersten Standortbestimmung (${datumKurz(a.datum)}: ${a.q}%) hat sich das Resultat ${Math.abs(d)<3?"kaum verändert":d>0?`um <b>${d} Prozentpunkte verbessert</b>`:`um ${-d} Prozentpunkte verschlechtert`}.`); }
  }
  const cs = CAT_ORDER.filter(c=>k.cat[c]);
  const rate = c => (k.cat[c].n-k.cat[c].f)/k.cat[c].n;
  const stark = cs.filter(c=>c!=="SO" && k.cat[c].n>=10 && rate(c)>=0.9).sort((a,b)=>rate(b)-rate(a)).slice(0,4);
  const schwach = cs.filter(c=>k.cat[c].n>=6 && rate(c)<0.75).sort((a,b)=>rate(a)-rate(b)).slice(0,3);
  if(stark.length) s.push(`<b>Sicher:</b> ${stark.map(c=>`${esc(CATS[c].name)} (${Math.round(rate(c)*100)}%)`).join(", ")}.`);
  if(schwach.length){
    s.push(`<b>Schwierigkeiten:</b> ${schwach.map(c=>{ const b = (k.beispiele[c]||[])[0]; return `${esc(CATS[c].name)} (${Math.round(rate(c)*100)}%${b?`, z. B. «${esc(b.a)}» statt «${esc(b.w)}»`:""})`; }).join("; ")}.`);
    s.push(`<b>Empfehlung:</b> ${schwach.slice(0,2).map(c=>esc(CATS[c].lp)).join(" ")}`);
  } else if(k.n>=40) s.push(`In keinem Bereich zeigen sich grössere Schwierigkeiten.`);
  if(st.kiste) s.push(`In der Fehlerkiste liegen zurzeit ${st.kiste} Wörter, die noch nicht sicher sitzen.`);
  return s.map(x=>`<p>${x}</p>`).join("");
}

function verlaufSVG(k){
  const wochen = {};
  k.items.filter(i=>!i.extra).forEach(i=>{ const d = new Date(i.datum); if(isNaN(d)) return;
    const mo = new Date(d); mo.setHours(0,0,0,0); mo.setDate(mo.getDate()-((mo.getDay()+6)%7));
    const key = mo.toISOString().slice(0,10), x = wochen[key] || (wochen[key]={n:0,ok:0}); x.n++; if(i.ok) x.ok++; });
  const keys = Object.keys(wochen).sort().slice(-16);
  if(keys.length < 2) return "";
  const W = 640, H = 170, pad = 28, bw = (W-pad*2)/keys.length;
  const bars = keys.map((key,i)=>{ const x = wochen[key], p = x.ok/x.n, h = (H-50)*p, X = pad+i*bw+4, Y = H-26-h;
    const d = new Date(key);
    return `<rect x="${X}" y="${Y}" width="${bw-8}" height="${h}" rx="4" fill="${p>=0.9?"#3fbf6f":p>=0.75?"#f5c04a":"#ef7b6f"}"/>
      <text x="${X+(bw-8)/2}" y="${Y-5}" text-anchor="middle" font-size="11" fill="currentColor">${Math.round(p*100)}%</text>
      <text x="${X+(bw-8)/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="#64708a">${d.getDate()}.${d.getMonth()+1}.</text>`; }).join("");
  return `<h3>Verlauf pro Woche (Anteil richtig geschriebener Wörter)</h3>
    <svg class="verlauf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Anteil richtig pro Woche">
      <line x1="${pad}" x2="${W-pad}" y1="${H-26-(H-50)*0.9}" y2="${H-26-(H-50)*0.9}" stroke="#3fbf6f" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="${pad}" x2="${W-pad}" y1="${H-26}" y2="${H-26}" stroke="#dfe5ef"/>${bars}</svg>`;
}

function profil(g){
  const k = K[g], st = k.stand || {};
  const cs = CAT_ORDER.filter(c=>k.cat[c] && k.cat[c].n>=3);
  const bereiche = cs.map(c=>{ const x = k.cat[c], p = pc(x.n-x.f, x.n), bsp = (k.beispiele[c]||[]).slice(0,3);
    return `<div class="prow"><div class="pname"><b>${esc(CATS[c].name)}</b><span class="muted">${x.n-x.f} von ${x.n} Stellen richtig</span></div>
      <div class="bar"><i style="width:${p}%;background:${p>=90?"#3fbf6f":p>=75?"#f5c04a":"#ef7b6f"}"></i></div><b class="pp">${p}%</b>
      <div class="bsp">${bsp.map(b=>`<span><s>${esc(b.a)}</s> → ${esc(b.w)}</span>`).join("")}</div></div>`; }).join("");
  const sbTab = k.sbList.length ? `<h3>Standortbestimmungen</h3><p class="muted" style="margin-top:-4px">Pro Stufe 6 Wörter und 1–2 Sätze, immer gleich aufgebaut (Form A und B wechseln ab). «Sicher bis»: bis zu dieser Stufe im Schnitt mindestens 75% richtig.</p><table class="t"><tr><th>Datum</th><th>Form</th><th class="num">Gesamt</th>${[1,2,3,4,5].map(s=>`<th class="num">Stufe ${s}</th>`).join("")}<th class="num">Sicher bis</th></tr>
    ${k.sbList.map(sb=>`<tr><td>${datumKurz(sb.datum)}</td><td>${esc(sb.form)}${sb.vollst?"":" <span class='muted'>(unvollständig)</span>"}</td><td class="num"><b>${sb.q}%</b></td>${[1,2,3,4,5].map(s=>`<td class="num">${sb.st[s]===null?"–":`<span class="tag ${farbe(sb.st[s])}">${sb.st[s]}%</span>`}</td>`).join("")}<td class="num">${sb.niveau?"Stufe "+sb.niveau:"–"}</td></tr>`).join("")}</table>` : `<p class="muted">Noch keine Standortbestimmung.</p>`;
  const saetze = k.saetze.slice(-6).reverse().map(s=>{
    const paare = pruefeSatz(s.t, s.a||"");
    const deins = paare.map(p=> p.extra ? `<span class="tok extra">${esc(p.a)}</span>` : !p.a ? `<span class="tok miss">___</span>` : `<span class="tok ${p.ok?"":"bad"}">${p.ok?esc(p.a):zeigeMarkiert(p.a,p.markA,"x")}</span>`).join(" ");
    return `<li><span class="muted">${datumKurz(s.datum)}</span><div>${deins}<br><span class="muted">${esc(sprechText(s.t))}</span></div></li>`; }).join("");
  app.innerHTML = `<div class="card wide-card profil">
    <div class="row no-print" style="justify-content:space-between"><button class="btn ghost small" id="zur">← Klasse</button>
      <div class="row"><button class="btn ghost small" id="tprint">Drucken</button></div></div>
    <p class="sub" style="margin:14px 0 0">Rechtschreibprofil · Stand ${datumKurz(new Date().toISOString())}</p>
    <h2 class="ptitle">${esc(nameVon(g))}${NAMEN[g]?` <span class="muted">· Glückszahl ${esc(g)}</span>`:""}${mehrereTablets(k)}</h2>
    <div class="kpis">
      <div><b>${!k.sbLetzte ? "–" : k.sbLetzte.niveau ? "Stufe "+k.sbLetzte.niveau : "unter Stufe 1"}</b><span>sicher bis (Standortbestimmung)</span></div>
      <div><b>${st.stufe ? "Stufe "+st.stufe : "–"}</b><span>übt zurzeit${st.stufe?` · Etappe ${Math.min((st.etappe||0)+1,ETAPPEN_PRO_STUFE)}`:""}</span></div>
      <div><b>${k.quoteAkt===null?"–":k.quoteAkt+"%"}</b><span>richtig (aktuell)</span></div>
      <div><b>${k.n}</b><span>Wörter geschrieben</span></div>
      <div><b>${k.tage.size}</b><span>Übungstage</span></div>
      <div><b>${st.kiste??"–"}</b><span>Wörter in der Fehlerkiste</span></div>
    </div>
    ${verwaltung(g)}
    <div class="assess"><h3>Einschätzung</h3>${einschaetzung(k)}</div>
    <h3>Rechtschreibbereiche</h3>
    <p class="muted" style="margin-top:-4px">Wie oft die Regel an den passenden Stellen richtig angewendet wurde (letzte 400 Wörter), mit Beispielen aus den Fehlern.</p>
    <div class="pbars">${bereiche || `<p class="muted">Noch keine Daten.</p>`}</div>
    ${sbTab}
    ${zeitenProfil(k)}
    ${verlaufSVG(k)}
    ${k.offen.length?`<h3>Noch nicht sicher</h3><p class="muted" style="margin-top:-4px">Wörter, die beim letzten Versuch falsch waren.</p><p class="chips">${k.offen.map(w=>`<span>${esc(w)}</span>`).join("")}</p>`:""}
    ${saetze?`<h3>Letzte Sätze</h3><ul class="satzliste">${saetze}</ul>`:""}
    <p class="muted stufenlegende">Stufen: ${[1,2,3,4,5].map(s=>`${s} = ${esc(STUFEN[s])}`).join(" · ")}</p>
  </div>`;
  $("zur").onclick = klasse;
  $("tprint").onclick = ()=>print();
  const rs = $("sbreset"); if(rs) rs.onclick = ()=>{ if(confirm(`Standortbestimmung von ${nameVon(g)} zurücksetzen?\n\nBeim nächsten Öffnen macht das Kind die Standortbestimmung neu, und die Stufe wird neu bestimmt. Fehlerkiste und bisherige Resultate bleiben erhalten.`)) befehlSenden(g, "sb-reset"); };
  const ab = $("sbabbr"); if(ab) ab.onclick = ()=>befehlSenden(g, "abbrechen");
  window.scrollTo(0,0);
}

/* ===== Beispieldaten für die Vorschau ===== */
function beispielDaten(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const kinder = [
    {g:"7",  name:"Lina",  p:{GK:.04,NG:.25,DK:.05,CK:.03,IE:.03,DH:.08,AV:.05,AE:.05,V:.03,DS:.2,SO:.02}, stufe:4, et:22},
    {g:"12", name:"Noah",  p:{GK:.25,NG:.7,DK:.2,CK:.15,IE:.1,DH:.3,AV:.3,AE:.25,V:.2,DS:.6,SO:.06}, stufe:2, et:14},
    {g:"23", name:"Elif",  p:{GK:.08,NG:.4,DK:.3,CK:.25,IE:.05,DH:.2,AV:.1,AE:.1,V:.1,DS:.35,SO:.04}, stufe:3, et:18},
    {g:"31", name:"Jonas", p:{GK:.02,NG:.1,DK:.03,CK:.02,IE:.02,DH:.05,AV:.03,AE:.03,V:.02,DS:.08,SO:.01}, stufe:5, et:26},
    {g:"44", name:"Mia",   p:{GK:.12,NG:.5,DK:.1,CK:.1,IE:.25,DH:.35,AV:.15,AE:.3,V:.15,DS:.5,SO:.05}, stufe:2, et:11},
    {g:"58", name:"Luca",  p:{GK:.35,NG:.8,DK:.35,CK:.3,IE:.2,DH:.4,AV:.45,AE:.4,V:.35,DS:.7,SO:.12}, stufe:1, et:9},
    {g:"63", name:"Sara",  p:{GK:.05,NG:.3,DK:.08,CK:.05,IE:.04,DH:.12,AV:.2,AE:.08,V:.05,DS:.25,SO:.03}, stufe:3, et:20},
    {g:"77", name:"Ben",   p:{GK:.15,NG:.5,DK:.15,CK:.1,IE:.1,DH:.15,AV:.15,AE:.15,V:.1,DS:.4,SO:.08}, stufe:2, et:15}
  ];
  const mut = (w, ims, p, f) => {
    let x = rein(w);
    const ops = stellen(w, ims).slice().sort((a,b)=>b.s-a.s);
    for(const o of ops){
      if(rnd() >= p[o.c]*f) continue;
      const seg = x.slice(o.s,o.e); let neu = seg;
      if(o.c==="GK"||o.c==="NG") neu = seg===seg.toUpperCase() ? seg.toLowerCase() : seg.toUpperCase();
      else if(o.c==="DK") neu = seg.slice(1);
      else if(o.c==="CK") neu = seg==="ck"?"k":"z";
      else if(o.c==="IE") neu = "i";
      else if(o.c==="DH") neu = seg[1]==="h" ? seg[0] : seg[0];
      else if(o.c==="AV") neu = o.s===x.length-1 && seg==="g" && x[o.s-1]==="i" ? "ch" : ({d:"t",b:"p",g:"k"})[seg] || seg;
      else if(o.c==="AE") neu = seg==="äu" ? "eu" : "e";
      else if(o.c==="V") neu = "f";
      else if(o.c==="DS") neu = seg==="dass" ? "das" : "dass";
      x = x.slice(0,o.s) + neu + x.slice(o.e);
    }
    if(x.length>4 && rnd() < p.SO*f){ const i = 1+Math.floor(rnd()*(x.length-2)); x = x.slice(0,i)+x.slice(i+1); }
    return x;
  };
  const runden = [];
  const start = new Date("2026-09-07T08:30:00");
  kinder.forEach(kd=>{
    const tag = n => { const d = new Date(start); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()+Math.floor(rnd()*300)); return d.toISOString(); };
    const sbRunde = (form, d, f) => {
      const F = SB_FORMEN[form], auf = [], saetze = []; let z = 0;
      for(const s of [1,2,3,4,5]){
        F.woerter[s].split(" ").forEach(w=>{ const a = mut(w,false,kd.p,f*(0.6+s*0.2)); auf.push({w,a,ok:a===w?1:0,s,k:"W",q:"B"}); });
        F.saetze.filter(x=>x[0]===s).forEach(([st,t])=>{ z++; const toks = satzTokens(t); const as = toks.map(w=>mut(w,true,kd.p,f*(0.6+s*0.2)));
          toks.forEach((w,i)=>auf.push({w,a:as[i],ok:as[i]===rein(w)?1:0,s,k:"S",q:"B",z})); saetze.push({z,t,a:as.join(" ")+"."}); });
      }
      runden.push({glueckszahl:kd.g, art:"sb", sid:"sb"+kd.g+form, form, thema:"Standortbestimmung "+form, datum:d, saetze, aufgaben:auf, stand:{stufe:kd.stufe, etappe:0, total:0, kiste:0, sb:1}});
    };
    sbRunde("A", tag(0), 1.15);
    let stufe = Math.max(1, kd.stufe-2), et = 0;
    for(let e=0;e<kd.et;e++){
      const f = 1.1 - e/kd.et*0.35, auf = [], saetze = [];
      nimmDemo(POOL_W[stufe], 12, rnd).forEach(w=>{ const a = mut(w.w,false,kd.p,f*(0.7+stufe*0.15)); auf.push({w:w.w,a,ok:a===w.w?1:0,s:stufe,k:"W",q:"E"}); });
      nimmDemo(POOL_S[stufe], 2, rnd).forEach((x,zi)=>{ const toks = satzTokens(x.t), as = toks.map(w=>mut(w,true,kd.p,f*(0.7+stufe*0.15)));
        toks.forEach((w,i)=>auf.push({w,a:as[i],ok:as[i]===rein(w)?1:0,s:stufe,k:"S",q:"E",z:zi+1})); saetze.push({z:zi+1,t:x.t,a:as.join(" ")+"."}); });
      const ok = auf.filter(a=>a.ok).length/auf.length >= 0.8;
      if(ok){ et++; if(et>=ETAPPEN_PRO_STUFE && stufe<5){ stufe++; et=0; } }
      runden.push({glueckszahl:kd.g, art:"etappe", sid:"e"+kd.g+e, thema:`Stufe ${stufe} · Etappe ${et+1}`, datum:tag(2+Math.floor(e*42/kd.et)), saetze, aufgaben:auf,
        stand:{stufe, etappe:et, total:e+1, kiste:Math.floor(rnd()*9)+(kd.p.GK>0.2?6:0), sb:1}});
    }
    sbRunde("B", tag(45), 0.85);
    runden[runden.length-1].stand = {...runden[runden.length-2].stand, sb:2};
    NAMEN_DEMO[kd.g] = kd.name;
  });
  runden.forEach(r=>{ const t0 = Date.parse(r.datum); r.start = t0; let i = 0, z0 = null;
    r.aufgaben.forEach(a=>{ if(a.k==="S"){ if(a.z!==z0){ i++; z0 = a.z; } } else i++; a.t = t0 + i*(14000 + Math.floor(rnd()*12000)); }); });
  if(!Object.keys(NAMEN).length) Object.assign(NAMEN, NAMEN_DEMO);
  return {ok:true, demo:true, runden};
}
const NAMEN_DEMO = {};
function nimmDemo(pool, n, rnd){ const a = pool.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,n); }
