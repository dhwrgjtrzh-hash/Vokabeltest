<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KI-Lernwerkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine zentrierte Spalte (max 760px) auf Rechenheft-Karo; Ansichten wechseln an Ort: Übersicht → Kapitel (Schritt für Schritt) → Lernstand-Check. Alle Icons sind 0/1-Pixelbilder, wie in Kapitel 4. */
:root{
  --paper:#f8faff; --grid:#e1e8f6; --card:#ffffff; --line:#d3dbec;
  --ink:#1a2348; --ink-soft:#56607f;
  --blue:#2b55d4; --blue-soft:#e7edfd; --on-blue:#ffffff;
  --marker:#ffcf2e; --hl:#ffe27a; --hl-soft:#fff6cf;
  --good:#1d8a4b; --good-soft:#e2f4e9; --bad:#c6372c; --bad-soft:#fbe6e3;
  --cr1:#ef78a6; --cr2:#45b97c; --cr3:#5a8af0; --cr4:#f0b232;
  --eye:#ffffff; --pupil:#1a2348; --tag-ink:#1a2348;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10152a; --grid:#1a2241; --card:#171f3a; --line:#2b3558;
    --ink:#e9edf9; --ink-soft:#a5adc8;
    --blue:#7f9dff; --blue-soft:#1f2a55; --on-blue:#0d1330;
    --marker:#ffcf2e; --hl:rgba(255,207,46,.32); --hl-soft:#2e2913;
    --good:#55cf8a; --good-soft:#13331f; --bad:#ff7e72; --bad-soft:#3a1b19;
    --cr1:#f08ab2; --cr2:#55c78a; --cr3:#7b9ff5; --cr4:#f3bd4c;
    --eye:#ffffff; --pupil:#1a2348; --tag-ink:#1a2348;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10152a; --grid:#1a2241; --card:#171f3a; --line:#2b3558;
  --ink:#e9edf9; --ink-soft:#a5adc8;
  --blue:#7f9dff; --blue-soft:#1f2a55; --on-blue:#0d1330;
  --marker:#ffcf2e; --hl:rgba(255,207,46,.32); --hl-soft:#2e2913;
  --good:#55cf8a; --good-soft:#13331f; --bad:#ff7e72; --bad-soft:#3a1b19;
  --cr1:#f08ab2; --cr2:#55c78a; --cr3:#7b9ff5; --cr4:#f3bd4c;
  --eye:#ffffff; --pupil:#1a2348; --tag-ink:#1a2348;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.6;
}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0 0 .7em}
p:last-child{margin-bottom:0}
b{font-weight:700}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 .1em}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.pix{display:block}
.pix .p1{fill:var(--ink)}
.pix .p2{fill:var(--marker)}
.bit .p1{fill:var(--blue)}
.bit .p2{fill:var(--marker)}

/* Übersicht */
.hero{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.hero .bit{width:84px;flex:none}
.hero h1{font-size:clamp(2.3rem,8vw,3.5rem);font-weight:800;letter-spacing:-.01em}
.hero p{margin:.3em 0 0;color:var(--ink-soft);max-width:34em}
.overall{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:.95rem;color:var(--ink-soft)}
.meter{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:5px;transition:width .4s}
.chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ch-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.ch-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.icobox{width:46px;height:46px;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
.icobox .pix{width:28px;height:28px}
.ch-card.done .icobox{background:var(--good-soft)}
.ch-card.done .icobox .p1{fill:var(--good)}
.kick{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.ch-card h3{font-size:1.25rem;font-weight:800}
.status{font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:3px;min-height:20px}
.stars{display:flex;gap:3px}
.stars .pix{width:16px;height:16px}
.stars .off .p1{fill:var(--line)}
.stars .on .p1{fill:var(--marker)}
.quiz-card{margin-top:14px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--blue);color:var(--on-blue);border:0;border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s}
.quiz-card:hover{transform:translateY(-2px)}
.quiz-card .pix{width:44px;height:44px;flex:none}
.quiz-card .pix .p1{fill:var(--marker)}
.quiz-card h3{font-size:1.5rem;font-weight:800}
.quiz-card span{font-size:.95rem;opacity:.92}
.quiz-card .go{margin-left:auto;font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.foot{margin-top:34px;padding-top:16px;border-top:1.5px dashed var(--line);font-size:.88rem;color:var(--ink-soft)}
.foot b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:.88rem}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Kapitel */
.ch-head{margin-bottom:14px}
.back{background:none;border:0;padding:4px 0;color:var(--blue);font-weight:700;cursor:pointer;margin-bottom:8px}
.ch-head h2{font-size:clamp(1.8rem,6vw,2.4rem);font-weight:800}
.dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dots span{width:14px;height:14px;background:var(--line);border-radius:2px}
.dots span.past{background:var(--good)}
.dots span.now{background:var(--blue)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px}
@media (max-width:480px){.panel{padding:16px}}
.panel h3{font-size:1.45rem;font-weight:800;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:700;margin:0 0 14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.small{padding:8px 14px;font-size:.92rem}
.hint{font-size:.9rem;color:var(--ink-soft);margin-top:8px}

/* Bit fragt (Einstieg) */
.hook{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.hook .bit{width:64px;flex:none}
.speech{position:relative;background:var(--blue-soft);border-radius:16px;padding:14px 16px;flex:1;min-width:0}
.speech small{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.speech p{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.3;margin:2px 0 0}
.guess{display:flex;flex-wrap:wrap;gap:8px}
.guess button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.guess button:hover:not(:disabled){border-color:var(--blue)}
.guess button.picked{border-color:var(--blue);background:var(--blue-soft)}
.guess button.right{border-color:var(--good);background:var(--good-soft)}
.guess button:disabled{cursor:default}

/* Lernkarten */
.cards{display:flex;flex-direction:column;gap:14px}
.lk h4{font-size:1.15rem;font-weight:800;margin-bottom:4px;color:var(--blue)}
.lk+.lk{padding-top:14px;border-top:1.5px dashed var(--line)}
.wort{margin-top:14px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.96rem}
.wort .kick{margin-bottom:2px}
.wort dl{margin:0;display:grid;gap:4px}
.wort dt{font-weight:700;display:inline}
.wort dd{display:inline;margin:0}
.merke{margin-top:16px;background:var(--hl-soft);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.merke .tag{font-family:var(--f-display);font-weight:800;background:var(--marker);color:#2b2100;border-radius:6px;padding:1px 9px;flex:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0}
.compare>div{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.compare h4{margin:0 0 4px;font-family:var(--f-display);font-size:1.1rem;color:var(--ink)}
.compare p{margin:0;font-size:.96rem}
.compare small{display:block;margin-top:6px;color:var(--ink-soft);font-size:.86rem}
@media (max-width:540px){.compare{grid-template-columns:1fr}}
.loop{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.loop li{background:var(--blue-soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.93rem}
.loop li.arr{background:none;padding:0;color:var(--ink-soft)}
.tbl{overflow-x:auto;margin:8px 0 0}
.tbl table{border-collapse:collapse;width:100%;min-width:440px;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.bb{display:inline-block;border-radius:6px;padding:0 8px;font-weight:700;color:var(--tag-ink)}
.b1{background:var(--cr1)}.b2{background:var(--cr2)}.b3{background:var(--cr3)}.b4{background:var(--cr4)}
.phone{border:2px solid var(--line);border-radius:18px;padding:12px;max-width:320px;margin:8px 0}
.phone .typed{font-family:var(--f-mono);font-size:.95rem;padding:8px 10px;background:var(--blue-soft);border-radius:8px}
.phone .sugg{display:flex;gap:6px;margin-top:8px}
.phone .sugg span{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:4px;font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.bubble{border-radius:14px;padding:10px 14px;max-width:88%;font-size:.98rem}
.bubble.me{align-self:flex-end;background:var(--blue);color:var(--on-blue)}
.bubble.ai{align-self:flex-start;background:var(--blue-soft)}
.bubble small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.lex{border:2px solid var(--ink);border-radius:4px;padding:10px 14px;margin:0 0 14px;font-size:.95rem;background:var(--card)}
.lex .kick{margin-bottom:2px}
.mini-ill{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
.mini-ill .pix{width:96px;height:96px;border:1.5px solid var(--line);border-radius:6px;padding:4px}

/* Antworten */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;opacity:.85}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.fb .bit{width:34px;flex:none}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.info{background:var(--blue-soft)}
.fb b.t{display:block;font-family:var(--f-display);font-size:1.1rem}
.fb>div{min-width:0}

.sort-list{display:flex;flex-direction:column;gap:10px}
.sort-item{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sort-item .txt{flex:1 1 220px;min-width:0}
.sort-item.ok{border-color:var(--good);background:var(--good-soft)}
.sort-item.no{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.92rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.seg button:disabled{cursor:default}
.check-row{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.gap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:1.05rem;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.gap-row .lbl{font-family:var(--f-body);font-size:.95rem;color:var(--ink-soft)}
select{font:inherit;font-family:var(--f-mono);border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);color:var(--ink)}
select.ok{border-color:var(--good);background:var(--good-soft)}
select.no{border-color:var(--bad);background:var(--bad-soft)}

.creatures{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.creature{width:64px;height:64px}
.ex-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ex-row .name{font-family:var(--f-display);font-weight:800;font-size:1.2rem;min-width:70px}

.bars{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.bar{display:grid;grid-template-columns:minmax(80px,9em) 1fr 3.4em;gap:10px;align-items:center;font-size:.95rem}
.bar .lab{min-width:0;overflow-wrap:anywhere}
.bar .track{height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:4px;transition:width .5s}
.bar.top .fill{background:var(--good)}
.bar.mine .lab{font-weight:700;text-decoration:underline;text-decoration-color:var(--marker);text-decoration-thickness:3px}
.bar .pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:.88rem}

.pixwork{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.pgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:min(100%,280px)}
.pgrid button{aspect-ratio:1;border:1.5px solid var(--line);background:var(--card);border-radius:3px;padding:0;cursor:pointer;max-width:100%}
.pgrid button.on{background:var(--ink);border-color:var(--ink)}
.numgrid{display:grid;grid-template-columns:repeat(8,1.6em);gap:2px;font-family:var(--f-mono);font-size:.95rem;text-align:center}
.numgrid span{color:var(--ink-soft)}
.numgrid span.one{color:var(--ink);font-weight:700;background:var(--hl-soft);border-radius:3px}
.numlbl{font-size:.82rem;color:var(--ink-soft);margin-bottom:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:.93rem;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.chip:disabled{cursor:default;opacity:.85}
.chip .dot{width:14px;height:14px;border-radius:50%;flex:none}
.sub{font-family:var(--f-display);font-size:1.1rem;font-weight:800;margin:10px 0 2px}

.sentence{font-size:1.3rem;font-family:var(--f-display);font-weight:600;margin:4px 0 14px}
.sentence .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--marker);text-align:center;color:var(--blue)}
.wordopts{display:flex;flex-wrap:wrap;gap:8px}
.wordopts button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:1.02rem}
.wordopts button:hover:not(:disabled){border-color:var(--blue)}
.wordopts button:disabled{cursor:default;opacity:.6}

.builder{display:grid;gap:10px}
.builder label{display:grid;grid-template-columns:7em 1fr;gap:10px;align-items:center}
.builder select{font-family:var(--f-body);width:100%;min-width:0}
@media (max-width:540px){.builder label{grid-template-columns:1fr}}
.promptbox{margin-top:14px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px}
.promptbox .lbl{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px}
.promptbox .part{border-radius:5px;padding:0 3px}

/* Ende & Lernstand-Check */
.center{text-align:center}
.end .bit{width:90px;margin:0 auto 10px}
.bigstars{display:flex;gap:8px;justify-content:center;margin:12px 0}
.bigstars .pix{width:42px;height:42px}
.bigstars .off .p1{fill:var(--line)}.bigstars .on .p1{fill:var(--marker)}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.qbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0 18px}
.qbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.score{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;margin:8px 0}
.score small{font-size:1.6rem;color:var(--ink-soft)}
.goals{text-align:left;margin-top:18px;display:flex;flex-direction:column}
.goal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1.5px solid var(--line)}
.goal .gl{min-width:0}
.goal .gl b{display:block;font-size:.98rem}
.goal .gl span{font-size:.82rem;color:var(--ink-soft)}
.st{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.s2{background:var(--good-soft);color:var(--good)}
.st.s1{background:var(--hl-soft);color:var(--ink)}
.st.s0{background:var(--bad-soft);color:var(--bad)}
.goal .btn{grid-column:1/-1;justify-self:start}
.proof{border:3px dashed var(--marker);border-radius:16px;padding:14px 18px;margin:16px auto 0;max-width:440px}
/* Erklärungen & Begründungen */
.lk{animation:lkin .35s ease-out}
@keyframes lkin{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.ex{background:var(--blue-soft);border-radius:10px;padding:9px 13px;margin-top:8px;font-size:.96rem}
.ex b.l{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.morebtn{margin-top:14px;background:var(--card);border:2px dashed var(--blue);color:var(--blue);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;width:100%}
.morebtn:hover{background:var(--blue-soft)}
.cardcount{font-size:.8rem;color:var(--ink-soft);text-align:right;margin-top:6px}
.why{flex-basis:100%;font-size:.92rem;line-height:1.45;padding-top:6px;border-top:1px dashed var(--line)}
.sort-item.no .why{color:var(--ink)}
.sort-item.no .why::before{content:"Warum? ";font-weight:700;color:var(--bad)}
.sort-item.ok .why::before{content:"Darum: ";font-weight:700;color:var(--good)}
.gap-row .why{font-family:var(--f-body);font-size:.9rem}
.gap-row .why::before{content:"Darum: ";font-weight:700;color:var(--good)}
.gap-row.no .why::before{content:"Tipp: ";color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap"><main id="app"></main></div>

<script>
/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pix(rows,cls=''){
  const w=rows[0].length,hh=rows.length;let r='';
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=='0')r+=`<rect x="${x}" y="${y}" width="1.03" height="1.03" class="p${c}"/>`;}));
  return `<svg viewBox="0 0 ${w} ${hh}" class="pix ${cls}" aria-hidden="true" shape-rendering="crispEdges">${r}</svg>`;
}
const BIT=["000020000","000010000","011111110","112111211","011111110","012222210","011111110","001000100"];
const STAR=["0001000","0011100","1111111","0111110","0011100","0110110","1100011"];
const TROPHY=["11111111","11111111","01111110","00111100","00011000","00011000","00111100","01111110"];
function bit(){return h('div',{class:'bit',html:pix(BIT,'bit')});}
function starRow(n,cls='stars'){const d=h('div',{class:cls});for(let i=0;i<3;i++)d.append(h('span',{class:i<n?'on':'off',html:pix(STAR)}));return d;}
function fb(kind,title,html){return h('div',{class:'fb '+kind},bit(),h('div',{},title?h('b',{class:'t'},title):null,h('div',{html:html||''})));}
function bars(list,opts={}){
  const max=Math.max(...list.map(x=>x.p));
  return h('div',{class:'bars'},list.map(x=>h('div',{class:'bar'+(x.p===max&&opts.markTop?' top':'')+(opts.mine===x.w?' mine':'')},
    h('span',{class:'lab'},x.w),h('div',{class:'track'},h('div',{class:'fill',style:`width:${x.p}%`})),h('span',{class:'pct'},x.p+' %'))));
}

/* ---------- Wesen für «Blips & Blops» ---------- */
function creature(shape,col,eyes){
  let body,ey;
  if(shape==='rund'){body=`<circle cx="32" cy="30" r="22" fill="var(--${col})"/>`;ey=28;}
  else if(shape==='dreieck'){body=`<polygon points="32,4 58,52 6,52" fill="var(--${col})"/>`;ey=38;}
  else {body=`<rect x="10" y="8" width="44" height="44" rx="3" fill="var(--${col})"/>`;ey=28;}
  const xs={1:[32],2:[25,39],3:[21,32,43]}[eyes];
  const e=xs.map(x=>`<circle cx="${x}" cy="${ey}" r="4.6" fill="var(--eye)"/><circle cx="${x}" cy="${ey+.8}" r="2.1" fill="var(--pupil)"/>`).join('');
  return `<svg viewBox="0 0 64 64" class="creature" aria-hidden="true"><line x1="24" y1="50" x2="21" y2="62" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="50" x2="43" y2="62" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>${body}${e}</svg>`;
}

}

{id:'k4',nr:4,title:'Wie KI ein Bild sieht',
 icon:["11111111","10000001","10000101","10010001","10111001","11111101","11111111","00000000"],
 steps:[
 {type:'hook',q:'Wie viele Pixel hat ein Foto von einer Handykamera ungefähr?',o:['etwa 100','etwa 10 000','viele Millionen'],a:2,
  reveal:'Viele Millionen – bei vielen Handys sind es 12 Millionen oder mehr! Was ist ein Pixel überhaupt? Und wie findet eine KI darin einen Hund?'},
 {type:'info',title:'Ein Bild ist eine Zahlentabelle',cards:[
  {h:'Pixel',html:'Zoomst du ganz nah in ein Foto hinein, siehst du kleine farbige Quadrate. Das sind <b>Pixel</b>, also Bildpunkte.'},
  {h:'Für den Computer: Zahlen',html:'Ein Computer sieht kein Bild. Für jeden Pixel speichert er <b>Zahlen</b>, zum Beispiel für Farbe und Helligkeit. Ein Foto ist für ihn eine riesige Tabelle voller Zahlen.'},
  {h:'Ein ganz einfaches Beispiel',html:'Hier hat jeder Pixel nur eine Zahl: <b>1 = ausgemalt, 0 = leer</b>. Links das Bild, rechts das, was der Computer speichert. Siehst du das Gesicht in den Zahlen?<div class="mini-ill" id="ill"></div>'}],
  after:(root)=>{const ill=root.querySelector('#ill');if(!ill)return;ill.innerHTML=pix(SMILE);ill.append(numTable(SMILE));}},
 {type:'pixel'},
 {type:'mc',q:'Jetzt umgekehrt: Ein Computer hat dieses Bild gespeichert. Was ist darauf? Suche die Einsen!',
  lead:()=>h('div',{style:'margin-bottom:14px'},numTable(HEART)),
  options:[
   ['ein Herz','Richtig! Oben zwei Bögen, unten eine Spitze. So sieht es ausgemalt aus:<div style="width:88px;margin-top:8px">'+pix(HEART)+'</div>'],
   ['ein Haus','Ein Haus hätte oben ein spitzes Dach und unten gerade Wände. Hier ist es umgekehrt: Die Spitze ist unten.'],
   ['ein Pfeil nach oben','Ein Pfeil nach oben hätte die Spitze oben. Schau, wo die Einsen ganz unten sind.'],
   ['eine Katze','Eine Katze hätte oben zwei spitze Ohren. Hier sind oben zwei runde Bögen.']],correct:0},
 {type:'info',title:'Wie findet eine KI darin ein Tier?',cards:[
  {h:'Schritt 1: Kanten',html:'Die KI sucht zuerst Stellen, an denen die Zahlen plötzlich wechseln, also von hell zu dunkel. Dort ist eine <b>Kante</b> oder eine Linie.'},
  {h:'Schritt 2: Formen',html:'Aus vielen Kanten setzt sie grössere <b>Formen</b> zusammen: einen Kreis, eine Spitze. Daraus wird vielleicht ein Auge oder ein Ohr.'},
  {h:'Schritt 3: Schätzen',html:'Am Schluss vergleicht sie mit ihren Beispielen und <b>schätzt</b>, was es sein könnte. Zusammen ergibt das immer 100 %. Sie wählt den <span class="hl">grössten Wert</span>.',
   ex:'<b class="l">So könnte es aussehen</b>87 % Hund · 9 % Katze · 4 % Fuchs → Die KI sagt «Hund».'},
  {h:'Warum nie ganz sicher?',html:'Sie vergleicht nur, wie gut das Bild zu ihren Beispielen passt. Ist das Foto dunkel oder unscharf oder sieht man nur einen Teil des Tieres, findet sie weniger Kanten und Formen. Dann wird sie unsicher.'}],
  wort:[['Wahrscheinlichkeit','Wie sicher sich die KI ist. Man gibt sie in Prozent (%) an. 100 % wäre ganz sicher.']],
  merke:'Für den Computer besteht ein Bild aus Pixeln und Zahlen. Eine Bild-KI gibt immer eine Wahrscheinlichkeit an, nie eine sichere Antwort.'},
 {type:'mc',q:'Eine Bild-KI meldet diese Werte. Was stimmt?',
  lead:()=>bars([{w:'Katze',p:62},{w:'Hund',p:30},{w:'Hase',p:8}],{markTop:true}),
  options:[
   ['Sie wählt «Katze», ist sich aber nicht ganz sicher.','Genau. 62 % ist der grösste Wert, also wählt sie «Katze». Bis 100 % fehlt aber viel, und «Hund» hat auch 30 %.'],
   ['Sie wählt «Katze» und ist sich ganz sicher.','Sie wählt zwar «Katze». Aber ganz sicher wäre sie nur bei 100 %. Bei 62 % bleibt viel Unsicherheit.'],
   ['Sie wählt «Hase», weil das der kleinste Wert ist.','Die KI wählt immer den grössten Wert, nicht den kleinsten.'],
   ['Sie wählt «Hund», weil Hunde häufiger sind.','Die KI wählt den grössten Wert in ihrer Schätzung. Der ist hier bei «Katze».']],correct:0},
 {type:'mc',q:'In welcher Situation erkennt eine Bild-KI ein Tier am ehesten falsch?',options:[
  ['Das Foto ist sehr dunkel, und man sieht nur den Schwanz.','Richtig. Im Dunkeln und mit nur einem Teil des Tieres findet die KI zu wenige Kanten und Formen.'],
  ['Das Tier steht hell beleuchtet mitten im Bild.','Hier findet die KI viele klare Kanten und Formen. Sie wird das Tier gut erkennen.'],
  ['Das Foto ist scharf, und das ganze Tier ist zu sehen.','Ein scharfes Foto vom ganzen Tier ist ideal für die KI.'],
  ['Die KI hat schon Tausende Fotos dieser Tierart gesehen.','Viele Beispiele helfen der KI. Dann erkennt sie das Tier eher richtig.']],correct:0}
]},
{id:'k5',nr:5,title:'Wort für Wort',
 icon:["01111110","11111111","11111111","10101011","11111111","01111110","00110000","00100000"],
 steps:[
 {type:'hook',q:'Ergänze den Märchenanfang: «Es war einmal ein …»',o:['König','Velo','Kühlschrank'],a:0,
  reveal:'Die meisten wählen «König». Warum? Weil du viele Märchen kennst, die so anfangen. Eine Sprach-KI rechnet genau so – nur mit viel mehr Text.'},
 {type:'info',title:'Das Wort-für-Wort-Spiel',cards:[
  {h:'Wort für Wort',html:'Chatbots sind <b>Sprach-KIs</b>. Sie rechnen aus, welches Wort als Nächstes am besten passt. Dann hängen sie es an und rechnen wieder. Wort für Wort, bis die Antwort fertig ist.'},
  {h:'Kennst du schon',html:'Dein Handy macht etwas Ähnliches, wenn es dir beim Tippen Wörter vorschlägt:<div class="phone"><div class="typed">Ich gehe heute ins |</div><div class="sugg"><span>Kino</span><span>Bett</span><span>Training</span></div></div>'},
  {h:'Woher weiss sie, was passt?',html:'Aus ihren Trainingsdaten. Nach «Am Morgen putze ich mir die» kam in Millionen Texten fast immer «Zähne». Darum rechnet sie: «Zähne» ist <span class="hl">am wahrscheinlichsten</span>.'}]},
 {type:'nextword'},
 {type:'info',title:'Klingt gut – stimmt aber?',cards:[
  {h:'Flüssig',html:'Weil die KI immer passende Wörter aneinanderreiht, klingen ihre Antworten flüssig und wie von einem Menschen geschrieben.'},
  {h:'Kein Lexikon im Kopf',html:'Aber die KI hat kein Lexikon, in dem sie nachschauen kann. Sie weiss nur, welche Wörter oft zusammen vorkommen. <span class="hl">Ob der Satz wahr ist, prüft sie nicht.</span>',
   ex:'<b class="l">Beispiel</b>«Der Mond ist aus Käse» ist ein Satz, der in Kinderbüchern vorkommt. Die KI weiss nicht, dass er nicht stimmt – sie kennt nur die Wörter.'},
  {h:'Nie ganz gleich',html:'Die KI nimmt nicht immer das allerwahrscheinlichste Wort. Darum kommt bei derselben Frage nicht jedes Mal genau dieselbe Antwort.'}],
  merke:'Eine Sprach-KI schreibt Wort für Wort das wahrscheinlichste nächste Wort. Sie klingt sicher, auch wenn sie sich irrt.'},
 {type:'mc',q:'Warum klingt eine Sprach-KI auch dann sicher, wenn ihre Antwort falsch ist?',options:[
  ['Sie reiht passende Wörter aneinander, prüft aber nicht, ob es stimmt.','Genau. Flüssig heisst nicht richtig. Die KI rechnet, welche Wörter passen, nicht, was wahr ist.'],
  ['Sie hat vorher im Internet nachgeschaut.','Eine Sprach-KI schaut nicht nach. Sie rechnet nur mit dem, was sie im Training gelernt hat.'],
  ['Sie weiss alles und ist darum immer sicher.','Eine KI weiss nicht alles. Sie klingt nur immer gleich sicher – egal, ob es stimmt.'],
  ['Ein Mensch kontrolliert jede Antwort vorher.','Niemand liest die Antworten, bevor du sie siehst. Darum musst du sie selber prüfen.']],correct:0},
 {type:'sort',q:'Stimmt das oder stimmt das nicht?',cats:['stimmt','stimmt nicht'],items:[
  {t:'Eine Sprach-KI schreibt Wort für Wort.',c:0,why:'Sie rechnet immer das nächste Wort aus und hängt es an.'},
  {t:'Eine Sprach-KI hat ein Lexikon im Kopf.',c:1,why:'Sie hat kein Lexikon. Sie weiss nur, welche Wörter oft zusammen vorkommen.'},
  {t:'Bei derselben Frage kommt nicht immer genau dieselbe Antwort.',c:0,why:'Sie nimmt nicht immer das allerwahrscheinlichste Wort. Darum ändert sich die Antwort ein bisschen.'},
  {t:'Die Wortvorschläge auf dem Handy funktionieren ähnlich.',c:0,why:'Auch das Handy rechnet aus, welches Wort am wahrscheinlichsten folgt.'},
  {t:'Wenn eine Antwort flüssig klingt, stimmt sie auch.',c:1,why:'Flüssig klingt sie immer. Ob sie stimmt, sagt der Klang nicht.'}]}
]},
{id:'k6',nr:6,title:'Wenn KI Unsinn erzählt',
 icon:["00111100","01100110","00000110","00001100","00011000","00011000","00000000","00011000"],
 steps:[
 {type:'hook',q:'Ein Chatbot empfiehlt dir drei Bücher über «Pinguine in der Wüste» – mit Titel und Autorin. Gibt es diese Bücher?',o:['Ja, sonst würde er sie nicht nennen','Wahrscheinlich nicht','Nur in der Bibliothek'],a:1,
  reveal:'Wahrscheinlich nicht! Chatbots erfinden manchmal Bücher, die es gar nicht gibt. Wie kann das passieren?'},
 {type:'info',title:'Halluzinationen',cards:[
  {h:'Erfunden, aber überzeugend',html:'Manchmal erfindet eine KI etwas. Es klingt richtig, ist aber falsch: erfundene Bücher, Zahlen, Personen oder Tiere. Das nennt man eine <b>Halluzination</b>.'},
  {h:'Grund 1: Sie prüft nicht',html:'Du weisst schon aus Kapitel 5: Die KI rechnet nur aus, welche Wörter passen. Fragst du nach Büchern, schreibt sie Wörter, die nach Buchtiteln klingen – <span class="hl">ob es das Buch gibt, prüft sie nicht</span>.'},
  {h:'Grund 2: Fehler in den Daten',html:'In ihren Trainingsdaten standen auch Fehler. Die hat sie mitgelernt.'},
  {h:'Grund 3: Altes Wissen',html:'Ihr Training wurde irgendwann abgeschlossen. Was danach passiert ist, kennt sie nicht.'},
  {h:'Das Gemeine daran',html:'Die KI schreibt Fehler im <b>gleichen sicheren Ton</b> wie richtige Antworten. Am Tonfall merkst du nichts.'}],
  wort:[['Halluzination','Eine erfundene Antwort, die richtig klingt, aber falsch ist.']]},
 {type:'mc',q:'Diese Antwort klingt sehr überzeugend. Was ist hier los?',
  lead:()=>h('div',{class:'chat'},h('div',{class:'bubble me'},h('small',{},'Frage'),'Was frisst der Blauschwanzmarder?'),
   h('div',{class:'bubble ai'},h('small',{},'Chatbot'),'Der Blauschwanzmarder frisst vor allem Beeren, Insekten und kleine Fische. Er lebt in den Bergwäldern der Alpen und zieht seine Jungen in hohlen Baumstämmen auf.')),
  options:[
   ['Die KI hat alles erfunden – dieses Tier gibt es gar nicht.','Richtig, das ist eine Halluzination. Die KI hat Wörter aneinandergereiht, die gut zu einem Tier passen. Am sicheren Ton merkst du es nicht.'],
   ['Alles stimmt, denn die Antwort ist sehr genau.','Genau klingen heisst nicht wahr sein. Einen Blauschwanzmarder gibt es nicht – die KI hat ihn erfunden.'],
   ['Der Text stimmt, man sieht das Tier nur selten.','Das Tier gibt es gar nicht. Die KI hat passende Wörter aneinandergereiht.'],
   ['Nur die Beeren sind falsch, der Rest stimmt.','Nicht nur die Beeren: Das ganze Tier ist erfunden.']],correct:0},
 {type:'mc',q:'Warum erfindet eine KI manchmal etwas? Welcher Grund ist FALSCH?',options:[
  ['Sie will dich absichtlich anlügen.','Richtig, dieser Grund ist falsch. Eine KI hat keinen Willen und keine Absicht. Sie lügt nicht – sie rechnet nur.'],
  ['Sie prüft nicht, ob etwas wahr ist.','Dieser Grund stimmt (Grund 1). Gesucht ist der falsche Grund.'],
  ['In ihren Trainingsdaten standen auch Fehler.','Dieser Grund stimmt (Grund 2). Gesucht ist der falsche Grund.'],
  ['Ihr Wissen ist nicht immer aktuell.','Dieser Grund stimmt (Grund 3). Gesucht ist der falsche Grund.']],correct:0},
 {type:'info',title:'Werde KI-Detektiv',cards:[
  {h:'Was meistens stimmt',html:'Ganz bekannte Tatsachen, die überall gleich stehen. Zum Beispiel: Eine Woche hat sieben Tage. Solche Sätze kamen in den Trainingsdaten tausendfach richtig vor.'},
  {h:'Was du prüfen musst',html:'<b>Zahlen</b> (Höhen, Jahreszahlen, Preise), <b>seltene Dinge</b> und alles über <b>dich oder deinen Ort</b>. Darüber stand in den Trainingsdaten wenig oder gar nichts.'},
  {h:'So prüfst du',html:'Mit einer <span class="hl">zweiten Quelle</span>: in einem Buch, auf einer verlässlichen Website oder bei einer Person, die sich auskennt. Die KI nochmals zu fragen, hilft nicht – sie kann sich nicht selber prüfen.'}],
  merke:'Eine KI kann überzeugend klingen und trotzdem falsch liegen. Wichtige Angaben prüfe ich immer mit einer zweiten Quelle.'},
 {type:'sort',q:'Eine KI hat diese Sätze geschrieben. Kannst du ihnen vertrauen?',cats:['vertrauenswürdig','unbedingt prüfen'],items:[
  {t:'«Bern ist die Hauptstadt der Schweiz.»',c:0,why:'Eine ganz bekannte Tatsache, die überall gleich steht.'},
  {t:'«Der Mount Everest ist 7842 Meter hoch.»',c:1,why:'Eine Zahl – also prüfen! Und tatsächlich: Er ist rund 8849 Meter hoch.'},
  {t:'«In deinem Schulhaus gibt es 14 Klassenzimmer.»',c:1,why:'Etwas über deinen Ort. Dein Schulhaus kennt die KI gar nicht.'},
  {t:'«Wasser gefriert bei 0 Grad Celsius.»',c:0,why:'Eine bekannte Tatsache, die in jedem Schulbuch steht.'},
  {t:'«Der Blauschwanzmarder lebt in den Alpen.»',c:1,why:'Ein seltenes Ding – und tatsächlich erfunden. Dieses Tier gibt es nicht.'}]},
 {type:'sort',q:'Detektiv-Auftrag: Prüfe jeden Satz des Chatbots mit dem Lexikon. Was stimmt, was ist erfunden?',
  lead:()=>h('div',{},
   h('div',{class:'chat'},h('div',{class:'bubble me'},h('small',{},'Frage'),'Erzähl mir etwas über das Matterhorn.'),
    h('div',{class:'bubble ai'},h('small',{},'Chatbot'),'Das Matterhorn ist 4478 Meter hoch. Es steht an der Grenze zwischen der Schweiz und Österreich. Zum ersten Mal bestiegen wurde es im Jahr 1865. Oben auf dem Gipfel gibt es ein kleines Restaurant.')),
   h('div',{class:'lex'},h('div',{class:'kick'},'Zweite Quelle: Lexikon'),
    h('p',{},h('b',{},'Matterhorn: '),'Berg in den Walliser Alpen, an der Grenze zwischen der Schweiz und Italien. Höhe: 4478 m. Erste Besteigung: 1865. Der Gipfel ist ein schmaler Grat aus Fels, Schnee und Eis. Nur geübte Bergsteigerinnen und Bergsteiger erreichen ihn.'))),
  cats:['stimmt','erfunden'],items:[
  {t:'Das Matterhorn ist 4478 Meter hoch.',c:0,why:'Im Lexikon steht auch 4478 m.'},
  {t:'Es steht an der Grenze zur Schweiz und Österreich.',c:1,why:'Laut Lexikon liegt es an der Grenze zu Italien, nicht zu Österreich.'},
  {t:'Es wurde 1865 zum ersten Mal bestiegen.',c:0,why:'Im Lexikon steht auch 1865.'},
  {t:'Auf dem Gipfel gibt es ein kleines Restaurant.',c:1,why:'Laut Lexikon ist der Gipfel ein schmaler Grat aus Fels, Schnee und Eis. Ein Restaurant hat dort keinen Platz.'}]},
 {type:'mc',q:'Du brauchst für einen Vortrag eine wichtige Zahl von der KI. Was machst du?',options:[
  ['Ich prüfe sie in einem Buch oder auf einer verlässlichen Website.','Genau. Eine zweite Quelle ist der beste Schutz gegen Halluzinationen.'],
  ['Ich frage die KI, ob sie ganz sicher ist.','Die KI kann sich nicht selber prüfen. Sie antwortet wieder im gleichen sicheren Ton.'],
  ['Ich schaue, ob die Antwort sicher klingt.','Die KI klingt immer sicher – auch bei Fehlern. Am Tonfall merkst du nichts.'],
  ['Ich frage die KI dieselbe Frage nochmals.','Die gleiche Quelle zweimal zu fragen, ist keine zweite Quelle. Du brauchst ein Buch, eine Website oder eine Fachperson.']],correct:0}
]},
{id:'k7',nr:7,title:'Gute Prompts',
 icon:["00000000","01000000","00100000","00010000","00100000","01000000","00001111","00000000"],
 steps:[
 {type:'hook',q:'Bit sagt beim Beck: «Ich will etwas.» Was bekommt er?',o:['Genau sein Lieblingsgipfeli','Irgendetwas','Einen Kuchen mit seinem Namen'],a:1,
  reveal:'Irgendetwas – vielleicht ein Brot, das er gar nicht mag. Wer unklar fragt, bekommt eine unklare Antwort. Bei einer KI ist es genauso.'},
 {type:'info',title:'Die vier Bausteine',cards:[
  {h:'Was ist ein Prompt?',html:'Ein <b>Prompt</b> ist der Auftrag, den du einer KI gibst.'},
  {h:'Die KI kann nicht Gedanken lesen',html:'Alles, was du nicht sagst, muss die KI <b>raten</b>: Für wen ist die Antwort? Wie lang? Wie schwierig? Bei «Schreib etwas über Rom» weiss sie nicht einmal, ob du die Stadt von heute oder die alten Römer meinst.'},
  {h:'Vier Bausteine',html:`Ein guter Prompt beantwortet vier Fragen:<div class="tbl"><table><thead><tr><th>Baustein</th><th>Frage dazu</th><th>Beispiel</th></tr></thead><tbody>
   <tr><td><span class="bb b1">Rolle</span></td><td>Wer soll antworten?</td><td>Du bist eine Lehrerin für die 5. Klasse.</td></tr>
   <tr><td><span class="bb b2">Auftrag</span></td><td>Was genau soll die KI tun?</td><td>Erkläre mir, wie ein Vulkan entsteht.</td></tr>
   <tr><td><span class="bb b3">Details</span></td><td>Was muss sie über dich wissen?</td><td>Ich bin 11 Jahre alt, bitte einfache Sprache.</td></tr>
   <tr><td><span class="bb b4">Form</span></td><td>Wie soll die Antwort aussehen?</td><td>In fünf kurzen Sätzen.</td></tr></tbody></table></div>`},
  {h:'Woran du sie erkennst',html:'<span class="bb b1">Rolle</span> beginnt oft mit «Du bist …». <span class="bb b2">Auftrag</span> ist ein Befehl wie «Erkläre …», «Beschreibe …». <span class="bb b3">Details</span> erzählen etwas über dich: «Ich bin …», «Ich brauche …». <span class="bb b4">Form</span> sagt, wie lang oder in welcher Art: Liste, Sätze, Tabelle.'}],
  merke:'Rolle, Auftrag, Details, Form – wer alle vier Bausteine nennt, bekommt eine bessere Antwort.'},
 {type:'sort',q:'Welcher Baustein ist das? Ordne jeden Satz zu.',cats:['Rolle','Auftrag','Details','Form'],items:[
  {t:'«Du bist ein Sachbuchautor für Kinder.»',c:0,why:'«Du bist …» sagt, wer antworten soll.'},
  {t:'«Erkläre mir den Wasserkreislauf.»',c:1,why:'«Erkläre …» ist der Befehl: Das soll die KI tun.'},
  {t:'«Ich bin in der 5. Klasse und brauche es für einen Vortrag.»',c:2,why:'«Ich bin … ich brauche …» erzählt der KI etwas über dich.'},
  {t:'«Schreibe fünf kurze Abschnitte mit je einem Titel.»',c:3,why:'Das sagt, wie die Antwort aussehen soll.'},
  {t:'«Du bist eine Sportreporterin.»',c:0,why:'«Du bist …» sagt, wer antworten soll.'},
  {t:'«Beschreibe die Regeln von Unihockey.»',c:1,why:'«Beschreibe …» ist der Befehl: Das soll die KI tun.'},
  {t:'«Ich kenne das Spiel noch gar nicht.»',c:2,why:'Das erzählt der KI etwas über dich. So weiss sie, dass sie bei null anfangen muss.'},
  {t:'«Als Liste mit höchstens sechs Punkten.»',c:3,why:'Liste und Länge – das ist die Form der Antwort.'}]},
 {type:'mc',q:'Welcher Prompt bringt die beste Antwort?',options:[
  ['«Du bist eine Geschichtslehrerin. Erkläre mir, wie die Römer gelebt haben. Ich bin 11 Jahre alt. Schreibe fünf kurze Sätze.»','Genau. Nur dieser Prompt hat alle vier Bausteine: Rolle, Auftrag, Details und Form.'],
  ['«Erzähl mir alles über die Römer, über ihre Strassen, Städte, Kaiser, Soldaten, Spiele und Götter.»','Lang heisst nicht gut. Hier fehlen Rolle, Details und Form – und «alles» ist viel zu viel.'],
  ['«Du bist eine Geschichtslehrerin. Ich bin 11 Jahre alt. Schreibe fünf kurze Sätze.»','Hier fehlt das Wichtigste: der Auftrag. Die KI weiss gar nicht, worüber sie schreiben soll.'],
  ['«Schreib etwas über Rom.»','Hier muss die KI fast alles raten: die heutige Stadt oder die alten Römer? Für wen? Wie lang?']],correct:0},
 {type:'builder'},
 {type:'info',title:'Nachfragen',cards:[
  {h:'Die erste Antwort ist selten die beste',html:'Profis geben sich nicht mit der ersten Antwort zufrieden. Sie lesen sie und sagen dann <b>genau</b>, was fehlt oder stört.'},
  {h:'Gute Nachfragen',html:'Eine gute Nachfrage sagt genau, was anders werden soll:',
   ex:'<b class="l">Beispiele</b>Zu lang? «Fasse es in drei Sätzen zusammen.»<br>Zu schwierig? «Nimm einfachere Wörter, ich bin 11.»<br>Zu allgemein? «Gib mir zwei Beispiele aus der Schweiz.»'},
  {h:'Schlechte Nachfragen',html:'«Nochmals!» oder «Das ist nicht gut» helfen kaum. Die KI weiss dann immer noch nicht, <span class="hl">was</span> sie ändern soll.'}],
  merke:'Ein Prompt ist ein Gespräch, kein einzelner Knopfdruck. Gezieltes Nachfragen macht die Antwort besser.'},
 {type:'mc',q:'Die Antwort der KI ist viel zu lang. Was fragst du nach?',options:[
  ['«Fasse das bitte in drei Sätzen zusammen.»','Genau. Die Nachfrage sagt klar, was anders werden soll: kürzer, drei Sätze.'],
  ['«Nochmals, bitte.»','Die KI weiss nicht, was sie ändern soll. Vielleicht wird die Antwort sogar wieder gleich lang.'],
  ['«Das ist leider nicht gut.»','Die KI erfährt nicht, was schlecht war. Sag genau, was anders werden soll.'],
  ['«Erkläre es noch genauer.»','Genauer heisst meistens: noch länger. Du wolltest aber eine kürzere Antwort.']],correct:0}
]},
{id:'k8',nr:8,title:'Sicher und fair',
 icon:["00111100","01000010","01000010","11111111","11100111","11100111","11111111","00000000"],
 steps:[
 {type:'hook',q:'Eine App verspricht: «Lade ein Foto deiner Freundin hoch, und wir machen sie zur Superheldin!» Machst du mit?',o:['Klar, das ist lustig','Nein','Nur wenn das Bild schön wird'],a:1,
  reveal:'Nein! Das Foto landet auf fremden Computern, und deine Freundin hat nicht zugestimmt. Was du einer KI anvertrauen darfst, lernst du jetzt.'},
 {type:'info',title:'Deine Daten gehören dir',cards:[
  {h:'Wohin geht dein Prompt?',html:'Alles, was du in ein KI-Fenster tippst, verlässt dein Gerät. Es wird über das Internet zu den Computern einer Firma geschickt.'},
  {h:'Was passiert dort?',html:'Manche Firmen speichern die Eingaben und trainieren damit ihre KI weiter. <span class="hl">Was einmal dort ist, bekommst du nicht mehr zurück.</span>'},
  {h:'Das gehört nie in einen Prompt',html:'Dein voller Name, deine Adresse, Telefonnummern, Passwörter, Fotos von dir oder anderen, Geheimnisse von Freundinnen und Freunden.',

 {ch:4,t:'Wie eine Bild-KI arbeitet',qs:[

 {ch:5,t:'Das Wort-für-Wort-Prinzip',qs:[
  {q:'Wie schreibt eine Sprach-KI eine Antwort?',o:[

  {q:'Du stellst einer Sprach-KI zweimal genau dieselbe Frage. Was passiert?',o:[

  {q:'Was hat eine Sprach-KI NICHT?',o:[

 {ch:6,t:'Halluzinationen erkennen und prüfen',qs:[

   ['Ich glaube es, weil der Chatbot sicher klingt.','Ein Chatbot klingt immer sicher, auch bei Fehlern.'],
   ['Ich frage den Chatbot, ob er ganz sicher ist.','Der Chatbot kann sich nicht selber prüfen. Du brauchst eine zweite Quelle.'],
   ['Ich glaube es, weil Zürich eine grosse Stadt ist.','Dass Zürich gross ist, beweist nicht, dass das Konzert stattfand.']]},
  {q:'Welche Antwort einer KI musst du am ehesten prüfen?',o:[

  {q:'Warum ist das Wissen einer KI manchmal veraltet?',o:[

   ['Weil sie zu wenig liest.','Sie hat riesig viel gelesen – aber nur bis zum Ende ihres Trainings.'],
   ['Weil sie auf alten Computern läuft.','Mit den Computern hat das nichts zu tun. Ihr Training wurde irgendwann abgeschlossen.'],
   ['Weil sie nur alte Bücher mag.','Eine KI mag nichts. Ihr Training endete einfach zu einem bestimmten Zeitpunkt.']]},
  {q:'Woran erkennst du eine Halluzination?',o:[
   ['Nicht am Tonfall – nur durch Nachprüfen.','Die KI schreibt Fehler im gleichen sicheren Ton wie richtige Antworten.'],
   ['Die KI schreibt dann sehr unsicher.','Leider nicht. Sie klingt bei Fehlern genauso sicher.'],
   ['Die falsche Stelle ist rot markiert.','Nichts wird markiert. Die KI weiss ja selber nicht, dass es falsch ist.'],

 {ch:7,t:'Einen guten Prompt schreiben',qs:[
  {q:'«Erkläre mir, wie Bienen Honig machen.» Welcher Baustein ist das?',o:[

   ['Rolle','Eine Rolle beginnt meist mit «Du bist …». Hier steht ein Befehl.'],
   ['Details','Details erzählen etwas über dich. Hier steht ein Befehl.'],
   ['Form','Die Form sagt, wie die Antwort aussehen soll. Hier steht, was die KI tun soll.']]},
  {q:'«Antworte in einer Tabelle mit zwei Spalten.» Welcher Baustein ist das?',o:[

  {q:'Welcher Prompt ist am besten?',o:[

   ['«Erzähl mir alles über Bienen, über Honig, Blumen, Waben, Königinnen und Imker.»','Lang heisst nicht gut. Es fehlen Rolle, Details und Form.'],
   ['«Du bist ein Imker. Ich bin in der 6. Klasse. Antworte in fünf Sätzen.»','Hier fehlt der Auftrag. Die KI weiss nicht, was sie erklären soll.'],
   ['«Bienen»','Ein einzelnes Wort – die KI muss alles raten.']]},
  {q:'Die KI benutzt viele Wörter, die du nicht verstehst. Was schreibst du?',o:[
   ['«Erkläre es bitte mit einfacheren Wörtern, ich bin 12.»','Die Nachfrage sagt genau, was anders werden soll.'],
   ['«Das ist falsch.»','Die Antwort ist nicht falsch, nur zu schwierig. Und die KI erfährt nicht, was sie ändern soll.'],
   ['«Nochmals, bitte.»','Die KI weiss nicht, was sie ändern soll. Die Wörter bleiben vielleicht gleich schwierig.'],
   ['«Schreib bitte mehr Fachwörter.»','Dann wird es noch schwieriger. Du brauchst einfachere Wörter.']]}]},

/* ---------- Kapitel-Ablauf ---------- */
let S=null;
function startChapter(c){S={c,i:0,done:{},first:{}};renderStep();}
function renderStep(){
  const app=$('#app');app.replaceChildren();
  const c=S.c,i=S.i,s=c.steps[i],last=i===c.steps.length-1;
  const dots=h('div',{class:'dots','aria-label':`Schritt ${i+1} von ${c.steps.length}`});
  c.steps.forEach((_,k)=>dots.append(h('span',{class:k<i?'past':k===i?'now':''})));
  app.append(h('div',{class:'ch-head'},
    h('button',{class:'back',onclick:()=>go('start')},'← Übersicht'),
    h('div',{class:'kick'},`Kapitel ${c.nr} · Schritt ${i+1} von ${c.steps.length}`),
    h('h2',{},c.title),dots));
  const next=h('button',{class:'btn',disabled:!S.done[i],onclick:()=>{if(last)finishChapter();else{S.i++;renderStep();scrollTo(0,0);}}},last?'Kapitel abschliessen ✓':'Weiter →');
  const api={
    seen:!!S.done[i],
    complete(){S.done[i]=true;next.disabled=false;},
    hit(){if(S.first[i]===undefined)S.first[i]=true;},
    miss(){if(S.first[i]===undefined)S.first[i]=false;}
  };
  app.append(h('section',{class:'panel'},R[s.type](s,api)));
  app.append(h('div',{class:'nav'},
    i>0?h('button',{class:'btn ghost',onclick:()=>{S.i--;renderStep();scrollTo(0,0);}},'← Zurück'):h('span'),next));
}
const SCORED=['mc','sort','gap'];
function finishChapter(){
  const c=S.c;const idx=c.steps.map((s,k)=>SCORED.includes(s.type)?k:-1).filter(k=>k>=0);
  const right=idx.filter(k=>S.first[k]===true).length;
  const ratio=idx.length?right/idx.length:1;
  const stars=ratio===1?3:ratio>=.5?2:1;
  const prev=P.ch[c.id];
  P.ch[c.id]={done:true,stars:Math.max(stars,prev&&prev.stars||0)};save();
  const app=$('#app');app.replaceChildren();
  const nxt=CH[CH.indexOf(c)+1];
  app.append(h('section',{class:'panel center end'},bit(),
    h('div',{class:'kick'},`Kapitel ${c.nr}`),h('h2',{},'Kapitel geschafft!'),
    starRow(stars,'bigstars'),
    h('p',{},`Beim ersten Versuch richtig: ${right} von ${idx.length} Aufgaben.`),
    h('p',{class:'hint'},stars===3?'Perfekt! Du hast alles beim ersten Mal gelöst.':'Du kannst das Kapitel jederzeit wiederholen und mehr Sterne holen.'),
    h('div',{class:'btnrow'},
      h('button',{class:'btn ghost',onclick:()=>go('start')},'Zur Übersicht'),
      nxt?h('button',{class:'btn',onclick:()=>go(nxt.id)},`Kapitel ${nxt.nr}: ${nxt.title} →`)
         :h('button',{class:'btn',onclick:()=>go('quiz')},'Zum Lernstand-Check →'))));
  scrollTo(0,0);
}

R.info=(s,api)=>{
  const d=h('div',{},h('h3',{},s.title));
  const wrap=h('div',{class:'cards'});d.append(wrap);
  const tail=h('div',{});
  const counter=h('div',{class:'cardcount'});
  const more=h('button',{class:'morebtn'},'Weiter erklären ▾');
  let shown=0;

    const el=h('div',{class:'lk'},c.h?h('h4',{},c.h):null,h('div',{html:c.html}),c.ex?h('div',{class:'ex',html:c.ex}):null);
    wrap.append(el);

    more.remove();counter.remove();

      h('dl',{},s.wort.map(([w,e])=>h('div',{},h('dt',{},w+': '),h('dd',{},e))))));
    if(s.merke)tail.append(h('div',{class:'merke'},h('span',{class:'tag'},'Merke'),h('div',{},s.merke)));
    api.complete();
  };
  const step=()=>{
    addCard(s.cards[shown]);shown++;

R.sort=(s,api)=>{
  const d=h('div',{});
  d.append(h('p',{class:'q'},s.q));
  if(s.lead)d.append(s.lead());
  const list=h('div',{class:'sort-list'}),out=h('div',{});
  const pick=new Array(s.items.length).fill(null);const locked=new Array(s.items.length).fill(false);
  const rows=[];
  const check=h('button',{class:'btn',disabled:true},'Überprüfen');
  const upd=()=>{check.disabled=pick.some((p,k)=>p===null&&!locked[k]);};
  shuffle(s.items.map((it,k)=>({it,k}))).forEach(({it,k})=>{
    const seg=h('div',{class:'seg',role:'group'});
    const why=h('div',{class:'why',hidden:true},it.why||'');
    const row=h('div',{class:'sort-item'},
      it.html?h('div',{class:'txt',html:it.html,'aria-label':it.label||''}):h('div',{class:'txt'},it.t),seg,why);
    s.cats.forEach((cat,ci)=>seg.append(h('button',{'aria-pressed':'false',onclick:(ev)=>{
      if(locked[k])return;pick[k]=ci;row.classList.remove('no');
      seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
      ev.currentTarget.setAttribute('aria-pressed','true');upd();
    }},cat)));
    rows[k]={row,seg,why};list.append(row);
  });
  check.addEventListener('click',()=>{
    let ok=0;
    s.items.forEach((it,k)=>{
      const r=rows[k];
      if(pick[k]===it.c){ok++;locked[k]=true;r.row.classList.add('ok');r.row.classList.remove('no');r.seg.querySelectorAll('button').forEach(b=>b.disabled=true);}
      else{r.row.classList.add('no');pick[k]=null;r.seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));}
      r.why.hidden=!it.why;
    });
    upd();
    if(ok===s.items.length){api.hit();api.complete();check.hidden=true;out.replaceChildren(fb('good',praise()+' Alles richtig.','Unter jedem Beispiel steht, warum es so ist. Lies die Begründungen nochmals durch.'));}
    else{api.miss();out.replaceChildren(fb('bad',`${ok} von ${s.items.length} richtig.`,'Bei den rot markierten steht, warum deine Antwort nicht passt. Lies es und wähle neu.'));}
  });
  d.append(list,h('div',{class:'check-row'},check),out);return d;
};
R.gap=(s,api)=>{
  const d=h('div',{},h('p',{class:'q'},s.q));const sels=[];const out=h('div',{});
  const check=h('button',{class:'btn',disabled:true},'Überprüfen');
  const upd=()=>{check.disabled=sels.some(x=>!x.el.value);};
  const rowEls=[];
  s.rows.forEach((r,ri)=>{
    const row=h('div',{class:'gap-row'});const mine=[];
    r.parts.forEach((p,pi)=>{
      if(typeof p==='string')row.append(h('span',{},p));
      else if(p.lbl)row.append(h('span',{class:'lbl'},p.lbl));
      else{const el=h('select',{id:`gap-${ri}-${pi}`,'aria-label':'Lücke',onchange:()=>{el.classList.remove('no');upd();}},
        h('option',{value:''},'?'),p.o.map(o=>h('option',{value:o},o)));
        const x={el,a:p.a};sels.push(x);mine.push(x);row.append(el);}
    });
    const why=h('div',{class:'why',hidden:true},r.why);row.append(why);
    rowEls.push({row,why,mine});d.append(row);
  });
  check.addEventListener('click',()=>{
    let ok=0;sels.forEach(x=>{if(x.el.value===x.a){ok++;x.el.classList.add('ok');x.el.disabled=true;}else x.el.classList.add('no');});
    rowEls.forEach(r=>{r.why.hidden=false;r.row.classList.toggle('no',r.mine.some(x=>x.el.value!==x.a));});
    if(ok===sels.length){api.hit();api.complete();check.hidden=true;out.replaceChildren(fb('good',praise(),'Du hast die Regeln aus Beispielen gefunden, ohne dass sie dir jemand verraten hat. Genau das macht eine KI.'));}
    else{api.miss();out.replaceChildren(fb('bad',`${ok} von ${sels.length} richtig.`,'Lies den Tipp bei der Reihe und ändere die rot markierten Felder.'));}
  });
  d.append(h('div',{class:'check-row'},check),out);return d;
};

    {n:'Auftrag',cls:'b2',o:['Erkläre mir, wie ein Vulkan ausbricht.','Erkläre mir, was Lava ist.','Beschreibe, wie ein Vulkan entsteht.']},
    {n:'Details',cls:'b3',o:['Ich bin 11 Jahre alt, bitte einfache Sprache.','Ich brauche es für einen Vortrag in der Klasse.','Ich weiss noch fast nichts über Vulkane.']},
    {n:'Form',cls:'b4',o:['Schreibe fünf kurze Sätze.','Als Liste mit drei Punkten.','Mit drei Fachbegriffen am Schluss.']}];
  const val=['','','',''];const preview=h('div',{});const out=h('div',{});let done=false;
  const upd=()=>{
    const filled=val.map((v,k)=>v?h('span',{class:'part bb '+parts[k].cls},v):null).filter(Boolean);
    preview.replaceChildren(...(filled.length?filled.flatMap((x,k)=>k?[' ',x]:[x]):[h('span',{class:'hint'},'Wähle oben deine Bausteine aus.')]));
    const miss=parts.filter((p,k)=>!val[k]).map(p=>p.n);
    if(!miss.length&&!done){done=true;api.complete();out.replaceChildren(fb('good','Alle vier Bausteine sind drin!','Mit diesem Prompt muss die KI nicht raten. Probiere auch andere Kombinationen aus.'));}
    else if(miss.length&&!done) out.replaceChildren(h('p',{class:'hint'},'Es fehlt noch: '+miss.join(', ')));
  };
  const form=h('div',{class:'builder'});
  parts.forEach((p,k)=>{const sel=h('select',{id:'bau-'+k,onchange:()=>{val[k]=sel.value;upd();}},h('option',{value:''},'– wählen –'),p.o.map(o=>h('option',{value:o},o)));
    form.append(h('label',{for:'bau-'+k},h('span',{class:'bb '+p.cls},p.n),sel));});
  upd();
  return h('div',{},h('h3',{},'Bau deinen eigenen Prompt'),
    h('p',{class:'q'},'Du willst etwas über Vulkane wissen. Wähle für jeden Baustein einen Satz aus.'),
    form,h('div',{class:'promptbox'},h('div',{class:'lbl'},'Dein Prompt'),preview),out);
};

/* ---------- Lernstand-Check ---------- */
let Q=null;
function startQuiz(){
  const items=[];
  GOALS.forEach((g,gi)=>shuffle(g.qs).slice(0,2).forEach(q=>items.push({...q,gi,order:shuffle(q.o.map((o,k)=>({t:o[0],why:o[1],k})))})));
  Q={i:0,score:0,per:GOALS.map(()=>0),items};renderQ();
}
function quizHead(){return h('div',{class:'ch-head'},h('button',{class:'back',onclick:()=>go('start')},'← Übersicht'),h('h2',{},'Lernstand-Check'));}
function renderQ(){
  const app=$('#app');app.replaceChildren();
  const q=Q.items[Q.i];
  app.append(quizHead());
  const box=h('div',{class:'opts'}),out=h('div',{});
  const nextB=h('button',{class:'btn',hidden:true,onclick:()=>{Q.i++;if(Q.i<Q.items.length)renderQ();else renderQuizEnd();scrollTo(0,0);}},Q.i<Q.items.length-1?'Nächste Frage →':'Ergebnis anzeigen →');
  q.order.forEach(o=>{
    const b=h('button',{class:'opt',onclick:()=>{
      box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      if(o.k===0){Q.score++;Q.per[q.gi]++;b.classList.add('ok');out.replaceChildren(fb('good',praise(),o.why));}
      else{b.classList.add('no');
        [...box.children].forEach((x,idx)=>{if(q.order[idx].k===0)x.classList.add('ok');});
        const right=q.order.find(x=>x.k===0);out.replaceChildren(fb('bad','Leider falsch – warum?',o.why+'<br><br><b>Richtig ist:</b> «'+right.t+'». '+right.why));}
      nextB.hidden=false;
    }},o.t);box.append(b);
  });
  app.append(h('section',{class:'panel'},
    h('div',{class:'kick'},`Frage ${Q.i+1} von ${Q.items.length} · ${GOALS[q.gi].t}`),
    h('div',{class:'qbar'},h('i',{style:`width:${Q.i/Q.items.length*100}%`})),
    h('p',{class:'q'},q.q),box,out),
    h('div',{class:'nav'},h('span'),nextB));
}
function renderQuizEnd(){
  const n=Q.items.length,sc=Q.score;
  P.quiz=sc;save();
  const msg=sc>=15?'Ausgezeichnet – du bist bereit!':sc>=11?'Gut gemacht! Fast alles sitzt schon.':sc>=7?'Du bist auf gutem Weg.':'Übe noch ein bisschen – du schaffst das!';
  const stars=sc>=15?3:sc>=11?2:1;
  const LBL=['nochmals üben','fast','sitzt'];
  const app=$('#app');app.replaceChildren(quizHead());
  app.append(h('section',{class:'panel center end'},bit(),
    h('div',{class:'score'},String(sc),h('small',{},` / ${n}`)),
    starRow(stars,'bigstars'),h('h3',{},msg),
    h('div',{class:'goals'},h('div',{class:'kick',style:'margin-bottom:4px'},'Dein Lernstand'),
      GOALS.map((g,gi)=>{const v=Q.per[gi];return h('div',{class:'goal'},
        h('div',{class:'gl'},h('b',{},g.t),h('span',{},`Kapitel ${g.ch} · ${v} von 2 richtig`)),
        h('span',{class:'st s'+v},LBL[v]),
        v<2?h('button',{class:'btn ghost small',onclick:()=>go(CH[g.ch-1].id)},`Kapitel ${g.ch} wiederholen`):null);})),
    h('div',{class:'proof'},h('p',{style:'margin:0'},`${sc} von ${n} Fragen richtig`),
      h('p',{class:'hint',style:'margin:4px 0 0'},new Date().toLocaleDateString('de-CH',{day:'numeric',month:'long',year:'numeric'})+' · Zeig dieses Ergebnis deiner Lehrperson.')),
    h('div',{class:'btnrow'},h('button',{class:'btn ghost',onclick:()=>go('start')},'Zur Übersicht'),h('button',{class:'btn',onclick:()=>{startQuiz();scrollTo(0,0);}},'Neuer Check mit anderen Fragen'))));
}

/* ---------- Navigation ---------- */
function route(){
  const t=(location.hash||'').slice(1);
  if(t==='quiz')startQuiz();
  else{const c=CH.find(c=>c.id===t);if(c)startChapter(c);else renderHome();}
  scrollTo(0,0);
}
function go(t){if(location.hash.slice(1)===t)route();else location.hash=t;}
window.addEventListener('hashchange',route);
route();
</script>
