<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernportal 6b</title>
<link rel="icon" type="image/svg+xml" href="icons/icon-lernportal.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-lernportal-64.png">
<link rel="apple-touch-icon" href="icons/icon-lernportal-180.png">
<meta property="og:title" content="Lernportal 6b">
<meta property="og:image" content="https://dhwrgjtrzh-hash.github.io/Vokabeltest/icons/icon-lernportal-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: ruhige Kopfzeile, darunter 2×2 Fächerkacheln; ein Fach öffnet eine Liste grosser, tippbarer Trainer-Zeilen. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#18233d; --muted:#5a6680; --line:#dde3ef;
  --mathe:#2f5bea; --mathe-soft:#e8eeff;
  --deutsch:#c2255c; --deutsch-soft:#fbe6ee;
  --englisch:#0b8a78; --englisch-soft:#dcf4ef;
  --nmg:#b8690a; --nmg-soft:#fbefdc;
  --franz:#5b46c9; --franz-soft:#ecebfa;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(24,35,61,.06), 0 6px 18px rgba(24,35,61,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111726; --surface:#1a2235; --ink:#eef2fb; --muted:#a3aec6; --line:#2a344c;
  --mathe:#7d9bff; --mathe-soft:#1f2b52;
  --deutsch:#f0709b; --deutsch-soft:#3e1d2b;
  --englisch:#4dd3bd; --englisch-soft:#13372f;
  --nmg:#f0a94a; --nmg-soft:#3b2a12;
  --franz:#a596ff; --franz-soft:#262343;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111726; --surface:#1a2235; --ink:#eef2fb; --muted:#a3aec6; --line:#2a344c;
  --mathe:#7d9bff; --mathe-soft:#1f2b52;
  --deutsch:#f0709b; --deutsch-soft:#3e1d2b;
  --englisch:#4dd3bd; --englisch-soft:#13372f;
  --nmg:#f0a94a; --nmg-soft:#3b2a12;
  --franz:#a596ff; --franz-soft:#262343;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45}
.wrap{max-width:820px; margin:0 auto; padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:26px}
header{display:flex; align-items:center; gap:14px}
.logo{width:52px; height:52px; flex:none}
h1{font-family:var(--display); font-weight:600; font-size:clamp(28px, 6vw, 38px); line-height:1.05; margin:0; letter-spacing:-.01em}
.klasse{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 4px}
.frage{font-family:var(--display); font-weight:500; font-size:22px; margin:0}

/* Fächer */
.faecher{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
.fach{--c:var(--mathe); --soft:var(--mathe-soft);
  display:flex; flex-direction:column; align-items:flex-start; gap:10px; text-align:left;
  background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:20px;
  padding:20px 18px 18px; box-shadow:var(--shadow); cursor:pointer; font:inherit;
  transition:transform .15s ease, border-color .15s ease}
.fach:hover{transform:translateY(-2px); border-color:var(--c)}
.fach:active{transform:translateY(0)}
.fach:focus-visible, .trainer:focus-visible, .zurueck:focus-visible{outline:3px solid var(--c, var(--mathe)); outline-offset:3px}
.fach .ico{width:58px; height:58px; border-radius:16px; background:var(--soft); color:var(--c); display:grid; place-items:center}
.fach .ico svg{width:34px; height:34px}
.fach .name{font-family:var(--display); font-weight:600; font-size:26px; line-height:1}
.fach .anz{font-size:14px; color:var(--muted)}
[data-fach="mathe"]{--c:var(--mathe); --soft:var(--mathe-soft)}
[data-fach="deutsch"]{--c:var(--deutsch); --soft:var(--deutsch-soft)}
[data-fach="englisch"]{--c:var(--englisch); --soft:var(--englisch-soft)}
[data-fach="nmg"]{--c:var(--nmg); --soft:var(--nmg-soft)}
[data-fach="franzoesisch"]{--c:var(--franz); --soft:var(--franz-soft)}

/* Fachansicht */
.ansicht{display:flex; flex-direction:column; gap:18px}
.zurueck{align-self:flex-start; display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:700; font-size:16px;
  color:var(--ink); background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:9px 16px 9px 12px; cursor:pointer}
.zurueck:hover{border-color:var(--muted)}
.zurueck svg{width:18px; height:18px}
.fachkopf{display:flex; align-items:center; gap:14px}
.fachkopf .ico{width:56px; height:56px; border-radius:16px; background:var(--soft); color:var(--c); display:grid; place-items:center; flex:none}
.fachkopf .ico svg{width:32px; height:32px}
.fachkopf h2{font-family:var(--display); font-weight:600; font-size:32px; margin:0; color:var(--c); line-height:1}
.tipp{margin:0; padding:12px 14px; border-radius:14px; background:var(--soft); color:var(--ink); font-size:15px}
.tipp b{color:var(--c)}
.liste{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; list-style:none}
.trainer{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px;
  background:var(--surface); color:var(--ink); text-decoration:none; border:2px solid var(--line); border-radius:18px;
  padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease}
.trainer:hover{transform:translateY(-2px); border-color:var(--c)}
.trainer .t-ico{width:48px; height:48px; border-radius:14px; background:var(--soft); color:var(--c); display:grid; place-items:center;
  font-family:var(--display); font-weight:600; font-size:20px}
.trainer .t-ico svg{width:28px; height:28px}
.trainer .t-name{font-family:var(--display); font-weight:600; font-size:21px; line-height:1.15; margin:0}
.trainer .t-text{margin:2px 0 0; color:var(--muted); font-size:15px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chip{font-size:12px; font-weight:700; letter-spacing:.03em; padding:3px 9px; border-radius:999px; border:1.5px solid var(--line); color:var(--muted)}
.trainer .pfeil{width:40px; height:40px; border-radius:50%; background:var(--c); color:var(--surface); display:grid; place-items:center}
.trainer .pfeil svg{width:20px; height:20px}
footer{font-size:13px; color:var(--muted); text-align:center}

@media (max-width:440px){
  .fach{padding:16px 14px}
  .fach .name{font-size:22px}
  .trainer{grid-template-columns:auto minmax(0,1fr); }
  .trainer .pfeil{display:none}
}
@media (prefers-reduced-motion: reduce){ .fach, .trainer{transition:none} .fach:hover, .trainer:hover{transform:none} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 52 52" aria-hidden="true">
      <rect x="2" y="2" width="22" height="22" rx="7" fill="var(--mathe)"/>
      <rect x="28" y="2" width="22" height="22" rx="7" fill="var(--deutsch)"/>
      <rect x="2" y="28" width="22" height="22" rx="7" fill="var(--englisch)"/>
      <rect x="28" y="28" width="22" height="22" rx="7" fill="var(--nmg)"/>
    </svg>
    <div>
      <p class="klasse">Klasse 6b</p>
      <h1>Lernportal</h1>
    </div>
  </header>

  <main id="app"></main>

  <footer>Tipp: Speichere diese Seite als Lesezeichen – dann hast du alle Trainer an einem Ort.</footer>
</div>

<script>
const ICONS = {
  mathe:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5v8M5 9h8M19 9h8M5 21h8M5 26h8M20 20l6 6M26 20l-6 6"/></svg>',
  deutsch:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 26 11 6h2l6 20M8 19h8"/><path d="M21 26l2-6 6-6-2-2-6 6-2 6z" stroke-width="2.4"/></svg>',
  englisch:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14v10H10l-4 4v-4H4z"/><path d="M22 12h6v10h-2v4l-4-4h-6v-2"/></svg>',
  franzoesisch:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h22v15H14l-6 5v-5H5z"/><path d="M12 11h6M12 11v6M12 14h4"/><path d="M21 9l-1.5 2"/></svg>',
  nmg:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="16" cy="16" r="11"/><path d="M5 16h22M16 5c3.5 3 5 7 5 11s-1.5 8-5 11c-3.5-3-5-7-5-11s1.5-8 5-11z"/></svg>',
  pfeil:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11M11 5l5 5-5 5"/></svg>',
  zurueck:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10H5M9 5l-5 5 5 5"/></svg>'
};
const BASIS = 'https://dhwrgjtrzh-hash.github.io/Vokabeltest/';
const FAECHER = [
  { id:'mathe', name:'Mathe',
    tipp:'Tippe beim Start immer <b>deine Zahl</b> ein. Dann machst du genau dort weiter, wo du aufgehört hast.',
    trainer:[
      { name:'Dezimalzahlen', text:'Stellenwerte und Zahlenstrahl mit Zehnteln, Hundertsteln und Tausendsteln.', zeichen:'0,1', url:BASIS+'dezimalzahlen.html', chips:[] },
      { name:'Brüche und Dezimalzahlen', text:'Brüche in Dezimalzahlen umwandeln und umgekehrt.', zeichen:'½', url:BASIS+'brueche-dezimalzahlen.html', chips:[] },
      { name:'Zahlen ordnen', text:'Zahlen und Brüche vergleichen und der Grösse nach ordnen.', zeichen:'&lt;&gt;', url:BASIS+'zahlen-ordnen.html', chips:[] }
    ]},
  { id:'deutsch', name:'Deutsch',
    tipp:'Tippe beim Start immer <b>deine Glückszahl</b> ein. Dann machst du dort weiter, wo du aufgehört hast.',
    trainer:[
      { name:'Rechtschreibung üben', text:'Du hörst Wörter und Sätze und schreibst sie auf.', zeichen:'Abc', url:BASIS+'rechtschreibung.html', chips:['Kopfhörer nötig'] },
      { name:'Fall-Detektiv', text:'Die vier Fälle erkennen, Kapitel für Kapitel.', zeichen:'?', url:BASIS+'faelle.html', chips:['4 Fälle'] }
    ]},
  { id:'englisch', name:'Englisch',
    tipp:'Übe die Wörter so lange, bis du sie <b>ohne Fehler</b> schreiben kannst.',
    trainer:[
      { name:'Tierwörter Unit 2', text:'Vokabeltrainer zu Young World, Unit 2.', zeichen:'ABC', url:BASIS+'tierwoerter.html', chips:['Vokabeln'] }
    ]},
  { id:'franzoesisch', name:'Französisch',
    tipp:'Übe in <b>beide Richtungen</b>: zuerst mit Auswählen, dann mit Schreiben.',
    trainer:[
      { name:'Vocabulaire Unité 1', text:'Orte, Fragewörter und Präpositionen aus Unité 1.', zeichen:'é', url:BASIS+'franzoesisch.html', chips:['Vokabeln'] }
    ]},
  { id:'nmg', name:'NMG',
    tipp:'Den Römer-Trainer kannst du <b>so oft du willst</b> wiederholen.',
    trainer:[
      { name:'Römer-Trainer', text:'Acht Übungen zum Leben im alten Rom.', zeichen:'XII', url:BASIS+'roemer.html', chips:['Die Römer'] }
    ]}
];

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function startseite(){
  app.innerHTML = `
    <section class="ansicht" aria-labelledby="frage">
      <p class="frage" id="frage">Was möchtest du heute üben?</p>
      <div class="faecher">
        ${FAECHER.map(f => `
          <button class="fach" type="button" data-fach="${f.id}" id="fach-${f.id}">
            <span class="ico">${ICONS[f.id]}</span>
            <span class="name">${f.name}</span>
            <span class="anz">${f.trainer.length} Trainer</span>
          </button>`).join('')}
      </div>
    </section>`;
  app.querySelectorAll('.fach').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.fach; }));
}

function fachseite(f){
  app.innerHTML = `
    <section class="ansicht" data-fach="${f.id}" aria-labelledby="fachtitel">
      <button class="zurueck" type="button" id="zurueck">${ICONS.zurueck} Alle Fächer</button>
      <div class="fachkopf">
        <span class="ico">${ICONS[f.id]}</span>
        <h2 id="fachtitel">${f.name}</h2>
      </div>
      <p class="tipp">${f.tipp}</p>
      <ul class="liste">
        ${f.trainer.map(t => `
          <li>
            <a class="trainer" href="${esc(t.url)}">
              <span class="t-ico">${t.zeichen}</span>
              <span>
                <p class="t-name">${t.name}</p>
                <p class="t-text">${t.text}</p>
                <span class="chips">${t.chips.map(c => `<span class="chip">${c}</span>`).join('')}</span>
              </span>
              <span class="pfeil">${ICONS.pfeil}</span>
            </a>
          </li>`).join('')}
      </ul>
    </section>`;
  document.getElementById('zurueck').addEventListener('click', () => {
    history.replaceState(null, '', location.pathname + location.search);
    zeigen();
  });
}

function zeigen(){
  const id = (location.hash || '').slice(1);
  const f = FAECHER.find(x => x.id === id);
  if (f) fachseite(f); else startseite();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', zeigen);
zeigen();
</script>

</body>
</html>
