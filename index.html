<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernportal 6b</title>
<link rel="icon" type="image/svg+xml" href="icons/icon-lernportal.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-lernportal-64.png">
<link rel="apple-touch-icon" href="icons/icon-lernportal-180.png">
<meta property="og:title" content="Lernportal 6b">
<meta property="og:image" content="https://dhwrgjtrzh-hash.github.io/Vokabeltest/icons/icon-lernportal-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: ruhige Kopfzeile, darunter 2×2 Fächerkacheln; ein Fach öffnet eine Liste grosser, tippbarer Trainer-Zeilen. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#18233d; --muted:#5a6680; --line:#dde3ef;
  --mathe:#2f5bea; --mathe-soft:#e8eeff;
  --deutsch:#c2255c; --deutsch-soft:#fbe6ee;
  --englisch:#0b8a78; --englisch-soft:#dcf4ef;
  --nmg:#b8690a; --nmg-soft:#fbefdc;
  --franz:#5b46c9; --franz-soft:#ecebfa;
  --mi:#0e7490; --mi-soft:#dff3f8;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(24,35,61,.06), 0 6px 18px rgba(24,35,61,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111726; --surface:#1a2235; --ink:#eef2fb; --muted:#a3aec6; --line:#2a344c;
  --mathe:#7d9bff; --mathe-soft:#1f2b52;
  --deutsch:#f0709b; --deutsch-soft:#3e1d2b;
  --englisch:#4dd3bd; --englisch-soft:#13372f;
  --nmg:#f0a94a; --nmg-soft:#3b2a12;
  --franz:#a596ff; --franz-soft:#262343;
  --mi:#5ccfe6; --mi-soft:#12333d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111726; --surface:#1a2235; --ink:#eef2fb; --muted:#a3aec6; --line:#2a344c;
  --mathe:#7d9bff; --mathe-soft:#1f2b52;
  --deutsch:#f0709b; --deutsch-soft:#3e1d2b;
  --englisch:#4dd3bd; --englisch-soft:#13372f;
  --nmg:#f0a94a; --nmg-soft:#3b2a12;
  --franz:#a596ff; --franz-soft:#262343;
  --mi:#5ccfe6; --mi-soft:#12333d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45}
.wrap{max-width:820px; margin:0 auto; padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:26px}
header{display:flex; align-items:center; gap:14px}
.logo{width:52px; height:52px; flex:none}
h1{font-family:var(--display); font-weight:600; font-size:clamp(28px, 6vw, 38px); line-height:1.05; margin:0; letter-spacing:-.01em}
.klasse{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 4px}
.frage{font-family:var(--display); font-weight:500; font-size:22px; margin:0}

/* Fächer */
.faecher{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
.fach{--c:var(--mathe); --soft:var(--mathe-soft);
  display:flex; flex-direction:column; align-items:flex-start; gap:10px; text-align:left;
  background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:20px;
  padding:20px 18px 18px; box-shadow:var(--shadow); cursor:pointer; font:inherit;
  transition:transform .15s ease, border-color .15s ease}
.fach:hover{transform:translateY(-2px); border-color:var(--c)}
.fach:active{transform:translateY(0)}
.fach:focus-visible, .trainer:focus-visible, .zurueck:focus-visible{outline:3px solid var(--c, var(--mathe)); outline-offset:3px}
.fach .ico{width:58px; height:58px; border-radius:16px; background:var(--soft); color:var(--c); display:grid; place-items:center}
.fach .ico svg{width:34px; height:34px}
.fach .name{font-family:var(--display); font-weight:600; font-size:26px; line-height:1}
.fach .anz{font-size:14px; color:var(--muted)}
[data-fach="mathe"]{--c:var(--mathe); --soft:var(--mathe-soft)}
[data-fach="deutsch"]{--c:var(--deutsch); --soft:var(--deutsch-soft)}
[data-fach="englisch"]{--c:var(--englisch); --soft:var(--englisch-soft)}
[data-fach="nmg"]{--c:var(--nmg); --soft:var(--nmg-soft)}
[data-fach="franzoesisch"]{--c:var(--franz); --soft:var(--franz-soft)}
[data-fach="mi"]{--c:var(--mi); --soft:var(--mi-soft)}
/* Noch nicht freigeschaltet (z. B. ein Test, der erst später startet) */
.trainer.zu{cursor:default; box-shadow:none; border-style:dashed; opacity:.85}
.trainer.zu:hover{transform:none; border-color:var(--line)}
.trainer.zu .pfeil{background:var(--line); color:var(--muted)}
.trainer .zu-satz{display:block; margin-top:6px; font-size:14px; font-weight:700; color:var(--c)}
.trainer .zu-notiz{display:inline-block; margin-top:6px; font-size:14px; font-weight:700; padding:3px 10px; border-radius:8px; background:#ffe27a; color:#2b2100}

/* Fachansicht */
.ansicht{display:flex; flex-direction:column; gap:18px}
.zurueck{align-self:flex-start; display:inline-flex; align-items:center; gap:8px; font:inherit; font-weight:700; font-size:16px;
  color:var(--ink); background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:9px 16px 9px 12px; cursor:pointer}
.zurueck:hover{border-color:var(--muted)}
.zurueck svg{width:18px; height:18px}
.fachkopf{display:flex; align-items:center; gap:14px}
.fachkopf .ico{width:56px; height:56px; border-radius:16px; background:var(--soft); color:var(--c); display:grid; place-items:center; flex:none}
.fachkopf .ico svg{width:32px; height:32px}
.fachkopf h2{font-family:var(--display); font-weight:600; font-size:32px; margin:0; color:var(--c); line-height:1}
.tipp{margin:0; padding:12px 14px; border-radius:14px; background:var(--soft); color:var(--ink); font-size:15px}
.tipp b{color:var(--c)}
.liste{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; list-style:none}
.trainer{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px;
  background:var(--surface); color:var(--ink); text-decoration:none; border:2px solid var(--line); border-radius:18px;
  padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease}
.trainer:hover{transform:translateY(-2px); border-color:var(--c)}
.trainer .t-ico{width:48px; height:48px; border-radius:14px; background:var(--soft); color:var(--c); display:grid; place-items:center;
  font-family:var(--display); font-weight:600; font-size:20px}
.trainer .t-ico svg{width:28px; height:28px}
.trainer .t-name{font-family:var(--display); font-weight:600; font-size:21px; line-height:1.15; margin:0}
.trainer .t-text{margin:2px 0 0; color:var(--muted); font-size:15px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chip{font-size:12px; font-weight:700; letter-spacing:.03em; padding:3px 9px; border-radius:999px; border:1.5px solid var(--line); color:var(--muted)}
/* Beta-Test: Hinweis direkt neben dem Namen */
.beta-name{display:inline-block; vertical-align:3px; margin-left:6px; font-family:var(--body); font-size:12px; font-weight:700; letter-spacing:.03em;
  padding:3px 9px; border-radius:999px; background:#fdeceb; color:#a32315; border:1.5px solid #d93a2b}
@media (prefers-color-scheme: dark){ .beta-name{background:#3d1d1a; color:#ffb3a8; border-color:#ff7b6b} }
.trainer .beta-satz{display:block; margin-top:6px; font-size:13.5px; font-weight:700; color:#a32315}
@media (prefers-color-scheme: dark){ .trainer .beta-satz{color:#ffb3a8} }
.trainer .pfeil{width:40px; height:40px; border-radius:50%; background:var(--c); color:var(--surface); display:grid; place-items:center}
.trainer .pfeil svg{width:20px; height:20px}
footer{font-size:13px; color:var(--muted); text-align:center}
/* Kompakte Fachseite (17.11.2026): alle Trainer sollen ohne Scrollen sichtbar sein */
body.fach-offen .wrap{padding-block:14px 40px; gap:14px}
body.fach-offen header .logo{width:34px; height:34px}
body.fach-offen header h1{font-size:24px}
body.fach-offen header .klasse{display:none}
.ansicht.im-fach{gap:12px}
.im-fach .fachkopf{gap:12px}
.im-fach .fachkopf .ico{width:44px; height:44px; border-radius:13px}
.im-fach .fachkopf .ico svg{width:26px; height:26px}
.im-fach .fachkopf h2{font-size:28px}
.im-fach .fachkopf .zurueck{margin-left:auto; font-size:15px; padding:7px 13px 7px 10px}
.im-fach .tipp{padding:8px 12px; font-size:14.5px; line-height:1.35}
.im-fach .liste{gap:9px}
.im-fach .trainer{padding:10px 14px; gap:12px; border-radius:16px}
.im-fach .trainer .t-ico{width:42px; height:42px; border-radius:12px; font-size:17px}
.im-fach .trainer .t-name{font-size:19px}
.im-fach .trainer .t-text{font-size:14.5px}
.im-fach .chips{margin-top:5px}
.im-fach .u-status{margin-top:4px}
.im-fach .trainer .pfeil{width:34px; height:34px}
.im-fach .extras{margin-top:6px; gap:8px}
.im-fach .extra-knopf{margin-top:0; padding:11px 14px; gap:12px; border-radius:18px}
.im-fach .extra-knopf .x-ico{width:46px; height:46px; border-radius:13px; font-size:18px}
.im-fach .extra-knopf .x-name{font-size:20px}
.im-fach .extra-knopf .x-text{font-size:14px; margin-top:1px}
.im-fach .extra-knopf .pfeil{width:38px; height:38px}
.im-fach .ueben{margin-top:6px}
@media (max-width:560px){
  /* Handy: Beschreibung und Chips weglassen – Name und Stand reichen */
  .im-fach .trainer .t-text, .im-fach .trainer .chips{display:none}
  .im-fach .trainer .t-name{font-size:18px}
  .im-fach .fachkopf h2{font-size:25px}
  .im-fach .extra-knopf .x-text{display:none}
}
/* Hinweis neben dem Namen (z. B. Audios in Überarbeitung) – wie «Beta-Test», aber in Gelb */
.hinweis-name{display:inline-block; vertical-align:3px; margin-left:6px; font-family:var(--body); font-size:12px; font-weight:700; letter-spacing:.03em;
  padding:3px 9px; border-radius:999px; background:#fff4cc; color:#6b4a00; border:1.5px solid #e0a800}
.trainer .hinweis-satz{display:block; margin-top:6px; font-size:13.5px; font-weight:700; color:#8a5a00}
@media (prefers-color-scheme: dark){ .hinweis-name{background:#3a2d0a; color:#ffe08a; border-color:#c99a1a} .trainer .hinweis-satz{color:#ffd76a} }
/* Mathe: Einmaleins-Trainer abgesetzt von den Matheplänen – eigener, farbiger Knopf */
.extra-knopf{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px; margin-top:14px;
  padding:18px 18px; border-radius:22px; text-decoration:none; color:#2b1600;
  background:linear-gradient(135deg, #ffd45c 0%, #ff9a3d 100%); border:2px solid #f08a2c;
  box-shadow:0 6px 18px rgba(240,138,44,.28); transition:transform .15s ease}
.extra-knopf:hover{transform:translateY(-2px)}
.extra-knopf:focus-visible{outline:3px solid #f08a2c; outline-offset:3px}
.extra-knopf .x-ico{width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,.75); color:#b34d00; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:21px}
.extra-knopf .x-name{display:block; font-family:var(--display); font-weight:700; font-size:23px; line-height:1.15}
.extra-knopf .x-text{display:block; margin-top:3px; font-size:15px; color:#4a2a00}
.extra-knopf .u-status{color:#3a2000}
.extra-knopf .u-status .u-leise{color:#5a3600}
.extra-knopf .pfeil{width:44px; height:44px; border-radius:50%; background:#2b1600; color:#ffd45c; display:grid; place-items:center}
.extra-knopf .pfeil svg{width:22px; height:22px}
@media (max-width:440px){ .extra-knopf{grid-template-columns:auto minmax(0,1fr)} .extra-knopf .pfeil{display:none} }
/* Mehrere Extra-Knöpfe (Einmaleins-Trainer, Gymi-Training): auf breiten Bildschirmen nebeneinander (19.11.2026) */
.extras{display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px}
.extras .extra-knopf{margin-top:0}
@media (min-width:640px){ .extras{grid-template-columns:1fr 1fr} }
.extra-knopf .beta-name{vertical-align:4px}
/* Gymi-Training: eigene Farbe (Türkis) */
.extra-knopf.gymi{color:#062b24; background:linear-gradient(135deg, #9af2da 0%, #2fb39a 100%); border-color:#23a088; box-shadow:0 6px 18px rgba(35,160,136,.28)}
.extra-knopf.gymi:focus-visible{outline-color:#23a088}
.extra-knopf.gymi .x-ico{color:#0f6a5a; font-size:18px}
.extra-knopf.gymi .x-text{color:#0b3d33}
.extra-knopf.gymi .u-status, .extra-knopf.gymi .u-status .u-leise{color:#0b3d33}
.extra-knopf.gymi .pfeil{background:#062b24; color:#9af2da}

@media (max-width:440px){
  .fach{padding:16px 14px}
  .fach .name{font-size:22px}
  .trainer{grid-template-columns:auto minmax(0,1fr); }
  .trainer .pfeil{display:none}
}
/* Mathe: Status in den Trainer-Zeilen und eingeklappte Tipps */
.u-status{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:7px; font-size:14px}
.u-status:empty{display:none}
.u-balken{display:inline-flex; gap:3px; width:120px; flex:none}
.u-balken i{flex:1; height:7px; border-radius:4px; background:var(--line); display:block}
.u-balken i.ok{background:#2fa35c} .u-balken i.dran{background:var(--c)} .u-balken i.no{background:#e0614f}
.u-nochmal{color:#c0392b; font-weight:700}
.u-weiter{color:#b35c00; font-weight:700}
.u-balken i.halb{background:#f0a020}
/* Grundanforderungen gelb, erweiterte Anforderungen grün (wie im Matheplan) */
.u-balken .u-gr{display:inline-flex; gap:3px; padding:3px; border-radius:6px}
.u-balken .u-gr i{flex:none; width:14px}
.u-balken .u-gr i:not([class]), .u-balken .u-gr i[class=""]{background:rgba(255,255,255,.8)}
.u-gr.grund, .anf.grund{background:#ffe58a} .u-gr.erw, .anf.erw{background:#bfe8a8}
.anf{display:inline-flex; align-items:center; border-radius:999px; padding:2px 9px; font-size:12px; font-weight:700; white-space:nowrap}
.anf.grund{color:#5c4400} .anf.erw{color:#1f5410}
.u-buch{margin:4px 0 6px!important; font-size:14px}
@media (prefers-color-scheme: dark){
  .u-gr.grund, .anf.grund{background:#4a3c08} .u-gr.erw, .anf.erw{background:#1d3d14}
  .anf.grund{color:#ffe08a} .anf.erw{color:#b6eb98}
  .u-balken .u-gr i:not([class]), .u-balken .u-gr i[class=""]{background:rgba(255,255,255,.2)}
}
.u-balken i.halb-ok{background:linear-gradient(90deg,#2fa35c 50%,#f0a020 50%)}
.u-ziel.halb{border-left-color:#f0a020}
.u-leise{color:var(--muted)}
.ueben{--rot:#d93a2b; background:var(--surface); border:3px solid var(--rot); border-radius:18px; box-shadow:var(--shadow); overflow:hidden}
.ueben > summary{display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; font-family:var(--display); font-weight:600; font-size:20px; list-style:none; background:#fdeceb; color:#a32315}
@media (prefers-color-scheme: dark){ .ueben{--rot:#ff7b6b} .ueben > summary{background:#3d1d1a; color:#ffb3a8} }
.u-intro{font-weight:700; margin:12px 0 4px!important}
.u-titel{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin:0 0 2px!important}
.u-titel b{font-size:17px}
.u-plan{font-size:12px; font-weight:700; color:var(--c); background:var(--soft); border-radius:999px; padding:2px 9px}
.ueben > summary::-webkit-details-marker{display:none}
.ueben > summary::after{content:"▾"; margin-left:auto; color:var(--muted)}
.ueben[open] > summary::after{content:"▴"}
.u-zahl{background:var(--rot); color:#fff; border-radius:999px; font-family:var(--body); font-size:13px; font-weight:700; padding:1px 9px}
.u-nr{white-space:nowrap; font-family:var(--body); font-size:12px; font-weight:700; color:var(--muted); border:1.5px solid var(--line); border-radius:999px; padding:1px 8px}
.u-inhalt{padding:0 16px 12px; font-size:15px}
.u-inhalt p{margin:6px 0}
.u-offen{margin:2px 0 4px; padding-left:20px}
.u-ziel{border:1.5px solid var(--line); border-left:5px solid var(--rot); border-radius:12px; padding:9px 12px; margin:10px 0}
.u-ziel details{margin:2px 0 6px}
.u-ziel summary{cursor:pointer; font-weight:700; color:var(--c)}
.u-hilfe{margin-top:6px; padding:10px 12px; border-radius:12px; background:var(--bg); line-height:1.5}
.u-hilfe p{margin:0 0 6px}
.u-los{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:14px; text-decoration:none; color:var(--surface); background:var(--c); border-radius:999px; padding:6px 12px}
.u-los svg{width:14px; height:14px}
.u-hilfe .fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 .08em; font-size:.82em; font-weight:inherit}
.u-hilfe .fr>span{display:block; padding:0 .14em; text-align:center}
.u-hilfe .fr>span:first-child{border-bottom:.09em solid currentColor; padding-bottom:.07em}
.u-hilfe .fr>span:last-child{padding-top:.07em}
.u-hilfe .svt{border-collapse:separate; border-spacing:0; margin:6px 0 10px; font-variant-numeric:tabular-nums; border:2px solid var(--line); border-radius:12px; overflow:hidden}
.u-hilfe .svt th, .u-hilfe .svt td{border-right:2px solid var(--line); padding:5px; text-align:center; min-width:44px}
.u-hilfe .svt th:last-child, .u-hilfe .svt td:last-child{border-right:0}
.u-hilfe .svt th{background:var(--soft); font-size:.72rem; color:var(--muted); line-height:1.15; border-bottom:2px solid var(--line); font-weight:400}
.u-hilfe .svt th b{display:block; font-size:1rem; color:var(--ink)}
.u-hilfe .svt td{font-size:1.25rem; font-weight:800; background:var(--surface)}
.u-hilfe .svt .dot{border-left:5px solid var(--ink)}
/* Wertepaare und Wertetabellen in den Erklärungen (ab Matheplan «Proportionalität») */
.u-hilfe .tabwrap{overflow-x:auto}
.u-hilfe table.wp{border-collapse:collapse; font-variant-numeric:tabular-nums; margin:4px 0 8px; font-weight:600}
.u-hilfe table.wp th{font-size:.75rem; color:var(--muted); font-weight:700; padding:0 7px 2px; text-align:center; line-height:1.2}
.u-hilfe table.wp td{padding:2px 7px; text-align:right; white-space:nowrap}
.u-hilfe table.wp td.sep{color:var(--muted); padding:2px; text-align:center}
.u-hilfe table.wp td.op{color:#b86e00; font-weight:800; font-size:.9em; text-align:center}
.u-hilfe table.wp tr.strich td.w{border-bottom:2px solid currentColor}
.u-hilfe table.wp tr.fett td.w{font-weight:800}
.u-hilfe table.wp td.w.ziel{background:rgba(63,191,111,.18); border-radius:6px}
.u-hilfe table.wp td.frage{color:var(--c, #2f5bea); font-weight:800}
.u-hilfe table.wtab{border-collapse:collapse; font-variant-numeric:tabular-nums; margin:4px 0 8px; font-weight:700}
.u-hilfe table.wtab th{font-size:.75rem; color:var(--muted); font-weight:700; padding:0 10px 4px; border-bottom:2px solid var(--ink); text-align:center; line-height:1.2}
.u-hilfe table.wtab td{padding:4px 10px; text-align:center; border-bottom:1px solid var(--line)}
.u-hilfe table.wtab td.strich{color:var(--muted); padding:4px 2px}

const gesperrt = t => t.ab && Date.now() < Date.parse(t.ab);

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  app.querySelectorAll('.fach').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.fach; }));

function fachseite(f){
  app.innerHTML = `
    <section class="ansicht im-fach" data-fach="${f.id}" aria-labelledby="fachtitel">
      <div class="fachkopf">
        <span class="ico">${ICONS[f.id]}</span>
        <h2 id="fachtitel">${f.name}</h2>

      </div>
      <p class="tipp">${f.tipp}</p>
      <ul class="liste">
        ${f.trainer.filter(t => !t.extra).map(t => `
          <li>
            <${gesperrt(t) ? 'div class="trainer zu" aria-disabled="true"' : `a class="trainer" href="${esc(t.url)}"`}>
              <span class="t-ico">${t.zeichen}</span>

                <p class="t-name">${t.name}${t.beta ? '<span class="beta-name">🧪 Beta-Test</span>' : ''}${t.hinweis ? `<span class="hinweis-name">${t.hinweis}</span>` : ''}</p>

                ${t.hinweisSatz ? `<span class="hinweis-satz">${t.hinweisSatz}</span>` : ''}
                ${gesperrt(t) ? `<span class="zu-satz">Noch gesperrt – ab ${esc(t.abText)}</span>` : ''}
                ${gesperrt(t) && t.notiz ? `<span class="zu-notiz">${esc(t.notiz)}</span>` : ''}
                ${f.id === 'mathe' ? `<span class="u-status" data-plan="${esc(t.name)}"></span>` : ''}
              </span>

      </ul>
      ${f.trainer.some(t => t.extra) ? `<div class="extras">${f.trainer.filter(t => t.extra).map(t => `
        <a class="extra-knopf${t.stil ? ' ' + t.stil : ''}" href="${esc(t.url)}">
          <span class="x-ico">${t.zeichen}</span>

            ${f.id === 'mathe' ? `<span class="u-status" data-plan="${esc(t.plan || t.name)}"></span>` : ''}

      ${f.id === 'mathe' ? '<details class="ueben" id="ueben" hidden></details>' : ''}

/* ===== Mathe: «Was du noch üben solltest» – aus dem Lernstand der Mathe-Trainer (Glückszahl, nie ein Name) ===== */
const STAND_URL = 'https://script.google.com/macros/s/AKfycbzrgzAVAzJ9qKnFE-A4AocZiMw3cG-8pMTBbJ73ypN3HQH7XzOCM7hVgW2WbqBkBNIs/exec';
const lies = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
function meineZahl(){ const z = String(lies('uebung.gz') || lies('rs.gz') || '').replace(/\D/g,''); return /^\d{1,2}$/.test(z) && +z >= 1 && +z <= 21 ? String(+z) : ''; }
function lokalerStand(plan, gz){ try { return JSON.parse(lies('uebung.p.' + plan + '.' + gz) || 'null'); } catch(e) { return null; } }
function serverStand(plan, gz){
  return Promise.race([
    fetch(STAND_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({typ:'stand-laden', uebung:plan, glueckszahl:gz})})
      .then(r => r.json()).then(d => { if (!d || !d.ok || !d.stand) return null; const s = JSON.parse(d.stand); if (s && !s.t) s.t = Number(d.t) || 0; return s; }).catch(() => null),
    new Promise(ok => setTimeout(() => ok(null), 5000))
  ]);
}
/* Auswertung eines Plans aus dem gespeicherten Lernstand */
/* Grundanforderungen zuerst (die sind oft Hausaufgabe), dann nach Anteil richtig */
const grundZuerst = (a, b) => (a.erw ? 1 : 0) - (b.erw ? 1 : 0) || a.q - b.q;
function planLage(p, st){
  const g = (st && st.goals) || {};
  const z = p.ziele.map(x => { const s = g[x.id] || {}; const n = +s.n || 0, ok = +s.ok || 0;
    /* lv > 2: Lernstand aus der Zeit mit drei Stufen – Stufe 3 erreicht gilt heute als geschafft (wie im Mathe-Trainer) */
    const done = !!s.done || +s.lv > 2;
    /* bearbeitet: 10 Aufgaben gemacht, aber (noch) nicht geschafft – die Hausaufgabe ist erledigt, mit Fehlern */
    return Object.assign({}, x, { n, ok, done, bearbeitet: !done && !!(s.bearbeitet || s.spaeter), lv: +s.lv || 1, q: n ? ok / n : null }); });
  const geschafft = z.filter(x => x.done), begonnen = z.filter(x => x.n > 0);
  /* rot: unter 60 % richtig · orange: 60–84 % richtig (noch nicht ganz sicher) · jeweils nur, solange das Lernziel nicht geschafft ist */
  const nochmal = z.filter(x => !x.done && x.n >= 4 && x.q < 0.6).sort(grundZuerst);
  const sicherer = z.filter(x => !x.done && x.n >= 3 && !nochmal.includes(x) && x.q < 0.85).sort(grundZuerst);
  /* geschafft, aber insgesamt unter 75 % richtig: nochmals anschauen */
  const auffrischen = z.filter(x => x.done && x.n >= 3 && x.q < 0.75).sort(grundZuerst);
  const dran = z.filter(x => !x.done && x.n > 0 && !nochmal.includes(x) && !sicherer.includes(x));
  const offen = z.filter(x => x.n === 0 && !x.done);
  return { z, geschafft, begonnen, nochmal, sicherer, auffrischen, dran, offen, last: st && st.last };
}
function matheUebenHtml(gz, staende){
  const lagen = MATHE_PLAENE.map(p => ({ p, l: planLage(p, staende[p.plan]) }));
  /* kurze Statuszeile in jeder Trainer-Zeile */
  const status = {};
  lagen.forEach(({p, l}) => {
    const tot = p.ziele.length, gs = l.geschafft.length;
    const seg = z => `<i class="${z.done ? (l.auffrischen.includes(z) ? 'ok halb-ok' : 'ok') : z.n ? (l.nochmal.includes(z) ? 'no' : l.sicherer.includes(z) || z.bearbeitet ? 'halb' : 'dran') : ''}"></i>`;
    /* gelb: Grundanforderungen · grün: erweiterte Anforderungen */
    const grund = l.z.filter(z => !z.erw), erw = l.z.filter(z => z.erw);
    const gsG = grund.filter(z => z.done).length, erlG = grund.filter(z => z.done || z.bearbeitet).length;
    const ueben = l.nochmal.concat(l.sicherer).find(z => !z.erw);   // Grundanforderung mit den meisten Fehlern
    const balken = `<span class="u-balken" aria-hidden="true"><span class="u-gr grund">${grund.map(seg).join('')}</span>${erw.length ? `<span class="u-gr erw">${erw.map(seg).join('')}</span>` : ''}</span>`;
    /* Solange die Grundanforderungen nicht alle bearbeitet sind: wie weit die Hausaufgabe ist.
       Danach: was noch nicht sitzt (rot/orange) – bearbeitet ist bearbeitet, auch mit Fehlern. */
    const text = !l.begonnen.length && !gs ? `<span class="u-leise">Noch nicht geübt</span>`
      : erlG < grund.length ? `<span>${erlG} von ${grund.length} Grundanforderungen bearbeitet${gsG ? ` · ${gsG} geschafft ⭐` : ''}</span>`
      : gsG < grund.length && ueben ? `<span class="${l.nochmal.includes(ueben) ? 'u-nochmal' : 'u-weiter'}">✓ Grundanforderungen bearbeitet · nochmals üben: ${esc(ueben.titel)}</span>`
      : gsG < grund.length ? `<span>✓ Grundanforderungen bearbeitet · ${gsG} von ${grund.length} geschafft</span>`
      : l.nochmal.length ? `<span class="u-nochmal">Nochmals üben: ${esc(l.nochmal[0].titel)}</span>`
      : l.sicherer.length ? `<span class="u-weiter">Weiter üben: ${esc(l.sicherer[0].titel)}</span>`
      : l.auffrischen.length ? `<span class="u-weiter">Nochmals anschauen: ${esc(l.auffrischen[0].titel)}</span>`
      : gs === tot ? `<span>Alles geschafft 🏆</span>`
      : gsG === grund.length ? `<span>Grundanforderungen geschafft ⭐ – jetzt die erweiterten</span>`
      : `<span>${gsG} von ${grund.length} Grundanforderungen geschafft${gsG ? ' ⭐' : ''}</span>`;
    status[p.plan] = `${balken}${text}`;
  });
  /* ausführliche Tipps (eingeklappt) */
  const zielLink = (p, x) => `<a class="u-los" href="${esc(BASIS + p.url)}?ziel=${encodeURIComponent(x.id)}">«${esc(x.titel)}» üben ${ICONS.pfeil}</a>`;
  const nochmal = lagen.flatMap(({p, l}) => l.nochmal.slice(0, 2).map(x => ({p, x}))).sort((a, b) => a.x.q - b.x.q);
  const sicherer = lagen.flatMap(({p, l}) => l.sicherer.slice(0, 2).map(x => ({p, x}))).sort((a, b) => a.x.q - b.x.q).slice(0, Math.max(0, 3 - nochmal.length));
  const auffrischen = lagen.flatMap(({p, l}) => l.auffrischen.map(x => ({p, x}))).sort((a, b) => a.x.q - b.x.q).slice(0, Math.max(0, 3 - nochmal.length - sicherer.length));
  const neu = lagen.filter(({l}) => !l.begonnen.length && !l.geschafft.length).map(({p}) => p.plan);
  const offen = lagen.flatMap(({p, l}) => l.begonnen.length ? l.offen.filter(x => !x.erw).map(x => ({p, x})) : []);
  const teile = [];
  if (nochmal.length) teile.push(`<p class="u-intro">${nochmal.length === 1 ? 'Dieses Lernziel klappt' : 'Diese Lernziele klappen'} noch nicht so gut. Lies die Erklärung bei «So geht's» und übe ${nochmal.length === 1 ? 'es' : 'sie'} dann nochmals.</p>`);
  const anf = x => `<span class="anf ${x.erw ? 'erw' : 'grund'}">${x.erw ? 'Erweiterte Anforderung' : 'Grundanforderung'}</span>`;
  const karte = (p, x, cls) => `<div class="u-ziel ${cls}"><p class="u-titel"><b>${esc(x.titel)}</b> <span class="u-plan">${esc(p.plan)}</span> ${anf(x)}</p>
      <p class="u-leise">${esc(x.info || '')}${x.info ? ' · ' : ''}${x.ok} von ${x.n} Aufgaben richtig (${Math.round(x.q * 100)} %)</p>
      ${x.buch ? `<p class="u-buch">📖 Üben im Buch und Heft: <b>${esc(x.buch)}</b></p>` : ''}
      <details><summary>So geht's</summary><div class="u-hilfe">${x.hilfe}</div></details>${zielLink(p, x)}</div>`;
  nochmal.forEach(({p, x}) => teile.push(karte(p, x, '')));
  if (sicherer.length){
    teile.push(`<p class="u-intro">${nochmal.length ? 'Auch hier' : 'Hier'} passieren noch Fehler – ${sicherer.length === 1 ? 'das sitzt' : 'das sitzt'} noch nicht ganz sicher. Übe weiter, bis du es geschafft hast:</p>`);
    sicherer.forEach(({p, x}) => teile.push(karte(p, x, 'halb')));
  }
  if (auffrischen.length){
    teile.push(`<p class="u-intro">${auffrischen.length === 1 ? 'Dieses Lernziel hast du' : 'Diese Lernziele hast du'} geschafft ⭐ – aber dabei sind noch viele Fehler passiert. Schau dir die Erklärung nochmals an und übe ${auffrischen.length === 1 ? 'es' : 'sie'} noch einmal:</p>`);
    auffrischen.forEach(({p, x}) => teile.push(karte(p, x, 'halb')));
  }
  const allesGut = !nochmal.length && !sicherer.length && !auffrischen.length && lagen.some(({l}) => l.begonnen.length);
  if (allesGut && (neu.length || offen.length)) teile.push(`<p class="u-intro">Super, was du bisher geübt hast, klappt gut! Hier wartet noch Neues auf dich:</p>`);
  if (neu.length) teile.push(`<p><b>Noch nicht begonnen:</b> ${neu.map(esc).join(', ')}</p>`);
  if (offen.length) teile.push(`<p><b>Noch nicht geübt</b> <span class="anf grund">Grundanforderungen</span></p><ul class="u-offen">${MATHE_PLAENE.filter(p => offen.some(o => o.p === p)).map(p => `<li><span class="u-leise">${esc(p.plan)}:</span> ${offen.filter(o => o.p === p).map(({x}) => esc(x.titel)).join(', ')}</li>`).join('')}</ul>`);
  const anzahl = nochmal.length + sicherer.length + auffrischen.length;
  const detail = teile.length ? `<summary><span>🎯 Das solltest du noch üben</span>${anzahl ? `<span class="u-zahl">${anzahl}</span>` : ''}<span class="u-nr">Nr. ${esc(gz)}</span></summary>
    <div class="u-inhalt">${teile.join('')}</div>` : '';
  return { status, detail };
}
/* Einmaleins: wie viele Rechnungen sitzen (gleiche Regel wie im Trainer: zuletzt richtig und schnell, davor auch) */
function einmaleinsStatus(gz){
  const st = lokalerStand('Einmaleins', gz), f = (st && st.f) || {};
  const sitzt = id => { const h = (f[id] || {}).h || ''; const z = h.slice(-1); return z === 's' && (h.length === 1 || h.slice(-2, -1) === 's'); };
  const zaehle = (pre, n) => Object.keys(f).filter(id => id.startsWith(pre) && sitzt(id)).length + ' von ' + n;
  if (!Object.keys(f).length) return `<span class="u-leise">Noch nicht geübt</span>`;
  return st.grossFrei ? `<span>Kleines 1×1: ${zaehle('k:', 45)} · Grosses 1×1: ${zaehle('g:', 80)} sitzen</span>`
    : `<span>Kleines 1×1: ${zaehle('k:', 45)} sitzen · Grosses 1×1 🔒 ab 41</span>`;
}
/* Gymi-Training: wie viele Aufgaben geübt und die letzte Prüfung (aus dem Lernstand im Trainer) */
function gymiStatus(gz){
  const st = lokalerStand('Gymi-Training', gz), ty = (st && st.typ) || {}, pr = (st && st.pr) || [];
  const n = Object.values(ty).reduce((a, x) => a + (+x.n || 0), 0), l = pr[pr.length - 1];
  if (!n && !l) return `<span class="u-leise">Noch nicht geübt</span>`;
  return `<span>${n} ${n === 1 ? 'Aufgabe' : 'Aufgaben'} geübt${l ? ` · letzte Prüfung: ${l.punkte}/${l.max} Punkte` : ''}</span>`;
}
function matheUebenZeigen(gz, staende){
  const r = matheUebenHtml(gz, staende);
  document.querySelectorAll('.u-status[data-plan]').forEach(el => { el.innerHTML = r.status[el.dataset.plan] || (el.dataset.plan === 'Einmaleins' ? einmaleinsStatus(gz) : el.dataset.plan === 'Gymi-Training' ? gymiStatus(gz) : ''); });
  const d = document.getElementById('ueben');
  if (d){ const offen = d.dataset.gesetzt ? d.open : true; d.innerHTML = r.detail; d.hidden = !r.detail; d.open = offen; d.dataset.gesetzt = '1'; }
}
async function matheUeben(){
  const gz = meineZahl();
  if (!gz) return;   // ohne Glückszahl nichts anzeigen – die Kinder geben sie im Trainer ein
  const lokal = {}; MATHE_PLAENE.forEach(p => { lokal[p.plan] = lokalerStand(p.plan, gz); });
  matheUebenZeigen(gz, lokal);
  /* Stand aus der Tabelle holen (falls auf einem anderen Gerät geübt wurde) – der neuere gilt */
  const server = await Promise.all(MATHE_PLAENE.map(p => serverStand(p.plan, gz)));
  if (!document.getElementById('ueben')) return;
  let neuer = false;
  MATHE_PLAENE.forEach((p, i) => { const s = server[i], l = lokal[p.plan]; if (s && (!l || (s.t || 0) > (l.t || 0))) { lokal[p.plan] = s; neuer = true; } });
  if (neuer) matheUebenZeigen(gz, lokal);
}

function zeigen(){
  const id = (location.hash || '').slice(1);
  const f = FAECHER.find(x => x.id === id);
  document.body.classList.toggle('fach-offen', !!f);
  if (f) fachseite(f); else startseite();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', zeigen);
/* Gesperrte Einträge zur Startzeit von selbst freischalten, falls die Seite schon offen ist */
FAECHER.forEach(f => f.trainer.forEach(t => { if (gesperrt(t)) { const ms = Date.parse(t.ab) - Date.now() + 1500; if (ms < 2147483000) setTimeout(() => { const y = window.scrollY; zeigen(); window.scrollTo(0, y); }, ms); } }));
zeigen();
</script>
