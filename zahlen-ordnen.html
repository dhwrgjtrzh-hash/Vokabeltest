<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahlen ordnen</title>
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1b2433; --mute:#64708a; --line:#dfe5ef;
  --accent:#2f5bea; --accent-soft:#e8eeff; --good:#127a3c; --good-bg:#dcf5e4; --bad:#b42318; --bad-bg:#fde4e1;
  --sol:#8a3c06; --sol-bg:#fff1e3; --star:#f5a400;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:18px 16px 48px}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{min-width:48px;height:48px;padding:0 8px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;flex:none}
header h1{font-size:1.5rem;margin:0;line-height:1.15}
header h1 small{display:block;font-size:.8rem;font-weight:600;color:var(--mute)}
header .grow{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 2px 8px rgba(27,36,51,.05)}
.sub{color:var(--mute);margin:0 0 16px}
h2{font-size:1.2rem;margin:0 0 6px}

/* Brüche */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .08em;font-size:.82em;font-weight:inherit}
.fr>span{display:block;padding:0 .14em;text-align:center}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding-bottom:.07em}
.fr>span:last-child{padding-top:.07em}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:6px;vertical-align:middle}
.fin i{display:block;width:100%;height:4px;border-radius:2px;background:var(--ink)}
.fin input.ans{width:3.6em;padding:6px 8px}
.eq{font-size:1.8rem;font-weight:800;color:#a3adbf;margin:0 4px}
.fd{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.fd .lab{display:block;font-size:.8rem;color:var(--mute);font-weight:700;text-align:center;margin-bottom:4px}

/* Start */
.who{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:22px}
.who label{font-weight:700}
.who .ans{width:6.5em}
.who .note{color:var(--mute);font-size:.88rem;flex-basis:100%;margin:0}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.topic{--c:#2f5bea;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:14px 14px;cursor:pointer;min-height:92px}
.topic .ic{font-size:1.6rem;line-height:1}
.topic b{display:block;font-size:1.05rem;margin-bottom:2px}
.topic span{display:block;color:var(--mute);font-size:.85rem;line-height:1.3}
.topic:active{transform:scale(.98)}
.topic.mix{background:var(--accent-soft)}
.teacher{margin-top:22px;text-align:right}
.linkish{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:4px}

/* Aufgaben */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-weight:700;border:0;border-radius:14px;padding:14px 26px;background:var(--accent);color:#fff;cursor:pointer;min-height:54px;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:8px 14px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.4}
.progress{display:flex;gap:6px;margin:0 0 16px}
.progress i{flex:1;height:10px;border-radius:999px;background:var(--line)}
.progress i.ok{background:#3fbf6f}.progress i.half{background:#f5c04a}.progress i.no{background:#ef7b6f}.progress i.now{background:var(--accent)}
.qtype{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;margin-bottom:12px;background:var(--accent-soft);color:#24439e}
.q{font-size:1.3rem;margin:0 0 14px;font-weight:600}
.big{font-size:2.3rem;font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;margin:4px 0 20px}
.big.words{font-size:1.4rem;line-height:1.5}
input.ans{font:inherit;font-size:1.6rem;font-weight:800;width:9em;max-width:100%;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none}
input.ans.small{width:5.2em}
input.ans:focus{outline:none;border-color:var(--accent)}
input.ans.ok{border-color:#3fbf6f;background:var(--good-bg)}
input.ans.no{border-color:#ef7b6f;background:var(--bad-bg)}
.two{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.two .x{color:var(--accent)}
.seq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:6px}
.seq .given{padding:8px 4px}
.seq .arr{color:#a3adbf;font-weight:400}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 20px}
.cmp .slot{color:#a3adbf;min-width:1.2em;text-align:center}
.cmpbtns{display:flex;gap:12px;flex-wrap:wrap}
.cmpbtns button{font-size:2rem;font-weight:800;min-width:84px;height:72px;padding:0 14px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
.cmpbtns.words button{font-size:1.25rem}
.cmpbtns button.ok{border-color:#3fbf6f;background:var(--good-bg)}
.cmpbtns button.no{border-color:#ef7b6f;background:var(--bad-bg)}
.order .lbl{font-size:.85rem;font-weight:700;color:var(--mute);margin:0 0 6px}
.slots{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:84px;padding:10px;border:3px dashed var(--line);border-radius:16px;margin-bottom:14px}
.slots .lt{color:#a3adbf;font-weight:800;font-size:1.4rem}
.slots .ph{color:#a3adbf;font-size:.95rem}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:76px}
.tok{font-size:1.7rem;font-weight:800;min-width:76px;height:68px;padding:0 14px;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
.tok.ok{border-color:#3fbf6f;background:var(--good-bg)}
.tok.no{border-color:#ef7b6f;background:var(--bad-bg)}
.fb{margin-top:18px;border-radius:14px;padding:14px 18px;font-weight:600;display:none;font-size:1.05rem}
.fb.show{display:block}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.sol{background:var(--sol-bg);color:var(--sol)}
.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
svg.nl{width:100%;height:auto;display:block;margin:8px 0 18px;overflow:visible}

/* Stellenwerttafel */
.svt{border-collapse:separate;border-spacing:0;margin:6px 0 20px;font-variant-numeric:tabular-nums;border:2px solid #b9c3d6;border-radius:12px;overflow:hidden}
.svt th,.svt td{border-right:2px solid #dfe5ef;padding:8px 6px;text-align:center;min-width:56px}
.svt th:last-child,.svt td:last-child{border-right:0}
.svt th{background:#eef2fa;font-size:.8rem;color:#45506a;line-height:1.15;border-bottom:2px solid #b9c3d6}
.svt th b{display:block;font-size:1.05rem;color:var(--ink)}
.svt td{font-size:1.7rem;font-weight:800;height:56px;background:#fff}
.svt .dot{border-left:5px solid var(--ink)}
.svt .dec{background:#fbfcff}
.svt th.dec{background:#e6f4ea}

/* Hilfe */
details.help{margin-top:22px;border:2px dashed #c9d3e6;border-radius:14px;padding:4px 16px;background:#fafcff}
details.help summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;color:#24439e}
details.help summary::-webkit-details-marker{display:none}
details.help p{margin:4px 0 12px}
details.help .svt{margin:6px 0 12px}
details.help .svt td{font-size:1.2rem;height:auto}

/* Resultat */
.result{text-align:center}
.result .score{font-size:3.4rem;font-weight:800;margin:4px 0}
.stars{font-size:2.6rem;letter-spacing:.12em;margin:2px 0 8px}
.sent{display:inline-block;margin-top:6px;font-size:.9rem;color:var(--mute)}
.sent.ok{color:var(--good)}
.list{text-align:left;margin:18px auto 0;max-width:600px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.list li b{min-width:26px}

/* Lehrperson */
table.t{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--mute);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
table.t tr.klick{cursor:pointer}
table.t tr.klick:hover td{background:#f6f8fd}
.num{text-align:right!important}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.tag.ok{background:var(--good-bg);color:var(--good)}.tag.half{background:#fff3cd;color:#8a6100}.tag.no{background:var(--bad-bg);color:var(--bad)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:#3fbf6f}
.grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media (min-width:900px){.grid2{grid-template-columns:1.2fr 1fr}}

@media (max-width:560px){
  body{font-size:17px;padding:12px}
  .card{padding:16px;border-radius:18px}
  .big,.cmp{font-size:1.8rem}
  .svt th,.svt td{min-width:38px;padding:6px 3px}
  .svt td{font-size:1.3rem}
  .cmpbtns button{min-width:70px;height:62px}
  .tok{font-size:1.4rem;min-width:64px;height:60px}
}
@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:none;border:0;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">&lt; &gt;</div>
    <h1 class="grow"><small>Mathematik 6 · Thema 7</small>Zahlen ordnen</h1>
    <div class="pill" id="pill" hidden></div>
  </header>
  <main id="app"></main>
</div>

<script>
/* Adresse des Google-Skripts, das die Runden speichert (leer = nichts senden). */
const ENDPOINT = "";
const UEBUNG = "Zahlen ordnen";
const GZKEY = "uebung.gz";

/* Alle Dezimalzahlen intern in Tausendsteln (ganze Zahlen) – so gibt es keine Rundungsfehler. */
const T = 1000;
const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};

function fmt(m, minDec=0){            // Tausendstel -> "12.05"
  const neg = m<0; m=Math.abs(m);
  const whole = Math.floor(m/T), frac = m%T;
  let f = String(frac).padStart(3,"0").replace(/0+$/,"");
  while(f.length<minDec) f+="0";
  const w = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g,"’");
  return (neg?"−":"")+w+(f?"."+f:"");
}
function parse(s){                      // Eingabe -> Tausendstel, null (keine Zahl) oder NaN (zu viele Stellen)
  if(s==null) return null;
  s = String(s).trim().replace(/[\s'’]/g,"").replace(",",".");
  if(s.startsWith(".")) s="0"+s;
  if(!/^\d+(\.\d*)?$/.test(s)) return null;
  const [w,f=""] = s.split(".");
  if(f.replace(/0+$/,"").length>3) return NaN;
  return parseInt(w,10)*T + parseInt((f+"000").slice(0,3),10);
}
function parseInt0(s){ s=String(s||"").trim(); return /^\d+$/.test(s) ? parseInt(s,10) : null; }

/* Brüche */
const gcd = (a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const red = (n,d)=>{ const g=gcd(n,d); return {n:n/g, d:d/g}; };
const fr = (n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const frT = (n,d)=>`${n}/${d}`;
const isTerm = d=>{ while(d%2===0) d/=2; while(d%5===0) d/=5; return d===1; };
const milli = (n,d)=> n*T/d;   // nur bei abbrechenden Brüchen mit höchstens 3 Dezimalen ganzzahlig

/* Stellenwerttafel */
const PLACES = [
  {name:"Tausender",  k:"T", m:1000000},
  {name:"Hunderter",  k:"H", m:100000},
  {name:"Zehner",     k:"Z", m:10000},
  {name:"Einer",      k:"E", m:1000},
  {name:"Zehntel",    k:"z", m:100},
  {name:"Hundertstel",k:"h", m:10},
  {name:"Tausendstel",k:"t", m:1},
];
function svt(digits, from=1){
  const pl = PLACES.slice(from, from+digits.length);
  const th = pl.map(p=>`<th class="${p.m<1000?"dec":""} ${p.m===100?"dot":""}"><b>${p.k}</b>${p.name}</th>`).join("");
  const td = pl.map((p,i)=>`<td class="${p.m<1000?"dec":""} ${p.m===100?"dot":""}">${digits[i]}</td>`).join("");
  return `<div style="overflow-x:auto"><table class="svt"><tr>${th}</tr><tr>${td}</tr></table></div>`;
}

/* Zahlenstrahl: n Abschnitte, Beschriftungen {i:text}, Pfeile {i:label} */
function numberLine(n, labels, arrows, sub=0){
  const W=680,H=130,x0=34,x1=W-34,y=66;
  const total = n*(sub||1);
  const X=i=>x0+(x1-x0)*i/total;
  let ticks="";
  for(let i=0;i<=total;i++){
    const major = sub ? i%sub===0 : true;
    const big = i===0||i===total||(labels && labels[sub?i/sub:i]!==undefined && major);
    const h = big?18:(major?12:7);
    ticks+=`<line x1="${X(i)}" y1="${y-h}" x2="${X(i)}" y2="${y+h}" stroke="#1b2433" stroke-width="${big?3.5:major?2.2:1.4}" stroke-linecap="round"/>`;
  }
  let lab="";
  for(const [i,t] of Object.entries(labels||{})) lab+=`<text x="${X(sub?i*sub:+i)}" y="${y+50}" text-anchor="middle" font-size="24" font-weight="800" fill="#1b2433" font-family="inherit">${t}</text>`;
  let arr="";
  for(const [i,t] of Object.entries(arrows||{})){
    const x=X(+i);
    arr+=`<path d="M ${x} ${y-22} l -13 -24 h 26 z" fill="#f59f00"/><rect x="${x-4}" y="${y-64}" width="8" height="20" rx="3" fill="#f59f00"/>`;
    if(t) arr+=`<text x="${x}" y="${y-72}" text-anchor="middle" font-size="22" font-weight="800" fill="#c47f00" font-family="inherit">${t}</text>`;
  }
  return `<svg class="nl" viewBox="0 -20 ${W} ${H+20}" role="img" aria-label="Zahlenstrahl">
    <line x1="${x0-14}" y1="${y}" x2="${x1+14}" y2="${y}" stroke="#1b2433" stroke-width="3.5" stroke-linecap="round"/>${ticks}${lab}${arr}</svg>`;
}

const START_NOTE = "Brüche schreibst du in die beiden Kästchen: oben der Zähler, unten der Nenner.";

/* Zahl als Bruch oder Dezimalzahl: {html, txt, v} */
const F = (n,d)=>({html:fr(n,d), txt:frT(n,d), v:n/d});
const D = m=>({html:fmt(m), txt:fmt(m), v:m/T});
const cmpSign = (x,y)=> Math.abs(x-y)<1e-9 ? "=" : x<y ? "<" : ">";
function randFrac(maxD=12, maxV=1.6){
  for(let i=0;i<300;i++){ const d=rnd(2,maxD), n=rnd(1,Math.floor(d*maxV)); if(n%d && gcd(n,d)===1) return {n,d}; }
  return {n:3,d:4};
}
function asForm(n,d){   // gleicher Wert in zufälliger Schreibweise
  const r = red(n,d), opts = [F(r.n,r.d)];
  const k = rnd(2,4); if(r.d*k<=60) opts.push(F(r.n*k,r.d*k));
  if(isTerm(r.d) && (r.n*T)%r.d===0) opts.push(D(milli(r.n,r.d)), D(milli(r.n,r.d)));
  return pick(opts);
}

const TOPICS = {
  bb:{title:"Brüche vergleichen", ic:"⚖️", c:"#d6336c", info:"Welcher Bruch ist grösser?", tb:"TB S. 28, 30",
    help:()=>`<p><b>Gleicher Nenner:</b> Der grössere Zähler gewinnt. ${fr(5,7)} &gt; ${fr(2,7)}<br>
      <b>Gleicher Zähler:</b> Der kleinere Nenner gewinnt (grössere Stücke). ${fr(5,7)} &gt; ${fr(5,12)}</p>
      <p><b>Sonst:</b> Erweitere auf einen gemeinsamen Nenner. ${fr(3,4)} = ${fr(9,12)} und ${fr(4,6)} = ${fr(8,12)} → ${fr(3,4)} &gt; ${fr(4,6)}<br>
      <b>Tipp:</b> Schau, was bis zum Ganzen fehlt. Bei ${fr(7,8)} fehlt ${fr(1,8)}, bei ${fr(5,6)} fehlt ${fr(1,6)} → ${fr(7,8)} ist grösser.</p>`},
  bd:{title:"Bruch und Dezimalzahl", ic:"🔀", c:"#e0732b", info:"Vergleiche Bruch und Dezimalzahl", tb:"TB S. 29, 30",
    help:()=>`<p>Schreibe den Bruch als Dezimalzahl, dann kannst du gut vergleichen.</p>
      <p>${fr(2,5)} = ${fr(4,10)} = 0.4 → ${fr(2,5)} &gt; 0.3<br>${fr(2,3)} = 2 : 3 = 0.666… → 0.6 &lt; ${fr(2,3)}</p>`},
  ord:{title:"Der Grösse nach ordnen", ic:"📶", c:"#13a36b", info:"Ordne Brüche und Dezimalzahlen", tb:"TB S. 29, 30",
    help:()=>`<p>1. Schreibe alle Zahlen als Dezimalzahlen (oder mit gleichem Nenner).<br>2. Vergleiche und ordne – beginne mit der kleinsten Zahl.</p>
      <p>${fr(1,2)}, 0.3, ${fr(1,6)}, ${fr(4,5)} → 0.5, 0.3, 0.166…, 0.8 → <b>${fr(1,6)} &lt; 0.3 &lt; ${fr(1,2)} &lt; ${fr(4,5)}</b></p>`},
  strahl:{title:"Zahlenstrahl", ic:"📏", c:"#0b8ec2", info:"Welche Zahl gehört zum Pfeil?", tb:"TB S. 29",
    help:()=>`<p>Die Strecke von 0 bis 1 ist in 20 gleiche Teile geteilt. Ein kleiner Strich ist ${fr(1,20)} = 0.05.<br>Die langen Striche sind ${fr(1,4)}, ${fr(2,4)} und ${fr(3,4)}.</p>
      <p>Rechne jede Auswahl um: ${fr(3,5)} = ${fr(12,20)} = 0.6 → 12 kleine Striche nach der 0.</p>`},
  kuerz:{title:"Kürzen", ic:"✂️", c:"#7c4dff", info:"Kürze so weit wie möglich", tb:"TB S. 31",
    help:()=>`<p>Teile Zähler und Nenner durch dieselbe Zahl. Mach weiter, bis es nicht mehr geht.</p>
      <p>${fr(50,60)} = ${fr(5,6)} (durch 10) · ${fr(6,9)} = ${fr(2,3)} (durch 3) · ${fr(75,100)} = ${fr(3,4)} (durch 25)</p>`},
};

const GEN = {
  bb(){
    const v = rnd(0,4);
    let a,b;
    if(v===0){ const d=rnd(3,12); let x=rnd(1,d*1.5|0), y=rnd(1,d*1.5|0); if(x===y) y=x+1; a={n:x,d}; b={n:y,d}; }
    else if(v===1){ const n=rnd(1,7); let x=rnd(n+1,14), y=rnd(n+1,14); if(x===y) y=x+1; a={n,d:x}; b={n,d:y}; }
    else if(v===2){ const x=rnd(3,10); let y=rnd(3,10); if(x===y) y=x+1; a={n:x-1,d:x}; b={n:y-1,d:y}; }
    else if(v===3){ const r=randFrac(10,1.4), k=rnd(2,4); a={n:r.n*k,d:r.d*k}; b=r; }
    else { a=randFrac(12,1.6); b=randFrac(12,1.6); if(a.n*b.d===a.d*b.n) b={n:b.n+1,d:b.d}; }
    if(Math.random()<.5) [a,b]=[b,a];
    const s = cmpSign(a.n/a.d, b.n/b.d);
    const ra=red(a.n,a.d), rb=red(b.n,b.d);
    const L = ra.d*rb.d/gcd(ra.d,rb.d);
    return {type:"cmp", q:"Welcher Bruch ist grösser? Setze &lt;, &gt; oder = ein.", a:fr(a.n,a.d), b:fr(b.n,b.d), answer:s,
      text:`${frT(a.n,a.d)} ? ${frT(b.n,b.d)}`, show:`${frT(a.n,a.d)} ${s} ${frT(b.n,b.d)}`, showHtml:`${fr(a.n,a.d)} ${esc(s)} ${fr(b.n,b.d)}`,
      hint: a.d===b.d ? "Gleicher Nenner: Vergleiche die Zähler." : a.n===b.n ? "Gleicher Zähler: Je kleiner der Nenner, desto grösser die Stücke."
        : `Erweitere beide Brüche auf den Nenner ${L}.`};
  },
  bd(){
    const pool = [[1,3],[2,3],[1,6],[5,6],[1,7],[3,8],[5,8],[7,8],[1,8],[2,5],[3,5],[4,5],[3,4],[1,4],[7,20],[9,20],[13,20],[7,5],[5,4],[11,10],[3,2],[14,20],[6,25],[11,3],[21,10],[13,8]];
    const [n,d] = pick(pool);
    const v = n/d;
    let m;
    const term = isTerm(d) && (n*T)%d===0;
    if(term && Math.random()<.25) m = milli(n,d);
    else {
      const off = pick([-1,1]) * pick([10,50,100,5,20]);
      m = Math.max(5, Math.round(v*T/5)*5 + off);
      if(Math.abs(m/T - v)<1e-9) m += 10;
    }
    let a = {html:fr(n,d), txt:frT(n,d), v}, b = D(m);
    if(Math.random()<.5) [a,b]=[b,a];
    const s = cmpSign(a.v,b.v);
    return {type:"cmp", q:"Vergleiche. Setze &lt;, &gt; oder = ein.", a:a.html, b:b.html, answer:s,
      text:`${a.txt} ? ${b.txt}`, show:`${a.txt} ${s} ${b.txt}`, showHtml:`${a.html} ${esc(s)} ${b.html}`,
      hint: term ? `Schreibe ${frT(n,d)} als Dezimalzahl: ${frT(n,d)} = ${n} : ${d}.` : `Rechne ${n} : ${d} – das Resultat hat unendlich viele Stellen. Die ersten zwei oder drei reichen zum Vergleichen.`};
  },
  ord(){
    for(let tries=0; tries<200; tries++){
      const items = [];
      const nF = rnd(2,3);
      for(let i=0;i<nF;i++){ const f=randFrac(10, pick([1,1,1.6])); items.push(F(f.n,f.d)); }
      while(items.length<4){ items.push(D(rnd(1,190)*5 + (Math.random()<.3?1000:0))); }
      const vs = items.map(x=>x.v).sort((a,b)=>a-b);
      if(vs.some((x,i)=>i && x-vs[i-1]<0.015)) continue;
      shuffle(items);
      const sorted = items.slice().sort((a,b)=>a.v-b.v);
      return {type:"order", html:`<p class="q">Ordne die Zahlen der Grösse nach. Beginne mit der kleinsten Zahl.</p>`, items,
        text:`Ordnen: ${items.map(x=>x.txt).join(", ")}`, show:sorted.map(x=>x.txt).join(" < "), showHtml:sorted.map(x=>x.html).join(" &lt; "),
        hint:"Schreibe jeden Bruch zuerst als Dezimalzahl (Zähler : Nenner). Dann kannst du gut vergleichen."};
    }
  },
  strahl(){
    const k = rnd(1,19);
    const right = asForm(k,20);
    const cands = shuffle([k-1,k+1,k-2,k+2,k+4,k-4,k+5,k-5,20-k].filter(x=>x>0 && x<20 && x!==k)).slice(0,3);
    const opts = shuffle([{...right, ok:true}, ...cands.map(c=>({...asForm(c,20), ok:false}))]);
    const html = `<p class="q">Welche Zahl zeigt der Pfeil?</p>` + numberLine(4, {0:"0",4:"1"}, {[k]:""}, 5);
    const ri = opts.findIndex(o=>o.ok);
    const r = red(k,20);
    return {type:"choice", html, options:opts.map(o=>({label:o.html})), answer:ri,
      text:`Pfeil bei ${k}/20, Auswahl: ${opts.map(o=>o.txt).join(", ")}`, show:`${right.txt} (= ${frT(r.n,r.d)} = ${fmt(milli(k,20))})`,
      showHtml:`${right.html} = ${fr(r.n,r.d)} = ${fmt(milli(k,20))}`,
      hint:`Ein kleiner Strich ist ${frT(1,20)} = 0.05. Zähle die kleinen Striche von 0 bis zum Pfeil.`};
  },
  kuerz(){
    const r = randFrac(12, pick([1,1,1.5]));
    const k = pick([2,3,4,5,6,8,10,12,25]);
    const n = r.n*k, d = r.d*k;
    return {type:"frac", html:`<p class="q">Kürze so weit wie möglich.</p>`, lead:fr(n,d), answer:r, reduced:true,
      text:`${frT(n,d)} kürzen`, show:frT(r.n,r.d), showHtml:fr(r.n,r.d),
      hint:`Zähler und Nenner lassen sich beide durch ${k} teilen.`};
  },
};

const app = document.getElementById("app"), pill = document.getElementById("pill");
const ROUND = 10;
let S = null;
let gz = (store.get(GZKEY)||store.get("dz.gz")||"").replace(/\D/g,"");

    start(b.dataset.k);

function start(k){
  const keys = Object.keys(TOPICS);
  const list = [];
  for(let i=0;i<ROUND;i++) list.push(k==="mix" ? keys[i%keys.length] : k);
  if(k==="mix") shuffle(list);
  S = {topic:k, list, i:0, points:0, log:[], started:new Date()};
  next();
}

function next(){
  if(S.i>=ROUND) return result();
  S.task = GEN[S.list[S.i]]();
  S.task.topic = S.list[S.i];
  S.tries = 0; S.done = false; S.inputs = [];
  draw();
}

function progressBar(){
  let h = "";
  for(let i=0;i<ROUND;i++){
    const l = S.log[i];
    h += `<i class="${l? (l.p===1?"ok":l.p>0?"half":"no") : i===S.i?"now":""}"></i>`;
  }
  return `<div class="progress">${h}</div>`;
}

const inp = (id, cls="", mode="decimal")=>`<input class="ans ${cls}" id="${id}" inputmode="${mode}" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="?">`;
const fracInput = (a,b)=>`<span class="fin">${inp(a,"small","numeric")}<i></i>${inp(b,"small","numeric")}</span>`;

function draw(){
  const t = S.task, top = TOPICS[t.topic];
  pill.hidden = false; pill.textContent = `Nr. ${gz} · ${S.points} ⭐`;
  let body = "", needsCheck = true;
  if(t.type==="input"){
    body = t.html + inp("a0");
  }else if(t.type==="two"){
    body = t.html + `<div class="two">${inp("a0","small")}<span>&lt;</span><span class="x">${t.mid}</span><span>&lt;</span>${inp("a1","small")}</div>`;
  }else if(t.type==="seq"){
    body = t.html + `<div class="seq">${t.given.map(v=>`<span class="given">${fmt(v)}</span><span class="arr">→</span>`).join("")}
      ${t.answers.map((_,j)=>inp("a"+j,"small")+(j<t.answers.length-1?'<span class="arr">→</span>':"")).join("")}</div>`;
  }else if(t.type==="frac"){
    body = t.html + `<div class="fd">${t.lead?`<span class="big" style="margin:0">${t.lead}</span><span class="eq">=</span>`:""}${fracInput("a0","a1")}</div>`;
  }else if(t.type==="fracdec"){
    body = t.html + `<div class="fd">${t.lead?`<span class="big" style="margin:0">${t.lead}</span><span class="eq">=</span>`:""}
      <span><span class="lab">Bruch${t.reduced?" (gekürzt)":""}</span>${fracInput("a0","a1")}</span><span class="eq">=</span>
      <span><span class="lab">Dezimalzahl</span>${inp("a2","small")}</span></div>`;
  }else if(t.type==="cmp"){
    needsCheck = false;
    body = `<p class="q">${t.q||"Setze das richtige Zeichen ein."}</p>
      <div class="cmp"><span>${t.a}</span><span class="slot" id="slot">?</span><span>${t.b}</span></div>
      <div class="cmpbtns">${["<","=",">"].map(c=>`<button data-c="${c}">${c==="<"?"&lt;":c===">"?"&gt;":"="}</button>`).join("")}</div>`;
  }else if(t.type==="choice"){
    needsCheck = false;
    body = t.html + `<div class="cmpbtns ${t.words?"words":""}">${t.options.map((o,j)=>`<button data-c="${j}">${o.label}</button>`).join("")}</div>`;
  }else if(t.type==="order"){
    body = t.html + `<div class="order"><p class="lbl">Tippe die Zahlen der Reihe nach an – zuerst die ${t.desc?"grösste":"kleinste"}:</p>
      <div class="slots" id="slots"><span class="ph">${t.desc?"grösste":"kleinste"} … ${t.desc?"kleinste":"grösste"}</span></div>
      <div class="pool" id="pool">${t.items.map((it,j)=>`<button class="tok" data-j="${j}">${it.html}</button>`).join("")}</div></div>`;
  }
  app.innerHTML = `${progressBar()}
    <div class="card">
      <span class="qtype" style="background:${top.c}1a;color:${top.c}">${top.ic} ${top.title} · Aufgabe ${S.i+1} von ${ROUND}</span>
      ${body}
      <div class="fb" id="fb"></div>
      <div class="actions">
        ${needsCheck?`<button class="btn" id="check">Prüfen</button>`:""}
        ${t.type==="order"?`<button class="btn ghost" id="reset">↺ Neu ordnen</button>`:""}
        <button class="btn" id="nextBtn" hidden>Weiter →</button>
      </div>
      <details class="help"><summary>💡 So geht's</summary>${top.help()}</details>
    </div>
    <div class="actions no-print"><button class="btn ghost small" id="quit">✕ Runde beenden</button></div>`;
  const inputs = [...app.querySelectorAll("input.ans")];
  inputs.forEach((el,j)=>el.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault();
      if(S.done) return next2();
      if(j<inputs.length-1 && !inputs[j+1].value) inputs[j+1].focus(); else check(); }
  }));
  if(inputs[0]) inputs[0].focus({preventScroll:true});
  const c = document.getElementById("check"); if(c) c.onclick = ()=>check();
  app.querySelectorAll(".cmpbtns button").forEach(b=>b.onclick=()=>check(b.dataset.c, b));
  if(t.type==="order") setupOrder();
  document.getElementById("nextBtn").onclick = next2;
  document.getElementById("quit").onclick = ()=>{ if(!S.log.length && !S.tries) home(); else result(true); };
}

function setupOrder(){
  const t = S.task, slots = document.getElementById("slots"), pool = document.getElementById("pool");
  S.order = [];
  const paint = ()=>{
    slots.innerHTML = S.order.length ? S.order.map((j,k)=>`${k?'<span class="lt">'+(t.desc?"&gt;":"&lt;")+'</span>':""}<button class="tok" data-j="${j}">${t.items[j].html}</button>`).join("")
      : `<span class="ph">${t.desc?"grösste":"kleinste"} … ${t.desc?"kleinste":"grösste"}</span>`;
    pool.innerHTML = t.items.map((it,j)=> S.order.includes(j) ? "" : `<button class="tok" data-j="${j}">${it.html}</button>`).join("");
    slots.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ if(S.done) return; S.order = S.order.filter(x=>x!==+b.dataset.j); paint(); });
    pool.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ if(S.done) return; S.order.push(+b.dataset.j); paint(); });
    const c = document.getElementById("check"); if(c) c.disabled = S.order.length!==t.items.length;
  };
  S.paintOrder = paint;
  document.getElementById("reset").onclick = ()=>{ if(S.done) return; S.order=[]; paint(); document.getElementById("fb").className="fb"; };
  paint();
}

function feedback(kind, text){
  const fb = document.getElementById("fb");
  fb.className = "fb show "+kind; fb.innerHTML = text;
}

function check(choice, btn){
  if(S.done) return;
  const t = S.task;
  let ok = false, extra = "";
  const inputs = [...app.querySelectorAll("input.ans")];
  if(t.type==="cmp" || t.type==="choice"){
    const want = t.type==="cmp" ? t.answer : String(t.answer);
    ok = choice===want;
    app.querySelectorAll(".cmpbtns button").forEach(b=>b.classList.remove("no"));
    btn.classList.add(ok?"ok":"no");
    if(t.type==="cmp") document.getElementById("slot").textContent = choice;
    S.inputs.push(t.type==="cmp" ? choice : btn.textContent.trim());
    S.tries++;
  }else if(t.type==="order"){
    if(S.order.length!==t.items.length){ feedback("bad","Tippe zuerst alle Zahlen an."); return; }
    const vals = S.order.map(j=>t.items[j].v);
    ok = vals.every((v,k)=>k===0 || (t.desc ? vals[k-1]>v : vals[k-1]<v));
    S.inputs.push(S.order.map(j=>t.items[j].txt).join(t.desc?" > ":" < "));
    S.tries++;
    const sorted = t.items.map((_,j)=>j).sort((a,b)=> t.desc ? t.items[b].v-t.items[a].v : t.items[a].v-t.items[b].v);
    document.querySelectorAll("#slots .tok").forEach((b,k)=>b.classList.add(+b.dataset.j===sorted[k]?"ok":"no"));
  }else{
    if(inputs.some(el=>!el.value.trim())){ feedback("bad","Bitte fülle zuerst alles aus."); return; }
    const res = [];
    let invalid = "";
    if(t.type==="frac" || t.type==="fracdec"){
      const n = parseInt0(inputs[0].value), d = parseInt0(inputs[1].value);
      if(n===null || d===null || d===0){ invalid = "Schreibe beim Bruch oben und unten eine ganze Zahl (unten nicht 0)."; inputs[0].classList.toggle("no",n===null); inputs[1].classList.toggle("no",d===null||d===0); }
      else{
        const want = t.type==="frac" ? t.answer : t.frac;
        const same = n*want.d === d*want.n;
        const isRed = gcd(n,d)===1;
        const fok = same && (!t.reduced || isRed);
        res.push(fok, fok);
        if(same && t.reduced && !isRed) extra = "Der Wert stimmt, aber du kannst den Bruch noch kürzen.";
      }
      if(t.type==="fracdec" && !invalid){
        const v = parse(inputs[2].value);
        if(v===null || Number.isNaN(v)){ invalid = "Bei der Dezimalzahl: Schreibe zum Beispiel 0.75"; inputs[2].classList.add("no"); }
        else res.push(v===t.dec);
      }
    }else{
      const vals = inputs.map(el=>parse(el.value));
      if(vals.some(v=>v===null||Number.isNaN(v))){
        inputs.forEach((el,j)=>el.classList.toggle("no", vals[j]===null||Number.isNaN(vals[j])));
        invalid = vals.some(Number.isNaN) ? "Höchstens drei Stellen nach dem Punkt." : "Das ist keine gültige Zahl. Schreibe zum Beispiel 4.25";
      } else {
        const want = t.type==="input" ? [t.answer] : t.answers;
        vals.forEach((v,j)=>res.push(v===want[j]));
      }
    }
    if(invalid){ feedback("bad", invalid); return; }   // zählt nicht als Versuch
    inputs.forEach((el,j)=>{ el.classList.toggle("ok",res[j]); el.classList.toggle("no",!res[j]); });
    ok = res.every(Boolean);
    S.inputs.push(t.type==="frac" ? `${inputs[0].value.trim()}/${inputs[1].value.trim()}`
      : t.type==="fracdec" ? `${inputs[0].value.trim()}/${inputs[1].value.trim()} = ${inputs[2].value.trim()}`
      : inputs.map(el=>el.value.trim()).join(" | "));
    S.tries++;
  }
  if(ok){
    const pts = S.tries===1?1:0.5;
    S.points += pts;
    feedback("good", S.tries===1? pick(["Super! ⭐","Richtig! ⭐","Genau! ⭐","Stark! ⭐","Perfekt! ⭐"]) : "Richtig im zweiten Versuch – ½ ⭐");
    finish(pts);
  }else if(S.tries<2){
    feedback("bad", (extra? extra+" " : "Noch nicht ganz. ")+"💡 "+t.hint+" Versuch es nochmals.");
    if(t.type==="order"){ setTimeout(()=>{ if(!S.done){ S.order=[]; S.paintOrder(); } }, 1400); }
    const firstWrong = inputs.find(el=>el.classList.contains("no"));
    if(firstWrong) firstWrong.select();
  }else{
    feedback("sol", `Richtig wäre: <b>${t.showHtml||esc(t.show)}</b>`);
    if(t.type==="cmp") app.querySelectorAll(".cmpbtns button").forEach(b=>{ if(b.dataset.c===t.answer) b.classList.add("ok"); });
    if(t.type==="choice") app.querySelectorAll(".cmpbtns button").forEach(b=>{ if(b.dataset.c===String(t.answer)) b.classList.add("ok"); });
    finish(0);
  }
}

function finish(p){
  S.done = true;
  S.log.push({nr:S.i+1, thema:TOPICS[S.task.topic].title, frage:S.task.text, antworten:S.inputs.slice(), loesung:S.task.show, p});
  app.querySelectorAll("input.ans").forEach(el=>el.readOnly=true);
  app.querySelectorAll(".cmpbtns button").forEach(b=>b.disabled=true);
  const c=document.getElementById("check"); if(c) c.hidden=true;
  const r=document.getElementById("reset"); if(r) r.hidden=true;
  const n=document.getElementById("nextBtn"); n.hidden=false; n.focus({preventScroll:true});
  if(S.i===ROUND-1) n.textContent = "Zum Resultat →";
  pill.textContent = `Nr. ${gz} · ${S.points} ⭐`;
}
function next2(){ S.i++; next(); }

/* ---------- Senden ---------- */
const QKEY = "uebung.queue";
function queue(){ try{ return JSON.parse(store.get(QKEY)||"[]"); }catch(e){ return []; } }
function sendOne(rec){
  return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
    .then(r=>r.text()).then(t=>{ if(!/"ok"\s*:\s*true/.test(t)) throw new Error("abgelehnt"); });
}
async function flush(){
  if(!ENDPOINT) return true;
  let q = queue(), rest = [];
  for(const rec of q){ try{ await sendOne(rec); }catch(e){ rest.push(rec); } }
  store.set(QKEY, JSON.stringify(rest));
  return rest.length===0;
}
function submit(){
  if(!ENDPOINT || !S.log.length) return Promise.resolve(null);
  const rec = {typ:"uebung-runde", v:1, uebung:UEBUNG, glueckszahl:gz,
    thema: S.topic==="mix" ? "Alles gemischt" : TOPICS[S.topic].title,
    datum:S.started.toISOString(), punkte:S.points, max:S.log.length,
    aufgaben:S.log.map(l=>({nr:l.nr, thema:l.thema, frage:l.frage, antworten:l.antworten, loesung:l.loesung, punkte:l.p}))};
  const q = queue(); q.push(rec); store.set(QKEY, JSON.stringify(q.slice(-30)));
  return flush();
}

function result(early){
  pill.hidden = true;
  const n = S.log.length, p = S.points;
  const ratio = n ? p/n : 0;
  const stars = !n ? "" : ratio>=.9?"⭐⭐⭐":ratio>=.6?"⭐⭐":ratio>=.3?"⭐":"";
  const msg = !n ? "Keine Aufgabe gelöst." : ratio>=.9?"Hervorragend!":ratio>=.6?"Gut gemacht!":ratio>=.3?"Weiter üben lohnt sich!":"Schau dir «💡 So geht's» an und probier es nochmals.";
  const t = S.topic==="mix" ? "Alles gemischt" : TOPICS[S.topic].title;
  app.innerHTML = `<div class="card result">
    <p class="sub" style="margin:0">${t} · Glückszahl ${esc(gz)}</p>
    <div class="score">${String(p).replace(".5","½")} / ${n}</div>
    <div class="stars">${stars||"🙂"}</div>
    <p style="font-weight:700;margin:0">${msg}</p>
    <span class="sent" id="sent">${ENDPOINT && n ? "Wird an die Lehrperson geschickt …" : ""}</span>
    <ul class="list">${S.log.map(l=>`<li><b>${l.nr}.</b><span>${l.p===1?"✅":l.p>0?"☑️":"❌"} ${esc(l.thema)} – <b>${esc(l.loesung)}</b></span></li>`).join("")}</ul>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="again">Nochmals</button>
      <button class="btn ghost" id="menu">Anderes Thema</button>
    </div>
  </div>`;
  document.getElementById("again").onclick=()=>start(S.topic);
  document.getElementById("menu").onclick=home;
  submit().then(ok=>{
    const el = document.getElementById("sent"); if(!el || ok===null) return;
    if(ok){ el.textContent = "✓ Bei der Lehrperson angekommen"; el.className="sent ok"; }
    else el.textContent = "Konnte noch nicht gesendet werden – wird beim nächsten Mal automatisch nachgeschickt.";
  });
}

/* ---------- Lehrperson ---------- */
let TD = null;
function teacher(){
  if(!ENDPOINT){ alert("Die Auswertung ist noch nicht eingerichtet."); return; }
  const code = prompt("Passwort der Lehrperson:");
  if(code===null) return;
  const btn = document.getElementById("teach"); if(btn){ btn.textContent="lädt …"; btn.disabled=true; }
  const cb = "uecb"+Date.now();
  const s = document.createElement("script");
  let fertig = false;
  const reset = ()=>{ if(btn){ btn.textContent="Lehrperson"; btn.disabled=false; } };
  window[cb] = d=>{ fertig=true; delete window[cb]; s.remove(); reset();
    if(!d || !d.ok){ alert((d&&d.fehler)||"Keine Antwort."); return; }
    TD = d; teacherView(); };
  s.onerror = ()=>{ if(!fertig){ reset(); alert("Die Tabelle ist nicht erreichbar."); } };
  s.src = ENDPOINT+"?uebung="+encodeURIComponent(UEBUNG)+"&code="+encodeURIComponent(code.trim())+"&callback="+cb;
  document.head.appendChild(s);
  setTimeout(()=>{ if(!fertig){ reset(); } }, 20000);
}
const dt = iso=>{ const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}); };
const pct = (p,m)=> m? Math.round(p/m*100) : 0;
function teacherView(filter){
  pill.hidden = true;
  const R = (TD.runden||[]).slice().sort((a,b)=>String(b.zeit).localeCompare(String(a.zeit)));
  const by = {};
  R.forEach(r=>{ const g=by[r.glueckszahl]||(by[r.glueckszahl]={n:0,p:0,m:0,last:r.zeit}); g.n++; g.p+=+r.punkte; g.m+=+r.max; });
  const kids = Object.entries(by).sort((a,b)=>(+a[0])-(+b[0]));
  const th = {};
  R.forEach(r=>(r.aufgaben||[]).forEach(a=>{ const s=th[a.thema]||(th[a.thema]={n:0,p:0}); s.n++; s.p+=+a.punkte; }));
  const themen = Object.entries(th).sort((a,b)=>a[1].p/a[1].n-b[1].p/b[1].n);
  const rows = R.filter(r=>!filter || r.glueckszahl===filter);
  app.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Resultate · ${esc(UEBUNG)}</h2>
      <div class="row no-print"><a class="btn ghost small" href="${esc(TD.tabelle||"#")}" target="_blank" rel="noopener">Google-Tabelle</a>
      <button class="btn ghost small" id="tprint">Drucken</button><button class="btn ghost small" id="tclose">Schliessen</button></div>
    </div>
    <p class="sub" style="margin-top:6px">${R.length} Runden von ${kids.length} Glückszahlen.</p>
    <div class="grid2">
      <div><h2>Pro Glückszahl</h2>
        <table class="t"><tr><th>Zahl</th><th class="num">Runden</th><th>richtig</th><th>zuletzt</th></tr>
        ${kids.map(([k,g])=>`<tr class="klick" data-gz="${esc(k)}"><td><b>${esc(k)}</b></td><td class="num">${g.n}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar"><i style="width:${pct(g.p,g.m)}%"></i></div>${pct(g.p,g.m)}%</div></td><td>${dt(g.last)}</td></tr>`).join("") || `<tr><td colspan="4">Noch keine Runden.</td></tr>`}
        </table></div>
      <div><h2>Was macht Mühe?</h2>
        <table class="t"><tr><th>Thema</th><th class="num">Aufgaben</th><th>richtig</th></tr>
        ${themen.map(([k,s])=>`<tr><td>${esc(k)}</td><td class="num">${s.n}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar"><i style="width:${pct(s.p,s.n)}%"></i></div>${pct(s.p,s.n)}%</div></td></tr>`).join("")}
        </table></div>
    </div>
    <h2 style="margin-top:22px">Runden ${filter?`von Glückszahl ${esc(filter)} <button class="linkish" id="tall">alle zeigen</button>`:""}</h2>
    <table class="t"><tr><th>Zeit</th><th>Zahl</th><th>Thema</th><th class="num">Punkte</th><th></th></tr>
    ${rows.map(r=>`<tr class="klick" data-i="${R.indexOf(r)}"><td>${dt(r.zeit)}</td><td><b>${esc(r.glueckszahl)}</b></td><td>${esc(r.thema)}</td><td class="num">${String(r.punkte).replace(".5","½")} / ${r.max}</td><td>›</td></tr>`).join("")}
    </table>
    <div id="detail"></div>
  </div>`;
  document.getElementById("tclose").onclick = ()=>{ TD=null; home(); };
  document.getElementById("tprint").onclick = ()=>print();
  const all = document.getElementById("tall"); if(all) all.onclick=()=>teacherView();
  app.querySelectorAll("tr[data-gz]").forEach(tr=>tr.onclick=()=>teacherView(tr.dataset.gz));
  app.querySelectorAll("tr[data-i]").forEach(tr=>tr.onclick=()=>{
    const r = R[+tr.dataset.i];
    const d = document.getElementById("detail");
    d.innerHTML = `<h2 style="margin-top:22px">Glückszahl ${esc(r.glueckszahl)} · ${esc(r.thema)} · ${dt(r.zeit)}</h2>
      <table class="t"><tr><th>Nr.</th><th>Aufgabe</th><th>Antwort(en)</th><th>Lösung</th><th></th></tr>
      ${(r.aufgaben||[]).map(a=>`<tr><td>${a.nr}</td><td>${esc(a.frage)}</td><td>${(a.antworten||[]).map(esc).join("<br>")}</td><td><b>${esc(a.loesung)}</b></td>
        <td><span class="tag ${a.punkte===1?"ok":a.punkte>0?"half":"no"}">${a.punkte===1?"1":a.punkte>0?"½":"0"}</span></td></tr>`).join("")}
      </table>`;
    d.scrollIntoView({behavior:"smooth"});
  });
}

home();
flush();
</script>
</body>
</html>
