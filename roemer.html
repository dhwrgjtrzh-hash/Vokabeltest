<!doctype html><html lang="de-CH"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Römer-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Asap:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#F1EFE9; --surface:#FFFFFF; --surface-2:#E8E4DA; --sunk:#DFDACE;
  --ink:#23252B; --ink-2:#5A5B62; --ink-3:#87868C;
  --accent:#1F3A5F; --accent-soft:#DCE4EE; --accent-ink:#FFFFFF;
  --gold:#A8752A; --gold-soft:#F3E7CE;
  --good:#3F6B33; --good-soft:#DDEAD5;
  --bad:#9C3D2C; --bad-soft:#F4DFD9;
  --line:#D6D1C5; --shadow:0 1px 2px rgba(35,37,43,.06),0 8px 24px -14px rgba(35,37,43,.28);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14161B; --surface:#1C1F26; --surface-2:#242830; --sunk:#0F1116;
    --ink:#E9E7E1; --ink-2:#AFAEB4; --ink-3:#84838A;
    --accent:#8CB2DA; --accent-soft:#22303F; --accent-ink:#10151C;
    --gold:#E0B45E; --gold-soft:#332A18;
    --good:#8FBE79; --good-soft:#1D2A1A;
    --bad:#E08A72; --bad-soft:#2E1B16;
    --line:#333844; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#14161B; --surface:#1C1F26; --surface-2:#242830; --sunk:#0F1116;
  --ink:#E9E7E1; --ink-2:#AFAEB4; --ink-3:#84838A;
  --accent:#8CB2DA; --accent-soft:#22303F; --accent-ink:#10151C;
  --gold:#E0B45E; --gold-soft:#332A18;
  --good:#8FBE79; --good-soft:#1D2A1A;
  --bad:#E08A72; --bad-soft:#2E1B16;
  --line:#333844; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Asap","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:18px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:940px; margin:0 auto; padding:0 18px 64px}

/* ---------- Kopf ---------- */
header.top{
  background:var(--accent); color:var(--accent-ink);
  border-bottom:3px solid var(--gold);
}
@media (prefers-color-scheme:dark){ header.top{color:#0F1319} }
.top-in{max-width:940px; margin:0 auto; padding:20px 18px 18px; display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; gap:2px}
.eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; opacity:.78; font-weight:600}
h1{font-family:"Cinzel",Georgia,serif; font-weight:700; font-size:clamp(28px,6vw,40px);
   margin:0; letter-spacing:.04em; text-wrap:balance}
.score-pill{
  margin-left:auto; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:8px 16px; font-weight:600; font-variant-numeric:tabular-nums;
  display:flex; align-items:baseline; gap:8px; white-space:nowrap;
}
@media (prefers-color-scheme:dark){ .score-pill{background:rgba(0,0,0,.18); border-color:rgba(0,0,0,.3)} }
.score-pill b{font-size:22px}

/* ---------- Startseite ---------- */
.lead{margin:26px 0 22px; color:var(--ink-2); max-width:62ch}
.group-title{font-family:"Cinzel",Georgia,serif; font-size:20px; letter-spacing:.03em; margin:28px 0 12px; color:var(--accent)}
.tessera.small{font-size:16px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.card{
  display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; cursor:pointer; font:inherit; color:inherit;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.card:hover{border-color:var(--accent); box-shadow:var(--shadow)}
.card:active{transform:scale(.985)}
.tessera{
  flex:0 0 auto; width:48px; height:48px; border-radius:6px;
  background:var(--accent-soft); color:var(--accent);
  display:grid; place-items:center; font-family:"Cinzel",Georgia,serif;
  font-weight:700; font-size:19px; letter-spacing:.02em;
}
.card.done .tessera{background:var(--good-soft); color:var(--good)}
.card-body{min-width:0; flex:1}
.card h3{margin:2px 0 4px; font-size:19px; font-weight:700; line-height:1.25}
.card p{margin:0 0 8px; font-size:15px; color:var(--ink-2)}
.chip{
  display:inline-block; font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px;
  background:var(--surface-2); color:var(--ink-2); font-variant-numeric:tabular-nums;
}
.chip.ok{background:var(--good-soft); color:var(--good)}
.tools{margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.note{margin-top:26px; font-size:14px; color:var(--ink-3); max-width:62ch}

/* ---------- Übungsansicht ---------- */
.ex-head{display:flex; align-items:center; gap:14px; margin:22px 0 6px; flex-wrap:wrap}
.ex-head h2{font-family:"Cinzel",Georgia,serif; font-size:clamp(20px,4.4vw,27px); margin:0; letter-spacing:.02em}
.bar{height:8px; background:var(--sunk); border-radius:999px; overflow:hidden; margin:14px 0 22px}
.bar i{display:block; height:100%; background:var(--gold); border-radius:999px; transition:width .3s ease}
.q{font-size:clamp(19px,3.6vw,23px); font-weight:600; margin:0 0 16px; text-wrap:balance}
.hint{color:var(--ink-2); font-size:16px; margin:-8px 0 16px}
.opts{display:grid; gap:10px}
.opt{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  background:var(--surface); border:2px solid var(--line); border-radius:var(--r);
  padding:15px 16px; font:inherit; font-weight:500; color:inherit; cursor:pointer; min-height:58px;
  transition:border-color .12s ease, background .12s ease;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .mark{flex:0 0 auto; width:26px; font-weight:700; color:var(--ink-3)}
.opt.good{border-color:var(--good); background:var(--good-soft)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.good .mark,.opt.bad .mark{color:inherit}
.tf{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tf .opt{justify-content:center; font-size:20px; font-weight:700; min-height:70px}

.feedback{
  margin-top:16px; border-radius:var(--r); padding:14px 16px; font-size:16px;
  border-left:5px solid var(--ink-3); background:var(--surface-2);
}
.feedback.good{border-color:var(--good); background:var(--good-soft)}
.feedback.bad{border-color:var(--bad); background:var(--bad-soft)}
.feedback b{display:block; margin-bottom:2px}

/* Bildaufgabe */
.photo{width:100%; max-width:460px; margin:0 auto 18px; display:block; border-radius:var(--r);
  border:1px solid var(--line); box-shadow:var(--shadow)}

/* Eingabe */
.input-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
input[type="text"]{
  flex:1 1 200px; min-width:0; font:inherit; font-size:24px; font-weight:700;
  font-family:"Cinzel",Georgia,serif; letter-spacing:.06em; text-align:center;
  padding:14px 12px; border-radius:var(--r); border:2px solid var(--line);
  background:var(--surface); color:var(--ink);
}
input[type="text"]:focus{outline:none; border-color:var(--accent)}
.keypad{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.key{
  font:inherit; font-family:"Cinzel",Georgia,serif; font-weight:700; font-size:19px;
  min-width:52px; padding:10px 0; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); cursor:pointer;
}
.key:active{background:var(--accent-soft)}
.key.wide{min-width:96px; font-family:inherit; font-size:15px}

/* Sortieren */
.sortlist{display:grid; gap:8px; counter-reset:s}
.sortrow{
  display:flex; align-items:center; gap:10px; background:var(--surface);
  border:2px solid var(--line); border-radius:var(--r); padding:12px 12px 12px 14px;
}
.sortrow.good{border-color:var(--good); background:var(--good-soft)}
.sortrow.bad{border-color:var(--bad); background:var(--bad-soft)}
.sortrow .pos{font-family:"Cinzel",Georgia,serif; font-weight:700; color:var(--ink-3); width:26px}
.sortrow .txt{flex:1; font-weight:500; min-width:0}
.arrows{display:flex; gap:6px}
.arrow{
  width:44px; height:44px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:18px; cursor:pointer; line-height:1;
}
.arrow:disabled{opacity:.35; cursor:default}

/* Paare zuordnen */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pcol{display:grid; gap:8px; align-content:start}
.pitem{
  text-align:left; font:inherit; font-size:16px; padding:13px 12px; border-radius:12px;
  border:2px solid var(--line); background:var(--surface); color:inherit; cursor:pointer; min-height:56px;
}
.pitem.sel{border-color:var(--accent); background:var(--accent-soft)}
.pitem.linked{border-color:var(--good); background:var(--good-soft); cursor:default}
.pitem.miss{border-color:var(--bad); background:var(--bad-soft)}
.pitem.used{opacity:.45}
.pitem .tag{display:block; font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.1em; text-transform:uppercase}

/* Aktionsleiste */
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; align-items:center}
.btn{
  font:inherit; font-weight:700; font-size:17px; padding:14px 22px; border-radius:12px;
  border:2px solid transparent; cursor:pointer; min-height:52px;
}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4; cursor:default}
.btn.ghost{background:transparent; color:var(--accent); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.counter{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-2); font-weight:600}
p.counter{margin:-10px 0 12px 0; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.actions p.counter,.actions span.counter{margin:0 0 0 auto; text-transform:none; letter-spacing:0; font-size:16px; color:var(--ink-2)}

/* Ergebnis */
.result{text-align:center; padding:30px 10px}
.laurel{font-family:"Cinzel",Georgia,serif; font-size:clamp(46px,12vw,72px); font-weight:700;
  color:var(--gold); line-height:1; margin-bottom:6px; font-variant-numeric:tabular-nums}
.result h2{font-family:"Cinzel",Georgia,serif; margin:0 0 8px; font-size:26px}
.result p{color:var(--ink-2); margin:0 auto 22px; max-width:44ch}

:where(button,input,a):focus-visible{outline:3px solid var(--gold); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media (max-width:560px){
  .pairs{grid-template-columns:1fr}
  .tf{grid-template-columns:1fr}
  body{font-size:17px}
}
.lp-back{display:inline-flex;align-items:center;text-decoration:none;color:inherit;font-weight:600;font-size:15px;padding:7px 12px 7px 9px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(255,255,255,.14);align-self:center}
@media (prefers-color-scheme:dark){ .lp-back{border-color:rgba(0,0,0,.3);background:rgba(0,0,0,.14)} }
</style>

/* ============================ Zustand ============================ */
const KEY = "roemer-trainer-v2";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
let results = load();

const app = document.getElementById("app");
const pill = document.getElementById("scorePill");
const scoreNum = document.getElementById("scoreNum");
const scoreMax = document.getElementById("scoreMax");

function total(ex){
  if(ex.type==="order") return 1;
  if(ex.type==="pairs") return ex.pairs.length;
  return ex.q.length;
}
function el(tag, cls, txt){ const n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

/* ============================ Startseite ============================ */
function home(){
  pill.hidden = false;
  const done = EX.filter(e=>results[e.id]!=null);
  const got = done.reduce((s,e)=>s+results[e.id],0);
  const max = done.reduce((s,e)=>s+total(e),0);
  scoreNum.textContent = got; scoreMax.textContent = "/"+max;
  pill.hidden = done.length===0;

  app.innerHTML = "";
  const lead = el("p","lead","Zu jedem Kapitel im Dossier gibt es eine Übung. Sie fragt nur ab, was du bis zu diesem Kapitel gelernt hast. Die Repetition am Schluss ist für alle, die das ganze Dossier fertig haben.");
  app.append(lead);

  const card = ex=>{
    const r = results[ex.id];
    const c = el("button","card"+(r!=null?" done":"")); c.type="button";
    c.append(el("div","tessera", ex.num));
    const b = el("div","card-body");
    b.append(el("h3", null, ex.title), el("p", null, ex.desc));
    const chip = el("span","chip"+(r!=null?" ok":""));
    chip.textContent = r!=null ? "Gelöst · "+r+" von "+total(ex) : total(ex)+(ex.type==="order"?" Reihenfolge":(ex.type==="pairs"?" Paare":" Aufgaben"));
    b.append(chip);
    c.append(b);
    c.onclick = ()=>start(ex);
    return c;
  };
  [["kap","Übungen zu den Kapiteln"],["rep","Repetition – wenn du das ganze Dossier fertig hast"]].forEach(([g,label])=>{
    app.append(el("h2","group-title",label));
    const grid = el("div","grid");
    EX.filter(e=>e.group===g).forEach(ex=>grid.append(card(ex)));
    app.append(grid);
  });

  const tools = el("div","tools");
  const reset = el("button","btn ghost","Alle Ergebnisse löschen"); reset.type="button";
  reset.onclick = ()=>{ results={}; save(results); home(); };
  tools.append(reset);
  app.append(tools);
  app.append(el("p","note","Tipp: Das Wortgitter und das Kreuzworträtsel findest du auf den Rätselseiten im gedruckten Dossier."));
  window.scrollTo(0,0);
}

/* ============================ Rahmen ============================ */
function frame(ex, bodyBuilder){
  app.innerHTML="";
  const head = el("div","ex-head");
  const back = el("button","btn ghost","‹ Übersicht"); back.type="button"; back.onclick=home;
  head.append(back, el("h2", null, ex.group==="kap" ? ex.title : ex.num+" · "+ex.title));
  app.append(head);
  if(ex.hint) app.append(el("p","hint", ex.hint));
  const bar = el("div","bar"); const fill=el("i"); bar.append(fill); app.append(bar);
  const body = el("div"); app.append(body);
  bodyBuilder(body, fill);
  window.scrollTo(0,0);
}

function finish(ex, got){
  const max = total(ex);
  if(results[ex.id]==null || got>results[ex.id]){ results[ex.id]=got; save(results); }
  app.innerHTML="";
  const r = el("div","result");
  r.append(el("div","laurel", got+" / "+max));
  const pct = got/max;
  const title = pct===1 ? "Perfekt!" : pct>=.75 ? "Sehr gut!" : pct>=.5 ? "Gut gemacht." : "Weiter üben!";
  const text = pct===1 ? "Alles richtig. Du kennst dich bei den Römern wirklich aus."
    : pct>=.75 ? "Fast alles richtig – ein paar Details fehlen noch."
    : pct>=.5 ? "Die Hälfte sitzt schon. Schau im Dossier nach, was noch fehlt."
    : "Lies das passende Kapitel im Dossier noch einmal durch und versuch es dann wieder.";
  r.append(el("h2",null,title), el("p",null,text));
  const act = el("div","actions"); act.style.justifyContent="center";
  const again = el("button","btn primary","Nochmal versuchen"); again.type="button"; again.onclick=()=>start(ex);
  const back = el("button","btn ghost","Zur Übersicht"); back.type="button"; back.onclick=home;
  act.append(again, back);
  r.append(act);
  app.append(r);
  window.scrollTo(0,0);
}

function start(ex){
  pill.hidden = true;
  if(ex.type==="mc") runMC(ex);
  else if(ex.type==="tf") runTF(ex);
  else if(ex.type==="input") runInput(ex);
  else if(ex.type==="order") runOrder(ex);
  else if(ex.type==="pairs") runPairs(ex);
}

/* ---------- Multiple Choice ---------- */
function runMC(ex){
  const qs = shuffle(ex.q);
  let i=0, got=0;
  frame(ex,(body,fill)=>{
    const render=()=>{
      body.innerHTML="";
      fill.style.width = (i/qs.length*100)+"%";
      const [text, right, opts, why, imgKey] = qs[i];
      body.append(el("p","counter","Frage "+(i+1)+" von "+qs.length));
      if(imgKey){ const im=el("img","photo"); im.src=IMAGES[imgKey]; im.alt="Foto eines römischen Bauwerks"; body.append(im); }
      body.append(el("p","q", text));
      const box = el("div","opts");
      const letters="ABCD";
      const order = shuffle(opts);
      order.forEach((o,k)=>{
        const b=el("button","opt"); b.type="button"; b.dataset.v=o;
        b.append(el("span","mark", letters[k]), el("span",null,o));
        b.onclick=()=>{
          [...box.children].forEach(c=>c.disabled=true);
          const ok = o===right;
          if(ok){ got++; b.classList.add("good"); }
          else{
            b.classList.add("bad");
            [...box.children].forEach(c=>{ if(c.dataset.v===right) c.classList.add("good"); });
          }
          const fb=el("div","feedback "+(ok?"good":"bad"));
          fb.setAttribute("role","status");
          fb.append(el("b",null, ok?"Richtig!":"Leider falsch – richtig ist: "+right), el("span",null,why));
          body.append(fb);
          const act=el("div","actions");
          const nx=el("button","btn primary", i<qs.length-1?"Weiter":"Auswertung"); nx.type="button";
          nx.onclick=()=>{ i++; i<qs.length ? render() : finish(ex,got); };
          const cnt=el("span","counter", (i+1)+" von "+qs.length+" · "+got+" richtig");
          act.append(nx,cnt); body.append(act); nx.focus();
        };
        box.append(b);
      });
      body.append(box);
    };
    render();
  });
}

/* ---------- Wahr / falsch ---------- */
function runTF(ex){
  const qs = shuffle(ex.q);
  let i=0, got=0;
  frame(ex,(body,fill)=>{
    const render=()=>{
      body.innerHTML="";
      fill.style.width=(i/qs.length*100)+"%";
      const [text, right, why] = qs[i];
      body.append(el("p","counter","Aussage "+(i+1)+" von "+qs.length));
      body.append(el("p","q", text));
      const box=el("div","tf");
      [["Wahr",true],["Falsch",false]].forEach(([lab,val])=>{
        const b=el("button","opt",lab); b.type="button"; b.dataset.v=String(val);
        b.onclick=()=>{
          [...box.children].forEach(c=>c.disabled=true);
          const ok = val===right;
          if(ok) got++;
          b.classList.add(ok?"good":"bad");
          if(!ok) [...box.children].forEach(c=>{ if(c.dataset.v===String(right)) c.classList.add("good"); });
          const fb=el("div","feedback "+(ok?"good":"bad"));
          fb.setAttribute("role","status");
          fb.append(el("b",null, ok?"Richtig!":"Das stimmt so nicht."), el("span",null,why));
          body.append(fb);
          const act=el("div","actions");
          const nx=el("button","btn primary", i<qs.length-1?"Weiter":"Auswertung"); nx.type="button";
          nx.onclick=()=>{ i++; i<qs.length ? render() : finish(ex,got); };
          act.append(nx, el("span","counter",(i+1)+" von "+qs.length+" · "+got+" richtig"));
          body.append(act); nx.focus();
        };
        box.append(b);
      });
      body.append(box);
    };
    render();
  });
}

/* ---------- Eingabe (römische Zahlen) ---------- */
function norm(s){ return String(s).toUpperCase().replace(/[^A-Z0-9]/g,""); }
function runInput(ex){
  const qs = shuffle(ex.q);
  let i=0, got=0;
  frame(ex,(body,fill)=>{
    const render=()=>{
      body.innerHTML="";
      fill.style.width=(i/qs.length*100)+"%";
      const [text, right]=qs[i];
      body.append(el("p","counter","Aufgabe "+(i+1)+" von "+qs.length));
      body.append(el("p","q", text));
      const row=el("div","input-row");
      const inp=document.createElement("input"); inp.type="text"; inp.autocomplete="off";
      inp.setAttribute("aria-label","Deine Antwort"); inp.placeholder="?";
      const chk=el("button","btn primary","Prüfen"); chk.type="button";
      row.append(inp,chk); body.append(row);

      const pad=el("div","keypad");
      "IVXLCDM".split("").forEach(ch=>{ const k=el("button","key",ch); k.type="button";
        k.onclick=()=>{ inp.value+=ch; inp.focus(); }; pad.append(k); });
      const del=el("button","key wide","Löschen"); del.type="button";
      del.onclick=()=>{ inp.value=inp.value.slice(0,-1); inp.focus(); };
      pad.append(del); body.append(pad);

      const done=()=>{
        if(chk.disabled) return;
        chk.disabled=true; inp.disabled=true;
        [...pad.children].forEach(k=>k.disabled=true);
        const ok = norm(inp.value)===norm(right);
        if(ok) got++;
        inp.style.borderColor = ok ? "var(--good)" : "var(--bad)";
        const fb=el("div","feedback "+(ok?"good":"bad"));
        fb.setAttribute("role","status");
        fb.append(el("b",null, ok?"Richtig!":"Richtig wäre: "+right),
                  el("span",null, ok?"Weiter so.":"Deine Antwort: "+(inp.value||"–")));
        body.append(fb);
        const act=el("div","actions");
        const nx=el("button","btn primary", i<qs.length-1?"Weiter":"Auswertung"); nx.type="button";
        nx.onclick=()=>{ i++; i<qs.length ? render() : finish(ex,got); };
        act.append(nx, el("span","counter",(i+1)+" von "+qs.length+" · "+got+" richtig"));
        body.append(act); nx.focus();
      };
      chk.onclick=done;
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") done(); });
      inp.focus();
    };
    render();
  });
}

/* ---------- Reihenfolge ---------- */
function runOrder(ex){
  let cur = shuffle(ex.items);
  while(cur.every((v,k)=>v===ex.items[k])) cur = shuffle(ex.items);
  frame(ex,(body,fill)=>{
    fill.style.width="0%";
    const render=(checked)=>{
      body.innerHTML="";
      const list=el("div","sortlist");
      cur.forEach((t,k)=>{
        const row=el("div","sortrow");
        if(checked) row.classList.add(t===ex.items[k]?"good":"bad");
        row.append(el("span","pos", romanize(k+1)), el("span","txt", t));
        if(!checked){
          const ar=el("div","arrows");
          const up=el("button","arrow","▲"); up.type="button"; up.setAttribute("aria-label","nach oben"); up.disabled=k===0;
          up.onclick=()=>{ [cur[k-1],cur[k]]=[cur[k],cur[k-1]]; render(false); };
          const dn=el("button","arrow","▼"); dn.type="button"; dn.setAttribute("aria-label","nach unten"); dn.disabled=k===cur.length-1;
          dn.onclick=()=>{ [cur[k+1],cur[k]]=[cur[k],cur[k+1]]; render(false); };
          ar.append(up,dn); row.append(ar);
        }
        list.append(row);
      });
      body.append(list);
      const act=el("div","actions");
      if(!checked){
        const b=el("button","btn primary","Reihenfolge prüfen"); b.type="button";
        b.onclick=()=>{
          const rights = cur.filter((v,k)=>v===ex.items[k]).length;
          fill.style.width=(rights/cur.length*100)+"%";
          render(true);
          const allOk = rights===cur.length;
          const fb=el("div","feedback "+(allOk?"good":"bad"));
          fb.setAttribute("role","status");
          fb.append(el("b",null, allOk?"Perfekt – alles an der richtigen Stelle!":rights+" von "+cur.length+" Zeilen stehen richtig."),
                    el("span",null, allOk?"":"Die rot markierten Zeilen gehören woanders hin."));
          body.append(fb);
          const a2=el("div","actions");
          const fin=el("button","btn primary", allOk?"Fertig":"Nochmal versuchen"); fin.type="button";
          fin.onclick=()=> allOk ? finish(ex,1) : runOrder(ex);
          const hm=el("button","btn ghost","Aufgeben und Lösung sehen"); hm.type="button";
          hm.onclick=()=>{ cur=ex.items.slice(); render(true); body.append(el("p","hint","Das ist die richtige Reihenfolge."));
            const a3=el("div","actions"); const bk=el("button","btn ghost","Zur Übersicht"); bk.type="button"; bk.onclick=home; a3.append(bk); body.append(a3); };
          a2.append(fin); if(!allOk) a2.append(hm);
          body.append(a2); fin.focus();
        };
        act.append(b);
      }
      body.append(act);
    };
    render(false);
  });
}
function romanize(n){ return ["I","II","III","IV","V","VI","VII","VIII","IX","X"][n-1] || String(n); }

/* ---------- Paare zuordnen ---------- */
function runPairs(ex){
  const left = shuffle(ex.pairs.map(p=>p[0]));
  const right = shuffle(ex.pairs.map(p=>p[1]));
  const map = new Map(ex.pairs);
  let sel=null, got=0, open=ex.pairs.length;
  frame(ex,(body,fill)=>{
    const grid=el("div","pairs");
    const cl=el("div","pcol"), cr=el("div","pcol");
    const lb=el("div"), rb=el("div");
    lb.className="pitem"; lb.style.cssText="border:none;background:none;min-height:0;padding:0 0 4px";
    lb.append(el("span","tag","Begriff"));
    rb.className="pitem"; rb.style.cssText="border:none;background:none;min-height:0;padding:0 0 4px";
    rb.append(el("span","tag","Erklärung"));
    cl.append(lb); cr.append(rb);

    const step=()=>{ fill.style.width=((ex.pairs.length-open)/ex.pairs.length*100)+"%"; };
    const rbtns={};
    right.forEach(t=>{ const b=el("button","pitem",t); b.type="button"; rbtns[t]=b;
      b.onclick=()=>{
        if(!sel || b.classList.contains("linked")) return;
        const wanted = map.get(sel.dataset.k);
        if(wanted===t){
          got++; open--; sel.classList.remove("sel"); sel.classList.add("linked"); sel.disabled=true;
          b.classList.add("linked"); b.disabled=true; sel=null; step();
          if(open===0) setTimeout(()=>finish(ex,got),450);
        }else{
          b.classList.add("miss"); const s=sel; s.classList.add("miss");
          setTimeout(()=>{ b.classList.remove("miss"); s.classList.remove("miss","sel"); s.classList.add("used"); s.disabled=true; },700);
          sel=null; open--; step();
          if(open===0) setTimeout(()=>finish(ex,got),700);
        }
      };
      cr.append(b); });
    left.forEach(t=>{ const b=el("button","pitem",t); b.type="button"; b.dataset.k=t;
      b.onclick=()=>{ if(b.classList.contains("linked")) return;
        if(sel) sel.classList.remove("sel");
        sel = sel===b ? null : b; if(sel) sel.classList.add("sel"); };
      cl.append(b); });
    grid.append(cl,cr); body.append(grid);
    body.append(el("p","counter","Jedes Paar hast du einen Versuch. Viel Erfolg!"));
  });
}

home();
</script>
