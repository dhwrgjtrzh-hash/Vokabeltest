<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dezimalzahlen üben</title>
<link rel="icon" type="image/png" href="icons/icon-dezimalzahlen-64.png">
<link rel="apple-touch-icon" href="icons/icon-dezimalzahlen-180.png">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1b2433; --mute:#64708a; --line:#dfe5ef;
  --accent:#2f5bea; --accent-soft:#e8eeff; --good:#127a3c; --good-bg:#dcf5e4; --bad:#b42318; --bad-bg:#fde4e1;
  --sol:#8a3c06; --sol-bg:#fff1e3; --star:#f5a400;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:18px 16px 48px}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{min-width:48px;height:48px;padding:0 8px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;flex:none}
header h1{font-size:1.5rem;margin:0;line-height:1.15}
header h1 small{display:block;font-size:.8rem;font-weight:600;color:var(--mute)}
header .grow{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 2px 8px rgba(27,36,51,.05)}
.sub{color:var(--mute);margin:0 0 16px}
h2{font-size:1.2rem;margin:0 0 6px}

/* Brüche */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .08em;font-size:.82em;font-weight:inherit}
.fr>span{display:block;padding:0 .14em;text-align:center}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding-bottom:.07em}
.fr>span:last-child{padding-top:.07em}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:6px;vertical-align:middle}
.fin i{display:block;width:100%;height:4px;border-radius:2px;background:var(--ink)}
.fin input.ans{width:3.6em;padding:6px 8px}
.eq{font-size:1.8rem;font-weight:800;color:#a3adbf;margin:0 4px}
.fd{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.fd .lab{display:block;font-size:.8rem;color:var(--mute);font-weight:700;text-align:center;margin-bottom:4px}

/* Start */
.who{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:22px}
.who label{font-weight:700}
.who .ans{width:6.5em}
.who .note{color:var(--mute);font-size:.88rem;flex-basis:100%;margin:0}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.topic{--c:#2f5bea;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:14px 14px;cursor:pointer;min-height:92px}
.topic .ic{font-size:1.6rem;line-height:1}
.topic b{display:block;font-size:1.05rem;margin-bottom:2px}
.topic span{display:block;color:var(--mute);font-size:.85rem;line-height:1.3}
.topic:active{transform:scale(.98)}
.topic.mix{background:var(--accent-soft)}
.teacher{margin-top:22px;text-align:right}
.linkish{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:4px}

/* Aufgaben */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-weight:700;border:0;border-radius:14px;padding:14px 26px;background:var(--accent);color:#fff;cursor:pointer;min-height:54px;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:8px 14px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.4}
.progress{display:flex;gap:6px;margin:0 0 16px}
.progress i{flex:1;height:10px;border-radius:999px;background:var(--line)}
.progress i.ok{background:#3fbf6f}.progress i.half{background:#f5c04a}.progress i.no{background:#ef7b6f}.progress i.now{background:var(--accent)}
.qtype{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;margin-bottom:12px;background:var(--accent-soft);color:#24439e}
.q{font-size:1.3rem;margin:0 0 14px;font-weight:600}
.big{font-size:2.3rem;font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;margin:4px 0 20px}
.big.words{font-size:1.4rem;line-height:1.5}
input.ans{font:inherit;font-size:1.6rem;font-weight:800;width:9em;max-width:100%;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none}
input.ans.small{width:5.2em}
input.ans:focus{outline:none;border-color:var(--accent)}
input.ans.ok{border-color:#3fbf6f;background:var(--good-bg)}
input.ans.no{border-color:#ef7b6f;background:var(--bad-bg)}
.two{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.two .x{color:var(--accent)}
.seq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:6px}
.seq .given{padding:8px 4px}
.seq .arr{color:#a3adbf;font-weight:400}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:18px;font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 20px}
.cmp .slot{color:#a3adbf;min-width:1.2em;text-align:center}
.cmpbtns{display:flex;gap:12px;flex-wrap:wrap}
.cmpbtns button{font-size:2rem;font-weight:800;min-width:84px;height:72px;padding:0 14px;border-radius:16px;border:3px solid var(--line);background:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
.cmpbtns.words button{font-size:1.25rem}
.cmpbtns button.ok{border-color:#3fbf6f;background:var(--good-bg)}
.cmpbtns button.no{border-color:#ef7b6f;background:var(--bad-bg)}
.order .lbl{font-size:.85rem;font-weight:700;color:var(--mute);margin:0 0 6px}
.slots{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:84px;padding:10px;border:3px dashed var(--line);border-radius:16px;margin-bottom:14px}
.slots .lt{color:#a3adbf;font-weight:800;font-size:1.4rem}
.slots .ph{color:#a3adbf;font-size:.95rem}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:76px}
.tok{font-size:1.7rem;font-weight:800;min-width:76px;height:68px;padding:0 14px;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer;font-variant-numeric:tabular-nums}
.tok.ok{border-color:#3fbf6f;background:var(--good-bg)}
.tok.no{border-color:#ef7b6f;background:var(--bad-bg)}
.fb{margin-top:18px;border-radius:14px;padding:14px 18px;font-weight:600;display:none;font-size:1.05rem}
.fb.show{display:block}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.sol{background:var(--sol-bg);color:var(--sol)}
.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
svg.nl{width:100%;height:auto;display:block;margin:8px 0 18px;overflow:visible}

/* Stellenwerttafel */
.svt{border-collapse:separate;border-spacing:0;margin:6px 0 20px;font-variant-numeric:tabular-nums;border:2px solid #b9c3d6;border-radius:12px;overflow:hidden}
.svt th,.svt td{border-right:2px solid #dfe5ef;padding:8px 6px;text-align:center;min-width:56px}
.svt th:last-child,.svt td:last-child{border-right:0}
.svt th{background:#eef2fa;font-size:.8rem;color:#45506a;line-height:1.15;border-bottom:2px solid #b9c3d6}
.svt th b{display:block;font-size:1.05rem;color:var(--ink)}
.svt td{font-size:1.7rem;font-weight:800;height:56px;background:#fff}
.svt .dot{border-left:5px solid var(--ink)}
.svt .dec{background:#fbfcff}
.svt th.dec{background:#e6f4ea}

/* Hilfe */
details.help{margin-top:22px;border:2px dashed #c9d3e6;border-radius:14px;padding:4px 16px;background:#fafcff}
details.help summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;color:#24439e}
details.help summary::-webkit-details-marker{display:none}
details.help p{margin:4px 0 12px}
details.help .svt{margin:6px 0 12px}
details.help .svt td{font-size:1.2rem;height:auto}

/* Resultat */
.result{text-align:center}
.result .score{font-size:3.4rem;font-weight:800;margin:4px 0}
.stars{font-size:2.6rem;letter-spacing:.12em;margin:2px 0 8px}
.sent{display:inline-block;margin-top:6px;font-size:.9rem;color:var(--mute)}
.sent.ok{color:var(--good)}
.list{text-align:left;margin:18px auto 0;max-width:600px;padding:0;list-style:none}
.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.list li b{min-width:26px}

/* Lehrperson */
table.t{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--mute);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
table.t tr.klick{cursor:pointer}
table.t tr.klick:hover td{background:#f6f8fd}
.num{text-align:right!important}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.tag.ok{background:var(--good-bg);color:var(--good)}.tag.half{background:#fff3cd;color:#8a6100}.tag.no{background:var(--bad-bg);color:var(--bad)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:#3fbf6f}
.grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media (min-width:900px){.grid2{grid-template-columns:1.2fr 1fr}}

@media (max-width:560px){
  body{font-size:17px;padding:12px}
  .card{padding:16px;border-radius:18px}
  .big,.cmp{font-size:1.8rem}
  .svt th,.svt td{min-width:38px;padding:6px 3px}
  .svt td{font-size:1.3rem}
  .cmpbtns button{min-width:70px;height:62px}
  .tok{font-size:1.4rem;min-width:64px;height:60px}
}
@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:none;border:0;padding:0}}

/* Lernpfad */
.resume{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.resume .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.25}
.resume .btn small{font-weight:600;opacity:.85;font-size:.8rem}
.goal{position:relative}
.goal .tag2{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin:0 0 4px;background:#eef2fa;color:#45506a}
.goal .tag2.erw{background:#e6f4ea;color:#127a3c}
.lv{display:flex;align-items:center;gap:6px;margin-top:8px}
.lv .st{display:flex;gap:3px}
.lv .st i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.lv .st i.on{background:var(--c)}
.lv .st i.part{background:linear-gradient(90deg,var(--c) var(--p),var(--line) var(--p))}
.lv b{font-size:.78rem;color:var(--mute);font-weight:700;margin:0}
.goal.mastered{background:#fbfffc}
.sesshead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.sesshead .grow{flex:1}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:#3fbf6f}
.dots span{font-size:.85rem;font-weight:700;color:var(--mute);margin-left:4px}
.explain{margin-top:16px;border-radius:16px;background:#fff8ec;border:2px solid #f6d39b;padding:14px 18px}
.explain h3{margin:0 0 8px;font-size:1.05rem;color:#8a3c06}
.explain ol{margin:0;padding-left:1.3em}
.explain li{margin:4px 0}
.explain .ans{display:inline-block;margin-top:8px;font-weight:800;font-size:1.15rem}
.explain.ok{background:#f2fbf5;border-color:#bfe8cc}
.explain.ok h3{color:var(--good)}
details.way{margin-top:12px}
details.way summary{cursor:pointer;color:#24439e;font-weight:700}
.toast{margin-top:16px;border-radius:16px;padding:16px 18px;background:linear-gradient(135deg,#fff4cc,#ffe2f0);font-weight:700;font-size:1.1rem;text-align:center}
svg.nl .hit{cursor:pointer}
.placehint{color:var(--mute);font-size:.9rem;margin:-6px 0 12px}
.lzkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.lzkgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.lzkgrid .topic{min-height:0;padding:10px 12px;align-items:center}
.lzkgrid .topic b{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">0.1</div>
    <h1 class="grow"><small>Mathematik 6 · Thema 5 · LZK 6.3</small>Dezimalzahlen üben</h1>
    <div class="pill" id="pill" hidden></div>
  </header>
  <main id="app"></main>
</div>
<script>
/* Adresse des Google-Skripts, das die Antworten speichert (leer = nichts senden). */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzrgzAVAzJ9qKnFE-A4AocZiMw3cG-8pMTBbJ73ypN3HQH7XzOCM7hVgW2WbqBkBNIs/exec";
const UEBUNG = "Dezimalzahlen";
/* ===== Grundfunktionen ===== */
const T = 1000;                       // Dezimalzahlen intern in Tausendsteln
const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};
function fmt(m, minDec=0){
  const neg = m<0; m=Math.abs(m);
  const whole = Math.floor(m/T), frac = m%T;
  let f = String(frac).padStart(3,"0").replace(/0+$/,"");
  while(f.length<minDec) f+="0";
  const w = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g,"’");
  return (neg?"−":"")+w+(f?"."+f:"");
}
function parse(s){
  if(s==null) return null;
  s = String(s).trim().replace(/[\s'’]/g,"").replace(",",".");
  if(s.startsWith(".")) s="0"+s;
  if(!/^\d+(\.\d*)?$/.test(s)) return null;
  const [w,f=""] = s.split(".");
  if(f.replace(/0+$/,"").length>3) return NaN;
  return parseInt(w,10)*T + parseInt((f+"000").slice(0,3),10);
}
function parseInt0(s){ s=String(s||"").trim(); return /^\d+$/.test(s) ? parseInt(s,10) : null; }
const decs = m => (fmt(m).split(".")[1]||"").length;

/* Brüche */
const gcd = (a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const lcm = (a,b)=> a*b/gcd(a,b);
const red = (n,d)=>{ const g=gcd(n,d); return {n:n/g, d:d/g}; };
const fr = (n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const frT = (n,d)=>`${n}/${d}`;
const isTerm = d=>{ while(d%2===0) d/=2; while(d%5===0) d/=5; return d===1; };
const milli = (n,d)=> n*T/d;
function powTo(d){ return [10,100,1000].find(p=>p%d===0); }
function kuerzSteps(n,d){        // Schritte beim Kürzen als HTML-Kette
  const out=[fr(n,d)]; let a=n,b=d;
  for(const p of [10,5,2,3,7,11,13]){ while(a%p===0 && b%p===0 && gcd(a,b)>1){ a/=p; b/=p; out.push(fr(a,b)); } }
  return {html: out.join(" = "), n:a, d:b};
}

/* Stellenwerttafel */
const PLACES = [
  {name:"Tausender",  k:"T", m:1000000},
  {name:"Hunderter",  k:"H", m:100000},
  {name:"Zehner",     k:"Z", m:10000},
  {name:"Einer",      k:"E", m:1000},
  {name:"Zehntel",    k:"z", m:100},
  {name:"Hundertstel",k:"h", m:10},
  {name:"Tausendstel",k:"t", m:1},
];
function svt(digits, from=1){
  const pl = PLACES.slice(from, from+digits.length);
  const th = pl.map(p=>`<th class="${p.m<1000?"dec":""} ${p.m===100?"dot":""}"><b>${p.k}</b>${p.name}</th>`).join("");
  const td = pl.map((p,i)=>`<td class="${p.m<1000?"dec":""} ${p.m===100?"dot":""}">${digits[i]}</td>`).join("");
  return `<div style="overflow-x:auto"><table class="svt"><tr>${th}</tr><tr>${td}</tr></table></div>`;
}
function svtOf(m){        // Stellenwerttafel einer Zahl (H Z E | z h t)
  const d=[Math.floor(m/100000)%10,Math.floor(m/10000)%10,Math.floor(m/1000)%10,Math.floor(m/100)%10,Math.floor(m/10)%10,m%10];
  let first = d.findIndex(x=>x>0); if(first<0||first>2) first=2;
  return svt(d.slice(first).map((x,i)=>String(x)), 1+first);
}

/* Zahlenstrahl: total Striche-Abschnitte; big = alle wieviel ein langer Strich; mid = alle wieviel ein mittlerer */
function numberLine(o){
  const {total, big=total, mid=0, labels={}, arrows={}, id=""} = o;
  const W=680,H=150,x0=34,x1=W-34,y=78;
  const X=i=>x0+(x1-x0)*i/total;
  let ticks="";
  for(let i=0;i<=total;i++){
    const isBig = i%big===0, isMid = mid && i%mid===0;
    const h = isBig?18:isMid?12:7;
    ticks+=`<line x1="${X(i)}" y1="${y-h}" x2="${X(i)}" y2="${y+h}" stroke="#1b2433" stroke-width="${isBig?3.2:isMid?2.2:1.4}" stroke-linecap="round"/>`;
  }
  let lab="";
  for(const [i,t] of Object.entries(labels)) lab+=`<text x="${X(+i)}" y="${y+48}" text-anchor="middle" font-size="24" font-weight="800" fill="#1b2433" font-family="inherit">${t}</text>`;
  let arr="";
  for(const [i,t] of Object.entries(arrows)){
    const x=X(+i);
    arr+=`<path d="M ${x} ${y-22} l -12 -22 h 24 z" fill="#f59f00"/><rect x="${x-4}" y="${y-62}" width="8" height="20" rx="3" fill="#f59f00"/>`;
    if(t) arr+=`<text x="${x}" y="${y-70}" text-anchor="middle" font-size="22" font-weight="800" fill="#c47f00" font-family="inherit">${t}</text>`;
  }
  return `<svg class="nl" ${id?`id="${id}"`:""} viewBox="0 -10 ${W} ${H+10}" data-x0="${x0}" data-x1="${x1}" data-total="${total}" role="img" aria-label="Zahlenstrahl">
    <line x1="${x0-14}" y1="${y}" x2="${x1+14}" y2="${y}" stroke="#1b2433" stroke-width="3.5" stroke-linecap="round"/>${ticks}${lab}${arr}
    <g class="mark"></g>${id?`<rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`:""}</svg>`;
}
const ol = steps => `<ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;

const START_NOTE = "Schreibe Dezimalzahlen mit Punkt oder Komma, zum Beispiel 3.45 oder 3,45.";
const UNIT = {1000:"Ganze",100:"Zehntel",10:"Hundertstel",1:"Tausendstel",10000:"Zehner",100000:"Hunderter",1000000:"Tausender"};
const UDEC = {100:1,10:2,1:3};

const GOALS = [
/* ---------- A1 Zahlenstrahl ---------- */
{id:"A1", code:"A1", title:"Zahlenstrahl", ic:"📏", c:"#0b8ec2", info:"Dezimalzahlen ablesen und eintragen", tb:"TB S. 20, 22",
 help:()=>`<p>1. Schau die beschrifteten Zahlen an.<br>2. Zähle, in wie viele gleiche Abschnitte die Strecke geteilt ist.<br>3. Abstand : Anzahl Abschnitte = Wert von <b>einem</b> Abschnitt.</p>
   <p>Beispiel: Von 10 bis 11 sind es 100 kleine Abschnitte → ein kleiner Strich = 0.01. Die langen Striche sind die Zehntel 10.1, 10.2, …</p>`,
 gen(lv){
   let a, step, total=10, mid=5, big=10;
   if(lv===1){ step=100; a=rnd(0,30)*T; }
   else if(lv===2){ if(Math.random()<.5){ step=10; a=rnd(0,300)*100; } else { step=10; total=100; mid=5; big=10; a=rnd(0,30)*T; } }
   else { if(Math.random()<.45){ step=1; a=rnd(0,3000)*10; } else { step=10; total=100; a=rnd(1,30)*T;
       let k=rnd(1,99); if(k%10===0) k++;
       const val=a+k*step;
       return {type:"place", html:`<p class="q">Wo liegt <b>${fmt(val)}</b>? Tippe die Stelle auf dem Zahlenstrahl an.</p>`,
         line:{total, big:10, mid:5, labels:{0:fmt(a),100:fmt(a+T)}}, target:k, label:i=>fmt(a+i*step),
         text:`${fmt(val)} auf dem Zahlenstrahl ${fmt(a)} bis ${fmt(a+T)} eintragen`, show:fmt(val),
         explain: ol([`Von ${fmt(a)} bis ${fmt(a+T)} gibt es 100 kleine Abschnitte. Ein kleiner Abschnitt ist 0.01.`,
           `Die langen Striche sind die Zehntel. ${fmt(val)} liegt nach dem langen Strich bei <b>${fmt(a+Math.floor(k/10)*100,1)}</b>.`,
           `Von dort noch <b>${k%10}</b> kleine Striche weiter (${k%10} · 0.01 = ${fmt((k%10)*10)}).`])};
   } }
   let k = rnd(1,total-1); if(total===10 && k===5) k=pick([2,3,4,6,7,8]);
   if(total===100 && k%10===0) k+=rnd(1,4);
   const b = a+total*step, val = a+k*step;
   const html = `<p class="q">Welche Zahl zeigt der Pfeil?</p>` + numberLine({total, big, mid, labels:{0:fmt(a),[total]:fmt(b)}, arrows:{[k]:""}});
   const steps = [`Die Strecke von ${fmt(a)} bis ${fmt(b)} ist in ${total} gleiche Abschnitte geteilt.`,
     `Ein Abschnitt ist ${fmt(b-a)} : ${total} = <b>${fmt(step)}</b>.`];
   if(total===100) steps.push(`Die langen Striche sind die Zehntel. Der Pfeil steht nach <b>${fmt(a+Math.floor(k/10)*100,1)}</b> und dann noch ${k%10} kleine Striche: ${fmt(a+Math.floor(k/10)*100,1)} + ${k%10} · 0.01 = <b>${fmt(val)}</b>.`);
   else steps.push(`Der Pfeil steht ${k} Abschnitte nach ${fmt(a)}: ${fmt(a)} + ${k} · ${fmt(step)} = <b>${fmt(val)}</b>.`);
   return {type:"input", html, answer:val, show:fmt(val), text:`Zahlenstrahl ${fmt(a)} bis ${fmt(b)} (${total} Abschnitte), Pfeil beim ${k}.`, explain:ol(steps)};
 }},

/* ---------- A2 In Schritten zählen ---------- */
{id:"A2", code:"A2", title:"In Schritten zählen", ic:"👣", c:"#13a36b", info:"Zahlenfolgen vorwärts und rückwärts", tb:"TB S. 21–23",
 help:()=>`<p>1. Finde den Schritt: Rechne die Differenz von zwei Nachbarzahlen aus.<br>2. Vorwärts: + Schritt. Rückwärts: − Schritt.</p>
   <p>Beispiel: 13.02, 13.05, 13.08 → Schritt 0.03. Vorwärts: 13.11, 13.14. Rückwärts: 12.99, 12.96.<br>Achtung beim Übergang: 0.75 + 0.25 = <b>1</b> · 13.02 − 0.03 = <b>12.99</b></p>`,
 gen(lv){
   if(lv===1){
     const st = pick([100,200,500,250,50]), s = rnd(0,40)*st + pick([0,0,100]);
     const seq=[0,1,2,3,4].map(i=>s+i*st);
     return {type:"seq", html:`<p class="q">Zähle in <b>${fmt(st)}er-Schritten</b> vorwärts.</p>`, pattern:[seq[0],seq[1],null,null,null], answers:seq.slice(2),
       show:seq.slice(2).map(v=>fmt(v)).join(", "), text:`${fmt(st)}er-Schritte ab ${fmt(seq[0])}`,
       explain: ol([`Der Schritt ist <b>+ ${fmt(st)}</b>.`, ...seq.slice(1,4).map((v,i)=>`${fmt(v)} + ${fmt(st)} = <b>${fmt(seq[i+2])}</b>`)])};
   }
   if(lv===2){
     const st = pick([10,20,30,40,50,25,200,300,150]); const v = rnd(4*st/10+5, 1500)*10 + pick([0,0,5].filter(x=>st%10===5||x===0));
     const seq=[-2,-1,0,1,2,3,4].map(i=>v+i*st);
     if(seq[0]<0) return null;
     return {type:"seq", html:`<p class="q">Zähle in gleich grossen Schritten <b>vorwärts und rückwärts</b>.</p>`, pattern:[null,null,seq[2],seq[3],seq[4],null,null],
       answers:[seq[0],seq[1],seq[5],seq[6]], show:`${fmt(seq[0])}, ${fmt(seq[1])} … ${fmt(seq[5])}, ${fmt(seq[6])}`, text:`Folge … ${fmt(seq[2])}, ${fmt(seq[3])}, ${fmt(seq[4])} …`,
       explain: ol([`Schritt finden: ${fmt(seq[3])} − ${fmt(seq[2])} = <b>${fmt(st)}</b>.`,
         `Vorwärts: ${fmt(seq[4])} + ${fmt(st)} = <b>${fmt(seq[5])}</b>, ${fmt(seq[5])} + ${fmt(st)} = <b>${fmt(seq[6])}</b>.`,
         `Rückwärts: ${fmt(seq[2])} − ${fmt(st)} = <b>${fmt(seq[1])}</b>, ${fmt(seq[1])} − ${fmt(st)} = <b>${fmt(seq[0])}</b>.`])};
   }
   const st = pick([25,50,75,30,45,125,250,15]);
   if(Math.random()<.5){   // rückwärts über einen Übergang
     const v = (rnd(1,20)*T) + rnd(1,3)*st - (st%10?0:0);
     const seq=[0,1,2,3,4].map(i=>v-i*st);
     if(seq[4]<0) return null;
     return {type:"seq", html:`<p class="q">Zähle in gleich grossen Schritten weiter.</p>`, pattern:[seq[0],seq[1],null,null,null], answers:seq.slice(2),
       show:seq.slice(2).map(v=>fmt(v)).join(", "), text:`rückwärts ${fmt(seq[0])}, ${fmt(seq[1])}, …`,
       explain: ol([`Schritt finden: ${fmt(seq[0])} − ${fmt(seq[1])} = ${fmt(st)}. Die Zahlen werden kleiner, also <b>− ${fmt(st)}</b>.`,
         ...seq.slice(1,4).map((x,i)=>`${fmt(x)} − ${fmt(st)} = <b>${fmt(seq[i+2])}</b>`)])};
   }
   const v = rnd(0,200)*10; const seq=[0,1,2,3,4].map(i=>v+i*st);
   return {type:"seq", html:`<p class="q">Die Schritte sind gleich gross. Fülle die Lücken.</p>`, pattern:[seq[0],null,null,seq[3],null], answers:[seq[1],seq[2],seq[4]],
     show:`${fmt(seq[1])}, ${fmt(seq[2])}, …, ${fmt(seq[4])}`, text:`Lücken: ${fmt(seq[0])}, _, _, ${fmt(seq[3])}, _`,
     explain: ol([`Von ${fmt(seq[0])} bis ${fmt(seq[3])} sind es <b>3 Schritte</b>.`, `Abstand: ${fmt(seq[3])} − ${fmt(seq[0])} = ${fmt(3*st)}. Ein Schritt: ${fmt(3*st)} : 3 = <b>${fmt(st)}</b>.`,
       `${fmt(seq[0])} + ${fmt(st)} = <b>${fmt(seq[1])}</b> · ${fmt(seq[1])} + ${fmt(st)} = <b>${fmt(seq[2])}</b> · ${fmt(seq[3])} + ${fmt(st)} = <b>${fmt(seq[4])}</b>`])};
 }},

/* ---------- A3 Nachbarzahlen ---------- */
{id:"A3", code:"A3", title:"Nachbarzahlen", ic:"🏘️", c:"#e0732b", info:"Nachbar-Tausender bis Nachbar-Tausendstel", tb:"TB S. 21",
 help:()=>`<p><b>Nachbar-Zehntel</b> = das nächstkleinere und das nächstgrössere Zehntel (eine Stelle nach dem Punkt).</p>
   <p>4.37 → <b>4.3</b> und <b>4.4</b> · 3.954 → Nachbar-Tausendstel? 3.954 ist selbst ein Tausendstel → <b>3.953</b> und <b>3.955</b><br>
   7.6 ist selbst ein Zehntel → Nachbar-Zehntel <b>7.5</b> und <b>7.7</b> · 128.245 → Nachbar-Hunderter <b>100</b> und <b>200</b></p>`,
 gen(lv){
   let u, x;
   const U1=[1000,100], U2=[100,10,1,10000,100000], U3=[100,10,1,100000,1000000,10000];
   u = pick(lv===1?U1:lv===2?U2:U3);
   let onGrid = lv===3 ? Math.random()<.6 : lv===2 ? Math.random()<.25 : false;
   if(u===1) onGrid = true;
   if(u<=1000){
     if(onGrid) x = rnd(0,99)*1000 + (u===1000 ? 1000 : rnd(1, 1000/u-1)*u);
     else x = rnd(0,99)*1000 + (u===1000 ? 0 : rnd(0,1000/u-1)*u) + rnd(1, (u===1000?99:Math.max(1,u/ (u>=100?10:1) -1)))*(u===1000?10:(u>=100?10:1));
   } else {
     if(onGrid) x = rnd(1,90)*u;
     else x = rnd(0,90)*u + rnd(1, u/100-1)*100;
   }
   if(!onGrid && x%u===0) x += (u>=100?10:1);
   const on = x%u===0;
   const lo = on ? x-u : Math.floor(x/u)*u, hi = on ? x+u : Math.floor(x/u)*u+u;
   const dd = UDEC[u]||0;
   return {type:"two", html:`<p class="q">Schreibe die <b>Nachbar-${UNIT[u]==="Ganze"?"Ganzen":UNIT[u]}</b> auf.</p>`, mid:fmt(x), answers:[lo,hi],
     show:`${fmt(lo,dd)} und ${fmt(hi,dd)}`, text:`Nachbar-${UNIT[u]} von ${fmt(x)}`,
     explain: on ? ol([`${UNIT[u]==="Ganze"?"Ganze":UNIT[u]}: Zahlen ${u<1000?`mit ${dd} Stelle${dd>1?"n":""} nach dem Punkt`:`in ${UNIT[u]}-Schritten`}.`,
         `${fmt(x)} ist <b>selbst</b> schon ein${u===1000?"e ganze Zahl":" "+UNIT[u].replace(/n$/,"")}. Die Nachbarn sind eins weniger und eins mehr.`,
         `${fmt(x)} − ${fmt(u)} = <b>${fmt(lo,dd)}</b> und ${fmt(x)} + ${fmt(u)} = <b>${fmt(hi,dd)}</b>`])
       : ol([`${UNIT[u]==="Ganze"?"Ganze":UNIT[u]}: Zahlen ${u<1000?`mit ${dd} Stelle${dd>1?"n":""} nach dem Punkt`:`in ${UNIT[u]}-Schritten`} (${fmt(u)}, ${fmt(2*u)}, …).`,
         `Streiche bei ${fmt(x)} alles hinter dieser Stelle weg: <b>${fmt(lo,dd)}</b> – das ist der kleinere Nachbar.`,
         `Der grössere Nachbar ist ${fmt(u)} mehr: ${fmt(lo,dd)} + ${fmt(u)} = <b>${fmt(hi,dd)}</b>`])};
 }},

/* ---------- A4 mal und durch 10, 100, 1000 ---------- */
{id:"A4", code:"A4", title:"· und : 10, 100, 1000", ic:"✖️", c:"#2f5bea", info:"Multiplizieren und dividieren mit Stufenzahlen", tb:"TB S. 21",
 help:()=>`<p><b>· 10 / · 100 / · 1000:</b> Jede Ziffer wird 10/100/1000-mal so viel wert. Der Punkt rutscht 1/2/3 Stellen nach <b>rechts</b>.<br>0.75 · 10 = 7.5 · 0.03 · 100 = 3 · 5.25 · 1000 = 5’250</p>
   <p><b>: 10 / : 100 / : 1000:</b> Der Punkt rutscht 1/2/3 Stellen nach <b>links</b>. Fehlende Stellen mit 0 auffüllen.<br>231.6 : 10 = 23.16 · 37 : 1000 = 0.037</p>`,
 gen(lv){
   const p = lv===1 ? 10 : pick([10,100,1000]);
   const st = String(p).length-1;
   const mul = Math.random()<.5;
   let x, r;
   if(mul){ x = lv===1 ? pick([rnd(1,99)*10, rnd(1,999)*100, rnd(1,9)*1000+rnd(1,9)*100]) : pick([rnd(1,9), rnd(1,99), rnd(1,999), rnd(1,9999), rnd(100,9999)*1000]); r = x*p; }
   else { r = lv===1 ? pick([rnd(1,999)*10, rnd(1,99)*100]) : pick([rnd(1,9), rnd(1,99), rnd(1,999), rnd(1,99)*10]); x = r*p; }
   const opS = mul?"·":":", dir = mul?"rechts":"links";
   const expl = ol([`${mul?"Mal":"Durch"} ${fmt(p*T)}: Der Punkt rutscht <b>${st} Stelle${st>1?"n":""} nach ${dir}</b>${mul?"":" (fehlende Stellen mit 0 auffüllen)"}.`,
     `${fmt(x)} ${opS} ${fmt(p*T)} = <b>${fmt(r)}</b>`, `Kontrolle mit der Stellenwerttafel:`]) + svtOf(mul?x:x) + `<p style="margin:4px 0">wird zu</p>` + svtOf(r);
   if(lv===3 && Math.random()<.6){
     if(Math.random()<.5) return {type:"input", html:`<p class="q">Welche Zahl gehört ins Kästchen?</p><p class="big">${fmt(x)} ${opS} ☐ = ${fmt(r)}</p>`, answer:p*T, show:fmt(p*T),
       text:`${fmt(x)} ${opS} ☐ = ${fmt(r)}`, explain: ol([`Vergleiche die Ziffern: ${fmt(x)} → ${fmt(r)}. Der Punkt ist <b>${st} Stelle${st>1?"n":""} nach ${dir}</b> gerutscht.`, `${st} Stelle${st>1?"n":""} = ${mul?"mal":"durch"} <b>${fmt(p*T)}</b>.`])};
     return {type:"input", html:`<p class="q">Welche Zahl gehört ins Kästchen?</p><p class="big">☐ ${opS} ${fmt(p*T)} = ${fmt(r)}</p>`, answer:x, show:fmt(x),
       text:`☐ ${opS} ${fmt(p*T)} = ${fmt(r)}`, explain: ol([`Rechne rückwärts: Die Umkehrung von ${opS} ${fmt(p*T)} ist ${mul?":":"·"} ${fmt(p*T)}.`, `${fmt(r)} ${mul?":":"·"} ${fmt(p*T)} = <b>${fmt(x)}</b>`])};
   }
   const swap = mul && lv>=2 && Math.random()<.35;
   return {type:"input", html:`<p class="q">Rechne aus.</p>`, lead: swap ? `${fmt(p*T)} · ${fmt(x)} =` : `${mul && x%1000===0 && lv>1 && Math.random()<.3 ? fmt(x)+".0" : fmt(x)} ${opS} ${fmt(p*T)} =`,
     answer:r, show:fmt(r), text:`${fmt(x)} ${opS} ${fmt(p*T)}`, explain:expl};
 }},

/* ---------- Stellenwerte ---------- */
{id:"ST", code:"", title:"Stellenwerte", ic:"🧮", c:"#7c4dff", info:"Stellenwerttafel lesen und schreiben", tb:"TB S. 20",
 help:()=>`<p>Nach dem Punkt kommen <b>Zehntel (z)</b>, <b>Hundertstel (h)</b> und <b>Tausendstel (t)</b>.</p>${svt(["3","4","7","1","8"],2)}
   <p>34.718 = 3 Zehner + 4 Einer + 7 Zehntel + 1 Hundertstel + 8 Tausendstel.<br>Fehlt eine Stelle, schreibst du eine <b>0</b>: 2 Einer + 5 Hundertstel = 2.05<br>10 Hundertstel = 1 Zehntel · 10 Zehntel = 1 Einer</p>`,
 gen(lv){
   const digits = [rnd(0,9),rnd(0,9),rnd(1,9),rnd(0,9),rnd(0,9),rnd(1,9)];
   if(!digits[0] && !digits[1]) digits[1]=rnd(1,9);
   const val = digits[0]*100000+digits[1]*10000+digits[2]*1000+digits[3]*100+digits[4]*10+digits[5];
   const pl = PLACES.slice(1);
   if(lv===1){
     const i = rnd(2,5);
     return {type:"input", html:`<p class="q">Welche Ziffer steht an der <b>${pl[i].name}</b>stelle?</p><p class="big">${fmt(val)}</p>`, answer:digits[i]*T, show:String(digits[i]),
       text:`Ziffer an der ${pl[i].name}stelle von ${fmt(val)}`, explain: ol([`Trage die Zahl in die Stellenwerttafel ein:`]) + svtOf(val) + `<p>An der ${pl[i].name}stelle (${pl[i].k}) steht die <b>${digits[i]}</b>.</p>`};
   }
   if(lv===2){
     if(Math.random()<.5){
       const d2 = digits.slice(); d2[rnd(3,4)] = 0;
       const v2 = d2[0]*100000+d2[1]*10000+d2[2]*1000+d2[3]*100+d2[4]*10+d2[5];
       const parts=[]; PLACES.slice(1).forEach((p,i)=>{ if(d2[i]) parts.push(`${d2[i]} ${p.name}`); });
       return {type:"input", html:`<p class="q">Schreibe als Dezimalzahl.</p><p class="big words">${parts.join(" + ")}</p>`, answer:v2, show:fmt(v2), text:parts.join(" + "),
         explain: ol([`Trage jede Ziffer an ihrer Stelle ein. Leere Stellen bekommen eine <b>0</b>.`]) + svtOf(v2) + `<p>→ <b>${fmt(v2)}</b></p>`};
     }
     const i = rnd(3,5);
     return {type:"input", html:`<p class="q">Wie viel ist die Ziffer <b>${digits[i]}</b> wert? Sie steht an der ${pl[i].name}stelle.</p><p class="big">${fmt(val)}</p>`, answer:digits[i]*pl[i].m, show:fmt(digits[i]*pl[i].m),
       text:`Wert der Ziffer ${digits[i]} in ${fmt(val)}`, explain: ol([`1 ${pl[i].name} = ${fmt(pl[i].m)}`, `${digits[i]} ${pl[i].name} = ${digits[i]} · ${fmt(pl[i].m)} = <b>${fmt(digits[i]*pl[i].m)}</b>`])};
   }
   // Stufe 3: Bündeln
   const E=rnd(0,9), z=rnd(10,19), h=rnd(0,9)+ (Math.random()<.5?10:0), t=rnd(0,9);
   const v = E*1000+z*100+h*10+t;
   const parts = [`${E} Einer`,`${z} Zehntel`,`${h} Hundertstel`].concat(t?[`${t} Tausendstel`]:[]).filter(p=>!/^0 /.test(p));
   return {type:"input", html:`<p class="q">Schreibe als Dezimalzahl. Achtung: Bündeln!</p><p class="big words">${parts.join(" + ")}</p>`, answer:v, show:fmt(v), text:parts.join(" + "),
     explain: ol([`${z} Zehntel = ${Math.floor(z/10)} Einer + ${z%10} Zehntel (10 Zehntel = 1 Einer).`, h>=10?`${h} Hundertstel = 1 Zehntel + ${h-10} Hundertstel.`:`Die Hundertstel bleiben: ${h}.`,
       `Zusammen: ${fmt(E*1000)} + ${fmt(z*100)} + ${fmt(h*10)}${t?" + "+fmt(t):""} = <b>${fmt(v)}</b>`])};
 }},

/* ---------- Vergleichen ---------- */
{id:"VG", code:"", title:"Grösser oder kleiner?", ic:"⚖️", c:"#d6336c", info:"Dezimalzahlen vergleichen", tb:"TB S. 23",
 help:()=>`<p>1. Zuerst die <b>Ganzen</b> vergleichen.<br>2. Sind sie gleich: Zehntel, dann Hundertstel, dann Tausendstel.</p><p>Tipp: Schreibe beide Zahlen mit gleich vielen Stellen: 0.8 = 0.80 &gt; 0.75 · 15.7 = 15.70 &gt; 15.07</p>`,
 gen(lv){
   let a,b,sa,sb;
   const v = lv===1 ? pick([0,5]) : lv===2 ? pick([1,3,4]) : pick([2,6,7]);
   if(v===0){ const w=rnd(1,99), d=rnd(1,9); a=w*T+d*100; b=w*T+d*10; }
   else if(v===5){ a=rnd(1,50)*T+rnd(0,9)*100; b=a+pick([-1,1])*rnd(1,3)*T; }
   else if(v===1){ const d1=rnd(1,9),d2=rnd(0,9),d3=rnd(1,9); a=d1*10000+d2*1000+d3*100; b=d1*1000+d2*100+d3*10; }
   else if(v===3){ const w=rnd(0,99), z=rnd(1,9); a=b=w*T+z*100; }
   else if(v===4){ const z=rnd(2,9); a=z*100; b=(z-1)*100+rnd(1,9)*10+rnd(0,9); }
   else if(v===2){ const w=rnd(10,999), h=rnd(11,98); a=w*T+h*10; b=a-rnd(1,9); }
   else if(v===6){ a = 100; b = 99; if(Math.random()<.5){ a=rnd(1,9)*T+100; b=a-1; } }
   else { const w=rnd(1,9); a=w*T+rnd(1,9)*100+50; b=w*T+Math.floor((a%T)/100)*100+5; }
   if(Math.random()<.5) [a,b]=[b,a];
   sa=fmt(a); sb=fmt(b);
   if(v===3){ sb=fmt(b,pick([2,3])); if(Math.random()<.5) [sa,sb]=[sb,sa]; }
   const s = a>b?">":a<b?"<":"=";
   const n = Math.max(decs(a),decs(b),1);
   return {type:"cmp", a:sa, b:sb, answer:s, show:`${sa} ${s} ${sb}`, text:`${sa} ? ${sb}`,
     explain: ol([`Schreibe beide Zahlen mit gleich vielen Stellen untereinander:<br><b>${fmt(a,n)}</b><br><b>${fmt(b,n)}</b>`,
       `Vergleiche von links nach rechts, bis eine Stelle verschieden ist.`, `Also: <b>${sa} ${esc(s)} ${sb}</b>`])};
 }},

/* ---------- Mitte (erweitert) ---------- */
{id:"E1", code:"", erw:true, title:"Die Mitte finden", ic:"🎯", c:"#a05a00", info:"Welche Zahl liegt genau dazwischen?", tb:"TB S. 23",
 help:()=>`<p>1. Abstand: grössere Zahl − kleinere Zahl.<br>2. Abstand halbieren.<br>3. Die Hälfte zur kleineren Zahl dazuzählen.</p><p>10 und 10.5 → Abstand 0.5 → Hälfte 0.25 → <b>10.25</b><br>Achtung: Welche Zahl ist wirklich kleiner? 0.6 ist grösser als 0.006!</p>`,
 gen(lv){
   let a,b;
   if(lv===1){ a=rnd(1,50)*T; b=a+pick([1000,500,100,2000]); }
   else if(lv===2){ a=rnd(1,30)*T+rnd(1,9)*100; b=a+pick([240,160,80,420,110,30])*1; if((b-a)%2) b+=10; }
   else { const v=rnd(0,1); if(v===0){ a=rnd(1,9)*100; b=rnd(2,30)*T; } else { const d=rnd(2,9); a=d*100; b=d; } }
   if((b-a)%2) b+=1;
   const lo=Math.min(a,b), hi=Math.max(a,b), m=(lo+hi)/2;
   if(!Number.isInteger(m)) return null;
   const sw = lv===3 && Math.random()<.5;
   const [x,y] = sw ? [hi,lo] : [a,b];
   return {type:"input", html:`<p class="q">Welche Zahl liegt <b>genau</b> in der Mitte?</p><p class="big">${fmt(x)} <span style="color:#a3adbf">…</span> ? <span style="color:#a3adbf">…</span> ${fmt(y)}</p>`,
     answer:m, show:fmt(m), text:`Mitte zwischen ${fmt(x)} und ${fmt(y)}`,
     explain: ol([...(x>y?[`Achtung: ${fmt(x)} ist die grössere Zahl.`]:[]), `Abstand: ${fmt(hi)} − ${fmt(lo)} = ${fmt(hi-lo)}`, `Hälfte: ${fmt(hi-lo)} : 2 = ${fmt((hi-lo)/2)}`, `Mitte: ${fmt(lo)} + ${fmt((hi-lo)/2)} = <b>${fmt(m)}</b>`, `Kontrolle: ${fmt(m)} + ${fmt((hi-lo)/2)} = ${fmt(hi)} ✓`])};
 }},

/* ---------- Zahlenfolge mit Start und Ziel (erweitert) ---------- */
{id:"E2", code:"", erw:true, title:"Start, Ziel und Schritte", ic:"🚩", c:"#5b6b8a", info:"Gleich grosse Schritte zwischen Start- und Zielzahl", tb:"TB S. 23",
 help:()=>`<p>1. Abstand: Zielzahl − Startzahl.<br>2. Abstand : Anzahl Schritte = ein Schritt.<br>3. Von der Startzahl aus Schritt für Schritt weiterzählen.</p><p>Start 0.4, Ziel 1.1, 5 Schritte → Abstand 0.7 → Schritt 0.14 → 0.54, 0.68, 0.82, 0.96</p>`,
 gen(lv){
   const n = lv===1 ? rnd(2,4) : lv===2 ? 5 : rnd(4,8);
   const st = lv===1 ? pick([100,200,500,250]) : lv===2 ? pick([140,120,60,180,70,30]) : pick([125,75,45,35,15,250,175]);
   const s = lv===1 ? rnd(0,20)*100 : rnd(0,40)*100 + (lv===3?rnd(0,9)*10:0);
   const seq = Array.from({length:n+1},(_,i)=>s+i*st);
   const pattern = seq.map((v,i)=> i===0||i===n ? v : null);
   return {type:"seq", html:`<p class="q">Startzahl <b>${fmt(seq[0])}</b>, Zielzahl <b>${fmt(seq[n])}</b>, <b>${n} gleich grosse Schritte</b>. Fülle die Zahlen dazwischen ein.</p>`,
     pattern, answers:seq.slice(1,n), show:seq.slice(1,n).map(v=>fmt(v)).join(", "), text:`Start ${fmt(seq[0])}, Ziel ${fmt(seq[n])}, ${n} Schritte`,
     explain: ol([`Abstand: ${fmt(seq[n])} − ${fmt(seq[0])} = ${fmt(n*st)}`, `Ein Schritt: ${fmt(n*st)} : ${n} = <b>${fmt(st)}</b>`, `Weiterzählen: ${seq.map(v=>fmt(v)).join(" → ")}`])};
 }},
];

/* ===== Lernpfad ===== */
const app = document.getElementById("app"), pill = document.getElementById("pill");
const NEED = 5;              // so viele Punkte braucht es pro Stufe
const STREAK = 3;            // oder so viele richtige Antworten hintereinander
const LEVELS = 3;
const TEST_N = GOALS.length >= 8 ? GOALS.length : 10;
const GOAL = Object.fromEntries(GOALS.map(g=>[g.id,g]));
const LVNAME = ["","Stufe 1 · Einstieg","Stufe 2 · wie im Test","Stufe 3 · knifflig"];
let gz = (store.get("uebung.gz")||store.get("dz.gz")||"").replace(/\D/g,"");
let P = null, S = null;

function pkey(){ return "uebung.p."+UEBUNG+"."+gz; }
function loadP(){ try{ P = JSON.parse(store.get(pkey())||"null"); }catch(e){ P=null; } if(!P||!P.goals) P={goals:{}, last:null}; }
function saveP(){ store.set(pkey(), JSON.stringify(P)); }
function gs(id){ return P.goals[id] || (P.goals[id]={lv:1, pr:0, done:false, n:0, ok:0}); }

function levelBar(id){
  const s = gs(id), c = GOAL[id].c;
  let h = "";
  for(let l=1;l<=LEVELS;l++){
    const cls = (s.done || l<s.lv) ? "on" : l===s.lv && s.pr>0 ? "part" : "";
    h += `<i class="${cls}" style="--c:${c};--p:${Math.round(s.pr/NEED*100)}%"></i>`;
  }
  return `<div class="lv"><span class="st">${h}</span><b>${s.done?"geschafft ⭐":"Stufe "+s.lv}</b></div>`;
}

function home(){
  pill.hidden = true;
  if(gz) loadP();
  const cards = GOALS.map(g=>{
    const s = gz ? gs(g.id) : null;
    return `<button class="topic goal ${s&&s.done?"mastered":""}" data-k="${g.id}" style="--c:${g.c}"><span class="ic">${g.ic}</span>
      <span><span class="tag2 ${g.erw?"erw":""}">${g.code?g.code+" · ":""}${g.erw?"erweitert":"Grundanforderung"}</span><b>${g.title}</b><span>${g.info}</span><span>${g.tb}</span>${s?levelBar(g.id):""}</span></button>`;
  }).join("");
  const last = gz && P.last && GOAL[P.last] ? P.last : null;
  const nextGoal = gz ? (GOALS.find(g=>!gs(g.id).done && !g.erw) || GOALS.find(g=>!gs(g.id).done)) : null;
  const resumeId = last && !gs(last).done ? last : nextGoal && nextGoal.id;
  app.innerHTML = `<div class="card">
    <div class="who">
      <label for="gz">Deine Glückszahl</label>
      <input class="ans small" id="gz" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" value="${esc(gz)}" placeholder="?">
      <p class="note">Schreib hier deine Glückszahl hin, nicht deinen Namen. Nimm immer dieselbe Zahl – dann machst du dort weiter, wo du aufgehört hast.</p>
    </div>
    ${gz ? `<div class="resume">
      ${resumeId?`<button class="btn" id="resume">▶ Weitermachen<small>${GOAL[resumeId].title} · Stufe ${gs(resumeId).lv}</small></button>`:""}
      <button class="btn ghost" id="testmode">📝 Test-Training<small>${TEST_N} gemischte Aufgaben wie in der Lernzielkontrolle</small></button>
    </div>` : ""}
    <h2>Lernziele</h2>
    <p class="sub">Jedes Lernziel hat 3 Stufen. Eine Stufe ist geschafft, wenn du ${STREAK} Aufgaben hintereinander richtig löst (oder insgesamt ${NEED} Punkte hast). Kannst du es schon, springst du direkt weiter. Ist eine Antwort falsch, siehst du, wie es geht – und bekommst eine ähnliche Aufgabe.</p>
    <div class="topics">${cards}</div>
    <p class="sub" style="margin:18px 0 0">${START_NOTE}</p>
    <div class="teacher no-print"><button class="linkish" id="teach">Lehrperson</button></div>
  </div>`;
  const inp = document.getElementById("gz");
  const upd = ()=>{ const v = inp.value.replace(/\D/g,"").slice(0,4); if(inp.value!==v) inp.value=v; const changed = v!==gz; gz=v; store.set("uebung.gz",gz); return changed; };
  inp.addEventListener("change", ()=>{ if(upd()) home(); });
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); if(upd()) home(); } });
  const need = ()=>{ upd(); if(!gz){ inp.focus(); inp.classList.add("no"); document.querySelector(".who .note").innerHTML="<b style='color:var(--bad)'>Bitte zuerst deine Glückszahl eintragen.</b>"; return false; } loadP(); return true; };
  app.querySelectorAll(".topic").forEach(b=>b.onclick=()=>{ if(need()) startGoal(b.dataset.k); });
  const r = document.getElementById("resume"); if(r) r.onclick=()=>{ if(need()) startGoal(resumeId); };
  const t = document.getElementById("testmode"); if(t) t.onclick=()=>{ if(need()) startTest(); };
  document.getElementById("teach").onclick = teacher;
  if(!gz) inp.focus({preventScroll:true});
}

function startGoal(id){
  P.last = id; saveP();
  S = {mode:"goal", goal:id, log:[], pending:[], nr:0};
  next();
}
function startTest(){
  const grund = GOALS.filter(g=>!g.erw).map(g=>g.id), erw = GOALS.filter(g=>g.erw).map(g=>g.id);
  let q = shuffle(grund.slice()).concat(shuffle(erw.slice()));
  while(q.length<TEST_N) q.push(pick(grund));
  q = q.slice(0,TEST_N);
  S = {mode:"test", queue:q, qi:0, log:[], pending:[], nr:0};
  next();
}

function curGoal(){ return S.mode==="goal" ? S.goal : (S.twin || S.queue[S.qi]); }
function curLevel(id){ const s=gs(id); return S.mode==="test" ? Math.max(2, Math.min(s.lv, LEVELS)) : s.lv; }

function next(){
  if(S.mode==="test" && S.qi>=S.queue.length && !S.twin) return testResult();
  const id = curGoal();
  let lv = curLevel(id);
  const st = gs(id);
  const probe = S.mode==="goal" && st.lv===1 && st.pr===0 && !st.done && !st.probed;   // Einstufung: gleich mit Stufe 2 beginnen
  if(probe) lv = 2;
  const sig = t=>t.type+"|"+String(t.q||"")+String(t.a||"")+" "+String(t.b||"")+String(t.html||"").replace(/<[^>]*>/g,"").replace(/[0-9.,’'\/]+/g,"#").slice(0,60);
  let t;
  for(let k=0;k<30;k++){ const c = GOAL[id].gen(lv); if(!c) continue; t = c; if(!S.lastSig || sig(c)!==S.lastSig) break; }
  S.lastSig = sig(t);
  t.goal = id; t.lv = lv; t.probe = probe;
  S.task = t; S.done = false; S.answer = null; S.nr++;
  draw();
}

const inp = (id, cls="", mode="decimal")=>`<input class="ans ${cls}" id="${id}" inputmode="${mode}" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="?">`;
const fracInput = (a,b)=>`<span class="fin">${inp(a,"small","numeric")}<i></i>${inp(b,"small","numeric")}</span>`;

function head(){
  const g = GOAL[S.task.goal], s = gs(g.id);
  if(S.mode==="test"){
    const n = S.queue.length, k = Math.min(S.twin ? S.qi : S.qi+1, n);
    return `<div class="sesshead"><span class="qtype" style="background:${g.c}1a;color:${g.c};margin:0">📝 Test-Training · Aufgabe ${k} von ${n}${S.twin?" (ähnliche Aufgabe)":""}</span><span class="grow"></span>
      <button class="btn ghost small" id="quit">✕ Beenden</button></div>
      <p class="sub" style="margin:-4px 0 10px">${g.ic} ${g.title}</p>`;
  }
  let dots=""; for(let i=0;i<NEED;i++) dots+=`<i class="${i<s.pr?"on":""}"></i>`;
  return `<div class="sesshead"><span class="qtype" style="background:${g.c}1a;color:${g.c};margin:0">${g.ic} ${g.code?g.code+" · ":""}${g.title}</span><span class="grow"></span>
    <button class="btn ghost small" id="quit">⟵ Übersicht</button></div>
    <div class="sesshead"><b>${s.done?"Alle Stufen geschafft – du übst weiter auf Stufe 3":LVNAME[s.lv]}</b><span class="grow"></span><span class="dots">${dots}<span>${s.pr}/${NEED}${(s.streak||0)>0?` · 🔥 ${s.streak} in Folge`:""}</span></span></div>`;
}

function draw(){
  const t = S.task, g = GOAL[t.goal];
  pill.hidden = false; pill.textContent = `Nr. ${gz}`;
  let body = "", needsCheck = true;
  if(t.type==="input"){
    body = t.html + `<div class="fd">${t.lead?`<span class="big" style="margin:0">${t.lead}</span>`:""}${inp("a0")}</div>`;
  }else if(t.type==="two"){
    body = t.html + `<div class="two">${inp("a0","small")}<span>${t.sep||"&lt;"}</span><span class="x">${t.mid}</span><span>${t.sep||"&lt;"}</span>${inp("a1","small")}</div>`;
  }else if(t.type==="seq"){
    let j=0;
    body = t.html + `<div class="seq">${t.pattern.map((v,i)=>(i?'<span class="arr">→</span>':"")+(v===null?inp("a"+(j++),"small"):`<span class="given">${fmt(v)}</span>`)).join("")}</div>`;
  }else if(t.type==="frac"){
    body = t.html + `<div class="fd">${t.lead?`<span class="big" style="margin:0">${t.lead}</span><span class="eq">=</span>`:""}${fracInput("a0","a1")}</div>`;
  }else if(t.type==="fracdec"){
    body = t.html + `<div class="fd">${t.lead?`<span class="big" style="margin:0">${t.lead}</span><span class="eq">=</span>`:""}
      <span><span class="lab">Bruch${t.reduced?" (gekürzt)":""}</span>${fracInput("a0","a1")}</span><span class="eq">=</span>
      <span><span class="lab">Dezimalzahl</span>${inp("a2","small")}</span></div>`;
  }else if(t.type==="cmp"){
    needsCheck = false;
    body = `<p class="q">${t.q||"Setze das richtige Zeichen ein."}</p>
      <div class="cmp"><span>${t.a}</span><span class="slot" id="slot">?</span><span>${t.b}</span></div>
      <div class="cmpbtns">${["<","=",">"].map(c=>`<button data-c="${c}">${c==="<"?"&lt;":c===">"?"&gt;":"="}</button>`).join("")}</div>`;
  }else if(t.type==="choice"){
    needsCheck = false;
    body = t.html + `<div class="cmpbtns ${t.words?"words":""}">${t.options.map((o,j)=>`<button data-c="${j}">${o.label}</button>`).join("")}</div>`;
  }else if(t.type==="order"){
    body = t.html + `<div class="order"><p class="lbl">Tippe die Zahlen der Reihe nach an – zuerst die kleinste:</p>
      <div class="slots" id="slots"></div><div class="pool" id="pool"></div></div>`;
  }else if(t.type==="place"){
    body = t.html + numberLine({...t.line, id:"pl"}) + `<p class="placehint">Tippe auf den Zahlenstrahl. Mit ◀ ▶ kannst du den Pfeil um einen Strich verschieben.</p>
      <div class="row" style="margin-bottom:6px"><button class="btn ghost small" id="nl-l" aria-label="einen Strich nach links">◀</button><button class="btn ghost small" id="nl-r" aria-label="einen Strich nach rechts">▶</button></div>`;
  }
  app.innerHTML = `<div class="card">${head()}
      ${body}
      <div id="fb"></div>
      <div class="actions">
        ${needsCheck?`<button class="btn" id="check">Prüfen</button>`:""}
        ${t.type==="order"?`<button class="btn ghost" id="reset">↺ Neu ordnen</button>`:""}
        <button class="btn" id="nextBtn" hidden>Weiter →</button>
      </div>
      <details class="help"><summary>💡 So geht's</summary>${g.help()}</details>
    </div>`;
  const inputs = [...app.querySelectorAll("input.ans")];
  inputs.forEach((el,j)=>el.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault();
      if(S.done) return go();
      if(j<inputs.length-1 && !inputs[j+1].value) inputs[j+1].focus(); else check(); }
  }));
  if(inputs[0]) inputs[0].focus({preventScroll:true});
  const c = document.getElementById("check"); if(c) c.onclick = ()=>check();
  app.querySelectorAll(".cmpbtns button").forEach(b=>b.onclick=()=>check(b.dataset.c, b));
  if(t.type==="order") setupOrder();
  if(t.type==="place") setupPlace();
  document.getElementById("nextBtn").onclick = go;
  document.getElementById("quit").onclick = leave;
}

function setupOrder(){
  const t = S.task, slots = document.getElementById("slots"), pool = document.getElementById("pool");
  S.order = [];
  const paint = ()=>{
    slots.innerHTML = S.order.length ? S.order.map((j,k)=>`${k?'<span class="lt">&lt;</span>':""}<button class="tok" data-j="${j}">${t.items[j].html}</button>`).join("")
      : `<span class="ph">kleinste … grösste</span>`;
    pool.innerHTML = t.items.map((it,j)=> S.order.includes(j) ? "" : `<button class="tok" data-j="${j}">${it.html}</button>`).join("");
    slots.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ if(S.done) return; S.order = S.order.filter(x=>x!==+b.dataset.j); paint(); });
    pool.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ if(S.done) return; S.order.push(+b.dataset.j); paint(); });
    const c = document.getElementById("check"); if(c) c.disabled = S.order.length!==t.items.length;
  };
  document.getElementById("reset").onclick = ()=>{ if(S.done) return; S.order=[]; paint(); };
  paint();
}
function setupPlace(){
  const svg = document.getElementById("pl"), t = S.task;
  const x0=+svg.dataset.x0, x1=+svg.dataset.x1, total=+svg.dataset.total;
  S.placed = null;
  const c = document.getElementById("check"); c.disabled = true;
  const mark = svg.querySelector(".mark");
  const put = i=>{
    const x = x0+(x1-x0)*i/total;
    mark.innerHTML = `<path d="M ${x} 56 l -12 -22 h 24 z" fill="#2f5bea"/><rect x="${x-4}" y="14" width="8" height="22" rx="3" fill="#2f5bea"/>`;
  };
  const pt = svg.createSVGPoint();
  svg.addEventListener("pointerdown", e=>{
    if(S.done) return;
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let i = Math.round((p.x-x0)/(x1-x0)*total); i = Math.max(0, Math.min(total, i));
    S.placed = i; put(i); c.disabled = false;
  });
  S.putMark = put;
  const nudge = d=>{ if(S.done) return; const i = S.placed===null ? Math.round(total/2) : Math.max(0, Math.min(total, S.placed+d)); S.placed=i; put(i); c.disabled=false; };
  document.getElementById("nl-l").onclick = ()=>nudge(-1);
  document.getElementById("nl-r").onclick = ()=>nudge(1);
}

function check(choice, btn){
  if(S.done) return;
  const t = S.task;
  let ok = false, extra = "", given = "";
  const inputs = [...app.querySelectorAll("input.ans")];
  if(t.type==="cmp" || t.type==="choice"){
    const want = t.type==="cmp" ? t.answer : String(t.answer);
    ok = choice===want;
    btn.classList.add(ok?"ok":"no");
    if(t.type==="cmp") document.getElementById("slot").textContent = choice;
    given = t.type==="cmp" ? choice : btn.textContent.trim();
    app.querySelectorAll(".cmpbtns button").forEach(b=>{ if(b.dataset.c===want) b.classList.add("ok"); });
  }else if(t.type==="order"){
    if(S.order.length!==t.items.length) return;
    const vals = S.order.map(j=>t.items[j].v);
    ok = vals.every((v,k)=>k===0 || vals[k-1]<v);
    given = S.order.map(j=>t.items[j].txt).join(" < ");
    const sorted = t.items.map((_,j)=>j).sort((a,b)=>t.items[a].v-t.items[b].v);
    document.querySelectorAll("#slots .tok").forEach((b,k)=>b.classList.add(+b.dataset.j===sorted[k]?"ok":"no"));
  }else if(t.type==="place"){
    if(S.placed===null) return;
    ok = Math.abs(S.placed - t.target) <= (t.tol||0);
    given = t.label(S.placed);
    if(!ok){ const svg=document.getElementById("pl"); const x0=+svg.dataset.x0, x1=+svg.dataset.x1, total=+svg.dataset.total; const x=x0+(x1-x0)*t.target/total;
      svg.querySelector(".mark").insertAdjacentHTML("beforeend", `<path d="M ${x} 56 l -12 -22 h 24 z" fill="#127a3c"/><text x="${x}" y="8" text-anchor="middle" font-size="18" font-weight="800" fill="#127a3c">hier</text>`); }
  }else{
    if(inputs.some(el=>!el.value.trim())){ feedback("bad","Bitte fülle zuerst alles aus."); return; }
    const res = [];
    let invalid = "";
    if(t.type==="frac" || t.type==="fracdec"){
      const n = parseInt0(inputs[0].value), d = parseInt0(inputs[1].value);
      if(n===null || d===null || d===0){ invalid = "Schreibe beim Bruch oben und unten eine ganze Zahl (unten nicht 0)."; }
      else{
        const want = t.type==="frac" ? t.answer : t.frac;
        const same = n*want.d === d*want.n;
        const isRed = gcd(n,d)===1;
        const fok = same && (!t.reduced || isRed);
        res.push(fok, fok);
        if(same && t.reduced && !isRed) extra = "Der Wert stimmt, aber der Bruch ist noch nicht ganz gekürzt.";
      }
      if(t.type==="fracdec" && !invalid){
        const v = parse(inputs[2].value);
        if(v===null || Number.isNaN(v)) invalid = "Bei der Dezimalzahl: Schreibe zum Beispiel 0.75";
        else res.push(v===t.dec);
      }
    }else{
      const vals = inputs.map(el=>parse(el.value));
      if(vals.some(v=>v===null||Number.isNaN(v))) invalid = vals.some(Number.isNaN) ? "Höchstens drei Stellen nach dem Punkt." : "Das ist keine gültige Zahl. Schreibe zum Beispiel 4.25";
      else { const want = t.type==="input" ? [t.answer] : t.answers; vals.forEach((v,j)=>res.push(v===want[j])); }
    }
    if(invalid){ feedback("bad", invalid); return; }     // zählt nicht
    inputs.forEach((el,j)=>{ el.classList.toggle("ok",res[j]); el.classList.toggle("no",!res[j]); });
    ok = res.every(Boolean);
    given = t.type==="frac" ? `${inputs[0].value.trim()}/${inputs[1].value.trim()}`
      : t.type==="fracdec" ? `${inputs[0].value.trim()}/${inputs[1].value.trim()} = ${inputs[2].value.trim()}`
      : inputs.map(el=>el.value.trim()).join(" | ");
  }
  finish(ok, given, extra);
}

function feedback(kind, text){ document.getElementById("fb").innerHTML = `<div class="fb show ${kind}">${text}</div>`; }

function finish(ok, given, extra){
  S.done = true;
  const t = S.task, g = GOAL[t.goal], s = gs(g.id);
  app.querySelectorAll("input.ans").forEach(el=>el.readOnly=true);
  app.querySelectorAll(".cmpbtns button").forEach(b=>b.disabled=true);
  const c=document.getElementById("check"); if(c) c.hidden=true;
  const r=document.getElementById("reset"); if(r) r.hidden=true;
  s.n++; if(ok) s.ok++;
  let toast = "";
  if(S.mode==="goal"){
    if(t.probe){
      s.probed = true;
      if(ok){ s.lv = 2; s.pr = 1; s.streak = 1; toast = `🚀 Stark! Das kannst du schon – Stufe 1 überspringst du.`; }
    } else if(ok){
      s.streak = (s.streak||0) + 1;
      s.pr = Math.min(NEED, s.pr+1);
      if(s.pr>=NEED || s.streak>=STREAK){
        const fast = s.pr<NEED;
        if(s.lv<LEVELS){ s.lv++; s.pr=0; s.streak=0; toast = `🎉 Stufe ${s.lv-1} geschafft${fast?` – ${STREAK} richtig hintereinander`:""}! Jetzt kommt <b>Stufe ${s.lv}</b>.`; }
        else if(!s.done){ s.done=true; s.pr=NEED; S.goalDone = true;
          const nx = nextGoal(g.id);
          toast = `🏆 Super! Du hast «${g.title}» geschafft.${nx?`<br>Weiter geht es mit <b>${GOAL[nx].title}</b>.`:"<br>Du hast alle Lernziele geschafft – probier jetzt das Test-Training!"}`; }
        else s.pr = NEED;
      }
    } else { s.streak = 0; if(!s.done) s.pr = Math.max(0, s.pr-1); }
  } else {
    if(!ok && !S.twin) S.twinNext = t.goal;
    if(S.twin) S.twin = null; else S.qi++;
  }
  saveP();
  const entry = {nr:S.nr, thema:g.title, stufe:t.lv, frage:t.text, antworten:[given], loesung:t.show, punkte:ok?1:0, test:S.mode==="test"};
  S.log.push(entry); S.pending.push(entry); savePending();
  const fb = document.getElementById("fb");
  if(ok){
    fb.innerHTML = `<div class="fb show good">${pick(["Super! ⭐","Richtig! ⭐","Genau! ⭐","Stark! ⭐","Perfekt! ⭐"])}</div>
      <details class="way"><summary>Lösungsweg anschauen</summary><div class="explain ok">${t.explain}</div></details>`;
  } else {
    fb.innerHTML = `<div class="fb show bad">${extra || "Leider nicht richtig."}</div>
      <div class="explain"><h3>💡 So geht es</h3>${t.explain}<div class="ans">Lösung: ${t.showHtml||esc(t.show)}</div></div>
      <p class="sub" style="margin:10px 0 0">Lies die Erklärung genau. Danach bekommst du eine ähnliche Aufgabe.</p>`;
  }
  if(toast) fb.insertAdjacentHTML("beforeend", `<div class="toast">${toast}</div>`);
  if(S.mode==="test" && S.twinNext){ S.twin = S.twinNext; S.twinNext = null; }
  const n=document.getElementById("nextBtn"); n.hidden=false; n.focus({preventScroll:true});
  if(S.mode==="test" && S.qi>=S.queue.length && !S.twin) n.textContent = "Zum Resultat →";
  if(S.pending.length>=10 || toast) sendPending();
}
function nextGoal(from){
  const i = GOALS.findIndex(x=>x.id===from);
  const order = GOALS.slice(i+1).concat(GOALS.slice(0,i));
  const g = order.find(x=>!gs(x.id).done && !x.erw) || order.find(x=>!gs(x.id).done);
  return g ? g.id : null;
}
function go(){
  if(S.mode==="goal" && S.goalDone){
    S.goalDone = false;
    const nx = nextGoal(S.goal);
    if(nx){ sendPending(); S.goal = nx; P.last = nx; saveP(); } else { sendPending(); S=null; return home(); }
  }
  next();
}
function leave(){ sendPending(); S=null; home(); }

function testResult(){
  sendPending();
  const L = S.log.filter(l=>l.test);
  // Wertung: nach einer falschen Antwort folgt eine ähnliche Aufgabe – die zählt nicht für das Resultat
  const main = [];
  let skip=false; for(const l of L){ if(skip){ skip=false; continue; } main.push(l); if(!l.punkte) skip=true; }
  const p = main.filter(l=>l.punkte).length, n = main.length;
  const ratio = n? p/n : 0;
  const weak = [...new Set(main.filter(l=>!l.punkte).map(l=>l.thema))];
  app.innerHTML = `<div class="card result">
    <p class="sub" style="margin:0">📝 Test-Training · Glückszahl ${esc(gz)}</p>
    <div class="score">${p} / ${n}</div>
    <div class="stars">${ratio>=.9?"⭐⭐⭐":ratio>=.7?"⭐⭐":ratio>=.4?"⭐":"🙂"}</div>
    <p style="font-weight:700;margin:0">${ratio>=.9?"Du bist bereit für die Lernzielkontrolle!":ratio>=.7?"Schon gut – übe noch die markierten Lernziele.":"Übe die Lernziele unten noch einmal in Ruhe."}</p>
    ${weak.length?`<p class="sub" style="margin-top:14px">Das solltest du noch üben:</p><div class="lzkgrid">${weak.map(w=>{ const g=GOALS.find(x=>x.title===w); return `<button class="topic" data-k="${g.id}" style="--c:${g.c};min-height:0"><span class="ic">${g.ic}</span><span><b>${g.title}</b></span></button>`; }).join("")}</div>`:""}
    <ul class="list">${main.map((l,i)=>`<li><b>${i+1}.</b><span>${l.punkte?"✅":"❌"} ${esc(l.thema)} – <b>${esc(l.loesung)}</b></span></li>`).join("")}</ul>
    <div class="actions" style="justify-content:center"><button class="btn" id="again">Nochmals</button><button class="btn ghost" id="menu">Zur Übersicht</button></div>
  </div>`;
  document.getElementById("again").onclick = startTest;
  document.getElementById("menu").onclick = ()=>{ S=null; home(); };
  app.querySelectorAll(".lzkgrid .topic").forEach(b=>b.onclick=()=>startGoal(b.dataset.k));
}

/* ---------- Senden ---------- */
const QKEY = "uebung.queue";
function queue(){ try{ return JSON.parse(store.get(QKEY)||"[]"); }catch(e){ return []; } }
function sendOne(rec){
  return fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec),keepalive:true})
    .then(r=>r.text()).then(t=>{ if(!/"ok"\s*:\s*true/.test(t)) throw new Error("abgelehnt"); });
}
let flushing = false;
async function flush(){
  if(!ENDPOINT || flushing) return;
  flushing = true;
  try{
    let q = queue(), rest = [];
    for(const rec of q){ try{ await sendOne(rec); }catch(e){ rest.push(rec); } }
    const now = queue().slice(q.length);       // was inzwischen dazukam
    store.set(QKEY, JSON.stringify(rest.concat(now).slice(-60)));
  } finally { flushing = false; }
}
const PENDKEY = "uebung.pending."+UEBUNG;
function makeRec(items, thema, g){
  return {typ:"uebung-runde", v:2, uebung:UEBUNG, glueckszahl:g, thema, datum:new Date().toISOString(),
    punkte:items.filter(i=>i.punkte).length, max:items.length,
    aufgaben:items.map(i=>({nr:i.nr, thema:i.thema, stufe:i.stufe, frage:i.frage, antworten:i.antworten, loesung:i.loesung, punkte:i.punkte}))};
}
function curThema(){ return S.mode==="test" ? "Test-Training" : GOAL[S.goal].title; }
function savePending(){ if(S) store.set(PENDKEY, JSON.stringify({gz, thema:curThema(), items:S.pending})); }
function sendPending(){
  if(!S || !S.pending.length) return;
  const items = S.pending.splice(0);
  store.set(PENDKEY, "");
  if(!ENDPOINT) return;
  const q = queue(); q.push(makeRec(items, curThema(), gz)); store.set(QKEY, JSON.stringify(q.slice(-60)));
  flush();
}
function recoverPending(){      // Antworten, die beim letzten Mal nicht mehr verschickt wurden
  let p = null; try{ p = JSON.parse(store.get(PENDKEY)||"null"); }catch(e){}
  store.set(PENDKEY, "");
  if(p && p.items && p.items.length && ENDPOINT){ const q = queue(); q.push(makeRec(p.items, p.thema, p.gz)); store.set(QKEY, JSON.stringify(q.slice(-60))); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") sendPending(); });
window.addEventListener("pagehide", sendPending);

/* ---------- Lehrperson ---------- */
let TD = null;
function teacher(){
  if(!ENDPOINT){ alert("Die Auswertung ist noch nicht eingerichtet."); return; }
  const code = prompt("Passwort der Lehrperson:");
  if(code===null) return;
  const btn = document.getElementById("teach"); if(btn){ btn.textContent="lädt …"; btn.disabled=true; }
  const cb = "uecb"+Date.now();
  const s = document.createElement("script");
  let fertig = false;
  const reset = ()=>{ if(btn){ btn.textContent="Lehrperson"; btn.disabled=false; } };
  window[cb] = d=>{ fertig=true; delete window[cb]; s.remove(); reset();
    if(!d || !d.ok){ alert((d&&d.fehler)||"Keine Antwort."); return; }
    TD = d; teacherView(); };
  s.onerror = ()=>{ if(!fertig){ reset(); alert("Die Tabelle ist nicht erreichbar."); } };
  s.src = ENDPOINT+"?uebung="+encodeURIComponent(UEBUNG)+"&code="+encodeURIComponent(code.trim())+"&callback="+cb;
  document.head.appendChild(s);
  setTimeout(()=>{ if(!fertig){ reset(); } }, 20000);
}
const dt = iso=>{ const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}); };
const pct = (p,m)=> m? Math.round(p/m*100) : 0;
function teacherView(filter){
  pill.hidden = true;
  const R = (TD.runden||[]).slice().sort((a,b)=>String(b.zeit).localeCompare(String(a.zeit)));
  const kids = {};
  R.slice().reverse().forEach(r=>{ const k=kids[r.glueckszahl]||(kids[r.glueckszahl]={g:{},last:r.zeit,n:0}); k.last=r.zeit; k.n+=(r.aufgaben||[]).length;
    (r.aufgaben||[]).forEach(a=>{ const x=k.g[a.thema]||(k.g[a.thema]={lv:0,res:[]}); x.lv=Math.max(x.lv,+a.stufe||1); x.res.push(+a.punkte); }); });
  const cell = x=>{ if(!x) return `<td class="num" style="color:#a3adbf">–</td>`; const l=x.res.slice(-10); const p=Math.round(l.reduce((a,b)=>a+b,0)/l.length*100);
    return `<td class="num"><span class="tag ${p>=80?"ok":p>=50?"half":"no"}">S${x.lv} · ${p}%</span></td>`; };
  const list = Object.entries(kids).sort((a,b)=>(+a[0])-(+b[0]));
  const rows = R.filter(r=>!filter || r.glueckszahl===filter);
  app.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Resultate · ${esc(UEBUNG)}</h2>
      <div class="row no-print"><a class="btn ghost small" href="${esc(TD.tabelle||"#")}" target="_blank" rel="noopener">Google-Tabelle</a>
      <button class="btn ghost small" id="tprint">Drucken</button><button class="btn ghost small" id="tclose">Schliessen</button></div>
    </div>
    <p class="sub" style="margin-top:6px">S = höchste Stufe · % = Anteil richtig in den letzten 10 Aufgaben dieses Lernziels</p>
    <div style="overflow-x:auto"><table class="t"><tr><th>Zahl</th>${GOALS.map(g=>`<th class="num">${esc(g.code||"")} ${esc(g.title)}</th>`).join("")}<th class="num">Aufgaben</th><th>zuletzt</th></tr>
      ${list.map(([k,v])=>`<tr class="klick" data-gz="${esc(k)}"><td><b>${esc(k)}</b></td>${GOALS.map(g=>cell(v.g[g.title])).join("")}<td class="num">${v.n}</td><td>${dt(v.last)}</td></tr>`).join("") || `<tr><td>Noch keine Daten.</td></tr>`}
    </table></div>
    <h2 style="margin-top:22px">Abgaben ${filter?`von Glückszahl ${esc(filter)} <button class="linkish" id="tall">alle zeigen</button>`:""}</h2>
    <table class="t"><tr><th>Zeit</th><th>Zahl</th><th>Thema</th><th class="num">richtig</th><th></th></tr>
    ${rows.map(r=>`<tr class="klick" data-i="${R.indexOf(r)}"><td>${dt(r.zeit)}</td><td><b>${esc(r.glueckszahl)}</b></td><td>${esc(r.thema)}</td><td class="num">${r.punkte} / ${r.max}</td><td>›</td></tr>`).join("")}
    </table>
    <div id="detail"></div>
  </div>`;
  document.getElementById("tclose").onclick = ()=>{ TD=null; home(); };
  document.getElementById("tprint").onclick = ()=>print();
  const all = document.getElementById("tall"); if(all) all.onclick=()=>teacherView();
  app.querySelectorAll("tr[data-gz]").forEach(tr=>tr.onclick=()=>teacherView(tr.dataset.gz));
  app.querySelectorAll("tr[data-i]").forEach(tr=>tr.onclick=()=>{
    const r = R[+tr.dataset.i];
    document.getElementById("detail").innerHTML = `<h2 style="margin-top:22px">Glückszahl ${esc(r.glueckszahl)} · ${esc(r.thema)} · ${dt(r.zeit)}</h2>
      <table class="t"><tr><th>Nr.</th><th>Lernziel</th><th>Stufe</th><th>Aufgabe</th><th>Antwort</th><th>Lösung</th><th></th></tr>
      ${(r.aufgaben||[]).map(a=>`<tr><td>${a.nr}</td><td>${esc(a.thema)}</td><td>${a.stufe||""}</td><td>${esc(a.frage)}</td><td>${(a.antworten||[]).map(esc).join("<br>")}</td><td><b>${esc(a.loesung)}</b></td>
        <td><span class="tag ${a.punkte>=1?"ok":a.punkte>0?"half":"no"}">${a.punkte>=1?"✓":a.punkte>0?"½":"✗"}</span></td></tr>`).join("")}
      </table>`;
    document.getElementById("detail").scrollIntoView({behavior:"smooth"});
  });
}

recoverPending();
home();
flush();

</script>
